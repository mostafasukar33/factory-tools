<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>فلاش أون - دفتر الخزنة اتقفل</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="lib/ui.css">
<script>
/* دفتر الخزنة اتشال بطلب صاحب المشروع، والخزنة بقت جوه الحسابات بس.
   الصفحة دي بس علشان لو حد فتح الأيقونة القديمة يعرف يروح فين. مبتقراش ولا بتمسح أي بيانات. */
try { const u = JSON.parse(localStorage.getItem('fo_ui') || '{}'), t = u.theme || 'auto';
  document.documentElement.dataset.theme = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light'; } catch (e) {}
</script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,sans-serif;padding:16px;box-sizing:border-box}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow2)}
h1{font-size:var(--f4);margin:0 0 10px}
p{font-size:var(--f3);line-height:1.7;margin:0 0 12px;color:var(--sub)}
a{display:block;text-align:center;text-decoration:none;font-size:var(--f3);font-weight:700;padding:14px;border-radius:14px;background:var(--gold);color:#241b00;margin-top:16px}
</style>
</head>
<body>
<div class="box">
  <h1>دفتر الخزنة اتقفل</h1>
  <p>الخزنة بقت جوه برنامج <b>الحسابات</b> بس، واللي اتسجل هنا قبل كده اتنقل هناك.</p>
  <p>امسح الأيقونة دي من الموبايل: دوس عليها دوسة طويلة واختار <b>إزالة</b> أو <b>حذف</b>.</p>
  <a href="accounts.html">افتح الحسابات</a>
</div>
</body>
</html>
