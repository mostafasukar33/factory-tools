<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="فلاش أون">
<title>فلاش أون - الرئيسية</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;font-family:'Cairo',system-ui,sans-serif;background:#F5F2EA;color:#111;display:flex;flex-direction:column;align-items:center;padding:calc(28px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.logo{width:130px;max-width:40vw;border-radius:18px;background:#fff;box-shadow:0 4px 18px #0002}
h1{margin:12px 0 2px;font-size:28px;font-weight:800}
p.sub{margin:0 0 20px;color:#9C7420;font-weight:700;text-align:center}
.tools{width:100%;max-width:460px;display:grid;gap:16px}
/* الأداة الأساسية (دفتر الخزنة) = كارت كبير فوق */
.tool.main{display:flex;align-items:center;gap:16px;min-height:104px;padding:16px 20px;border-radius:20px;background:#111;color:#fff;text-decoration:none;font-size:26px;font-weight:800;border:3px solid #DAAE57;box-shadow:0 6px 18px #0004}
.tool.main svg{width:52px;height:52px;flex:none;color:#DAAE57}
.tool.main small{display:block;font-size:14px;font-weight:600;color:#ccc;margin-top:2px}
.sec{width:100%;max-width:460px;margin:22px 0 10px;font-size:15px;font-weight:800;color:#9C7420;display:flex;align-items:center;gap:10px}
.sec:after{content:'';flex:1;height:2px;background:#DAAE57;opacity:.5}
/* باقي الأدوات = مربعات صغيرة، اتنين جنب بعض (بتتزود لوحدها لو زودت أدوات) */
.grid{width:100%;max-width:460px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tool.sm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:104px;padding:12px 8px;border-radius:16px;background:#fff;color:#111;text-decoration:none;font-size:17px;font-weight:800;text-align:center;border:2px solid #DAAE57;box-shadow:0 2px 8px #0002}
.tool.sm:active,.tool.main:active{transform:scale(.98)}
.tool.sm svg{width:34px;height:34px;color:#9C7420}
</style>
</head>
<body>
<img class="logo" src="icons/logo.jpg" alt="فلاش أون">
<h1>فلاش أون</h1>
<p class="sub">لصناعة الخراطيم والكابلات الكهربائية</p>

<div class="tools" style="width:100%;max-width:460px">
  <a class="tool main" href="cash.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M6 10v5M18 10v5"/></svg>
    <span>دفتر الخزنة<small>مصروفات وإيرادات وأرصدة وتقارير PDF</small></span>
  </a>
</div>

<div class="sec">باقي الأدوات</div>
<div class="grid">
  <!-- لإضافة أداة جديدة: انسخ أي <a class="tool sm"> وغيّر الرابط والأيقونة والاسم -->
    <a class="tool sm" href="quote.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>
      <span>عرض سعر</span>
    </a>
    <a class="tool sm" href="cost.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M8 6h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/></svg>
      <span>تكلفة الكيلو</span>
    </a>
    <a class="tool sm" href="delivery.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 6h13v10H1zM14 9h4l4 4v3h-8z"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      <span>إذن تسليم</span>
    </a>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).then(reg => {
    reg.update().catch(() => {});
    // نخزّن كل الأدوات علشان تفتح حتى من غير نت
    document.querySelectorAll('a.tool').forEach(a => fetch(a.href, {cache: 'no-store'}).catch(() => {}));
  }).catch(() => {});
  // لو نسخة جديدة من التحديث اشتغلت، نعيد تحميل الصفحة مرة واحدة علشان تجيب الأحدث
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had) { had = true; return; }
    if (!sessionStorage.getItem('sw_reload')) { sessionStorage.setItem('sw_reload', '1'); location.reload(); }
  });
}
</script>
</body>
</html>
