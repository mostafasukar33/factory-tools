<head>

<title>حركة السوق - فلاش أون</title>

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<script>
/* المظهر (تلقائي / فاتح / داكن) وحجم الخط: إعداد على الجهاز بس (نفس مفتاح باقي البرنامج fo_ui)، بيتطبق قبل ما الصفحة تترسم */
function uiGet() { try { return Object.assign({theme: 'auto', fs: '1'}, JSON.parse(localStorage.getItem('fo_ui') || '{}')); } catch (e) { return {theme: 'auto', fs: '1'}; } }
function uiSet(o) { try { localStorage.setItem('fo_ui', JSON.stringify(Object.assign(uiGet(), o))); } catch (e) {} uiApply(); }
function uiApply() {
  const u = uiGet(), r = document.documentElement;
  const dark = u.theme === 'dark' || (u.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  r.style.setProperty('--z', u.fs); r.dataset.fs = u.fs === '1' ? '' : 'z';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0d0c0a' : '#17150f';
}
uiApply();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', uiApply); } catch (e) {}
</script>
<style>
:root{--gold:#D9AE57;--gold-d:#8F6B1B;--gold-l:#FAF4E4;--ink:#24211b;--bg:#F4F3EF;--line:#E7E3D8;--red:#BF3B30;--red-l:#FBEDEB;--green:#1E8A46;--green-l:#E8F5EC;--card:#fff;--sub:#7d7765;--row:#EFEBDF;--insta:#5B3FA8;--voda:#C0293D;--wait:#A9731A;--shadow:0 1px 2px #1b150a0d,0 1px 6px #1b150a08;--field:#D9D2BD}
html[data-theme=dark]{color-scheme:dark;--bg:#12110e;--line:#34312a;--gold-l:#2a2312;--gold-d:#DDB765;--ink:#ECE8DC;--red:#FF8279;--red-l:#3a1d1a;--green:#52C97A;--green-l:#15291b;--card:#1c1b16;--sub:#9a937f;--row:#2a2822;--wait:#E9C46A;--shadow:0 1px 2px #0009;--field:#4a463a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;touch-action:manipulation;min-height:100vh}
html[data-fs=z] main{zoom:var(--z)}
button,input,textarea{font-family:inherit;color:inherit}
.money{direction:ltr;unicode-bidi:isolate;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
/* الشريط فوق: رفيع */
.top{background:#17150f;color:#fff;padding:calc(7px + env(safe-area-inset-top)) 14px 7px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--gold);min-height:50px}
html[data-theme=dark] .top{background:#0d0c0a}
.top img{width:30px;height:30px;border-radius:7px;background:#fff}
.top h1{font-size:17px;margin:0;font-weight:800;line-height:1.2}
.top h1 small{color:var(--gold);font-size:12px;font-weight:600;margin-inline-start:8px}
.top .back{background:none;border:0;color:#fff;font-size:16px;font-weight:800;padding:6px 0;cursor:pointer}
.dot{margin-inline-start:auto;font-size:12px;font-weight:700;color:#8fd19e;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:#3ccf6a;display:inline-block}
.dot.w{color:#F2D27A}.dot.w i{background:#E9B930}
.dot.off{color:#bbb}.dot.off i{background:#888}
main{padding:12px 12px 28px;max-width:560px;margin:0 auto}
main.tabbed{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* شريط التبويبات تحت */
#tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;min-height:54px;position:relative}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--gold-d)}
#tabs button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
/* أساسيات */
.lbl{font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 4px 5px;display:flex;justify-content:space-between;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow)}
.p1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p1 span{font-size:13.5px;color:var(--sub);font-weight:700}
.p1 b{font-size:27px;color:var(--green)}.p1 b.neg{color:var(--red)}
.pn{display:grid;grid-template-columns:repeat(var(--c,3),1fr);margin-top:9px;border-top:1px solid var(--row);padding-top:8px}
.pn.first{margin-top:0;border-top:0;padding-top:0}
.cap{margin-top:9px;border-top:1px solid var(--row);padding-top:7px;font-size:12px;color:var(--sub);font-weight:700}
.pn div{text-align:center;border-inline-start:1px solid var(--row);padding:0 2px}.pn div:first-child{border-inline-start:0}
.pn span{display:block;font-size:11.5px;color:var(--sub);font-weight:700;line-height:1.3;min-height:30px;display:flex;align-items:flex-end;justify-content:center}
.pn b{display:block;font-size:15.5px;font-weight:800}.pn b.neg{color:var(--red)}
.qa{display:grid;grid-template-columns:1fr .85fr 1.3fr;gap:8px;margin-top:10px}
.qb{height:44px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-weight:700;font-size:14.5px;padding:0 4px;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.qb.g{background:var(--green);border-color:var(--green);color:#fff}
html[data-theme=dark] .qb.g{color:#0b1a10}
html[data-theme=dark] .seg button.on{background:#3a352a;color:#ECE8DC}
.qb:active{transform:scale(.98)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;min-height:48px;border-bottom:1px solid var(--row);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--gold-l)}
.row .m{min-width:0;flex:1}
.row .m b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--sub);font-size:12px;font-weight:600}
.row .a{text-align:left;flex:none}
.row .a .money{display:block;font-size:16px}
.row .bal{font-size:16px;white-space:nowrap;flex:none}
.row .bal.z{color:var(--sub);font-weight:600;font-size:14px}
.nw{font-size:11px;font-weight:800;background:#17150f;color:var(--gold);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.st{display:block;font-size:11.5px;font-weight:700;white-space:nowrap}
.ok{color:var(--green)}.wt{color:var(--wait)}.bk{color:var(--red)}.ns{color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-weight:600;font-size:14.5px}
.alert{display:block;width:100%;text-align:right;background:var(--red-l);color:var(--red);border:1px solid var(--red);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14.5px;margin-bottom:10px;cursor:pointer}
.lnk{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--gold-d);font-weight:800;font-size:14.5px;padding:8px;cursor:pointer}
.search{width:100%;height:46px;border:1px solid var(--field);border-radius:11px;background:var(--card);padding:0 14px;font-size:16px;outline:none}
.search:focus,.inp2:focus{border-color:var(--gold);box-shadow:0 0 0 3px #D9AE5740}
.sr{display:grid;grid-template-columns:1fr auto;gap:8px}
.sbtn{border:1px solid var(--ink);background:var(--card);border-radius:10px;height:46px;padding:0 14px;font-weight:700;font-size:14.5px;cursor:pointer}
.hint{text-align:center;font-size:12.5px;color:var(--sub);margin:8px 0 0;font-weight:600}
/* مبلغ وأزرار */
.cust{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
.cust b{font-size:18px;font-weight:800;line-height:1.35}
.cust div{text-align:left;flex:none}
.cust div span{font-size:12px;color:var(--sub);font-weight:700;display:block}
.cust div .money{font-size:21px}
.cust div .z{font-size:14px;color:var(--sub);font-weight:700}
.note{background:var(--red-l);color:var(--red);border-radius:10px;padding:7px 12px;font-weight:700;margin-top:10px;font-size:14px}
.amt{margin-top:10px;background:var(--card);border:1.5px solid var(--gold);border-radius:13px;height:68px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:text}
.amt input{width:62%;border:0;background:none;outline:none;text-align:center;font-size:36px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--gold)}
.amt input::placeholder{color:#c9c2ad}
.amt em{font-style:normal;font-size:16px;color:var(--sub);font-weight:700}
.amt.sm{height:56px}.amt.sm input{font-size:28px}
.big{width:100%;height:54px;border:0;border-radius:12px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;cursor:pointer}
.big:active{transform:scale(.98)}
.b-cash{background:var(--green);color:#fff}
.b-insta{background:var(--insta);color:#fff}
.b-voda{background:var(--voda);color:#fff}
html[data-theme=dark] .b-cash{color:#0b1a10}
.b-again{background:#24211b;color:#fff}
html[data-theme=dark] .b-again{background:#34312a}
.b-home{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.b-red{background:var(--red);color:#fff}
.b-redo{background:var(--card);color:var(--red);border:1px solid var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cat{height:52px;border:1px solid var(--field);background:var(--card);border-radius:12px;font-weight:700;font-size:16.5px;cursor:pointer;box-shadow:var(--shadow)}
.cat:active,.cat.on{background:var(--gold-l);border-color:var(--gold)}
.inp2{width:100%;height:48px;border:1px solid var(--field);border-radius:11px;background:var(--card);padding:0 14px;font-size:16px;outline:none;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--gold);background:var(--gold-l);border-radius:20px;padding:4px 13px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#241b00}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:4px;background:var(--row);border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* شاشة اتسجلت */
.done{padding:26px 10px 0;text-align:center}
.chk{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:800}
html[data-theme=dark] .chk{color:#0b1a10}
.done h2{font-size:23px;margin:0;color:var(--green);font-weight:800}
.sent{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:14px;font-size:18px;font-weight:700;line-height:1.7;box-shadow:var(--shadow)}
.sent .money{font-size:22px}
.sent small{display:block;font-size:13.5px;font-weight:700;margin-top:4px}
.oops{display:inline-block;margin:16px 8px 0;background:none;border:0;color:var(--red);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:underline}
.oops.n{color:var(--gold-d)}
/* الأرشيف */
.wk{margin-bottom:12px}
.wk>.panel{border-radius:14px 14px 0 0;border-bottom:0}
.wk>.panel .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.wk>.panel .t b{font-size:15px}.wk>.panel .t span{font-size:12px;color:var(--sub);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow)}
.tbl th{font-size:11.5px;color:var(--sub);font-weight:700;padding:6px 3px;background:var(--gold-l);line-height:1.25}
.tbl td{padding:8px 3px;border-top:1px solid var(--row);text-align:center;font-weight:700;direction:ltr;font-variant-numeric:tabular-nums}
.tbl td:first-child{direction:rtl;text-align:right;padding-inline-start:12px}
.tbl td small{display:block;color:var(--sub);font-size:11px;font-weight:600}
.tbl tr[data-d]{cursor:pointer}.tbl tr[data-d]:active td{background:var(--gold-l)}
.tbl .neg{color:var(--red)}.tbl .z{color:var(--sub);font-weight:500}
.dnav{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px}
.dnav button{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:22px;font-weight:800;line-height:1;cursor:pointer;color:var(--ink);padding:0}
.dnav button:disabled{opacity:.35}
.dnav span{flex:1;text-align:center;border:1px solid var(--gold);background:var(--gold-l);border-radius:10px;padding:6px 10px;font-weight:800;font-size:15px;color:var(--gold-d)}
.pick{position:relative;display:block;text-align:center;border:1px solid var(--field);background:var(--card);border-radius:10px;height:42px;line-height:40px;font-weight:700;font-size:14.5px;margin-bottom:10px;cursor:pointer;overflow:hidden}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.more{display:block;width:100%;border:1px dashed var(--field);background:none;border-radius:12px;height:44px;font-weight:700;color:var(--gold-d);cursor:pointer;font-size:14.5px}
/* إعدادات */
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 9px;font-weight:800;color:var(--gold-d)}
.card label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:10px 0 5px}.card h2+label{margin-top:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--row);font-size:14.5px;font-weight:600}.kv:last-of-type{border-bottom:0}
.kv b{font-weight:700}
.card .big{height:46px;font-size:15.5px;margin-top:10px}
/* نوافذ (تعديل وتأكيد): بتطلع من تحت */
.mask{position:fixed;inset:0;background:#000a;z-index:50;display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
.modal{background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:92vh;overflow:auto}
.modal::before{content:'';display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.modal h3{margin:0 0 8px;font-size:17px;font-weight:800;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.modal h3 small{font-size:12px;color:var(--sub);font-weight:600}
.modal p{margin:0 0 10px;font-size:16px;font-weight:700;line-height:1.7}
.modal .inp{width:100%;height:50px;border:1px solid var(--field);border-radius:11px;background:var(--card);padding:0 14px;font-size:18px;outline:none;margin-bottom:6px}
.modal .big{height:50px;font-size:16.5px}
.modal .row2{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.modal .lnk{margin-top:4px}
#toast{position:fixed;top:calc(62px + env(safe-area-inset-top));inset-inline:16px;margin:auto;max-width:420px;background:#17150f;color:#fff;border:1px solid var(--gold);padding:10px 14px;border-radius:12px;text-align:center;font-weight:700;font-size:14.5px;z-index:60;display:none;pointer-events:none}
.gate{text-align:center;padding:50px 18px}
.gate img{width:90px;border-radius:18px;background:#fff;box-shadow:0 4px 18px #0002}
.gate h2{font-size:22px;margin:14px 0 6px}
.gate p{font-size:16.5px;font-weight:700;color:var(--sub);line-height:1.8}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav id="tabs"></nav>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/*
  حركة السوق — تطبيق الشريك (فلاش أون)
  -------------------------------------
  - الشريك بيسجل اللي حصّله من عملاء السوق. مفيش كلمة سر: الربط بييجي من "رابط الربط" اللي مصطفى بيبعته (#marketjoin=...).
  - كل حاجة متخزنة على الموبايل في fo_mkt_v1، وبتتبعت لشيت "حركة السوق" (منفصل عن شيت الحسابات) أول ما يبقى فيه نت.
  - مفيش اعتماد على "حالة النت" اللي المتصفح بيقولها: بنجرب الطلب ونتعامل مع الفشل، واللي متبعتش بيفضل مستني ويتبعت لوحده.
  - كل عملية ليها id ثابت، فمفيش تكرار أبداً حتى لو اتبعتت كذا مرة.
  - المبالغ بالقرش كأرقام صحيحة (زي برنامج الحسابات). العملية: {id, t:'pay', cid, cname, newc, amt, m: cash|insta|voda, ts, upd, del}
  - حالة العملية بيكتبها مصطفى في سجل لوحده (st_<id>): ok/ov = التحويل وصل، done = اتنقلت للحسابات، back/bv = رجّعها بملاحظة.
    ov و bv بيتقارنوا بـ upd بتاع العملية، فلو الشريك عدّلها بعد كده الحالة القديمة بتتلغي لوحدها.
  - أرصدة عملاء السوق (cust) بيبعتها برنامج الحسابات. الرصيد المعروض = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش.
  - الشاشات: تبويبات تحت (الرئيسية / العملاء / الأرشيف / الإعدادات). التعديل والمسح بنافذة من تحت (editSheet) على أي حركة لسه متنقلتش.
*/
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const normDigits = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => normDigits(s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };
const pad2 = n => String(n).padStart(2, '0');
const dayOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const today = () => dayOf(Date.now());
const timeOf = ms => { const d = new Date(ms), h = d.getHours(); return `${h % 12 || 12}:${pad2(d.getMinutes())} ${h < 12 ? 'ص' : 'م'}`; };
const M_BTN = {cash: '💵 كاش معايا', insta: '📱 إنستا لمصطفى', voda: '📱 فودافون لمصطفى'};
const M_TXT = {cash: 'كاش معايا', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const M_SAID = {cash: 'كاش', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};

const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
(function join() {

/* ====================== الحسابات ====================== */
const stOf = o => S.st['st_' + o.id];
function opState(o) {               // done | back | wait (عند مصطفى) | unsent (لسه على الموبايل)
  const s = stOf(o);
  if (s && s.done) return 'done';
  if (s && s.back && s.bv === o.upd) return 'back';
  return o.sy === o.upd ? 'wait' : 'unsent';
}
/* العميل الجديد بعد ما مصطفى يربطه بحساب: عملياته بتتعرض تحت الحساب ده */
function aliases() {
  const a = {};
  Object.values(S.st).forEach(s => { const o = S.ops[s.op]; if (s.pid && o && o.cid && o.cid !== s.pid) a[o.cid] = s.pid; });
  return a;
}
const liveOps = () => Object.values(S.ops).filter(o => !o.del);
const payOps = () => liveOps().filter(o => o.t === 'pay');
function customers() {
  const al = aliases(), m = new Map();
  Object.values(S.cust).forEach(c => { if (!c.del) m.set(c.id, {id: c.id, name: c.name, bal: c.bal || 0}); });
  S.newc.forEach(c => { if (!al[c.id] && !m.has(c.id)) m.set(c.id, {id: c.id, name: c.name, bal: 0, nw: true}); });
  payOps().forEach(o => { const id = al[o.cid] || o.cid; if (!m.has(id)) m.set(id, {id, name: o.cname, bal: 0, nw: id.startsWith('n_')}); });
  /* الصافي = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش */
  payOps().forEach(o => { if (opState(o) !== 'done') { const c = m.get(al[o.cid] || o.cid); if (c) c.bal -= o.amt; } });
  return m;
}
const custOps = (cid, al) => payOps().filter(o => (al[o.cid] || o.cid) === cid);
/* اللي معايا كاش دلوقتي = كاش حصّلته − مصروفات − دفعات موردين − كاش سلمته لمصطفى (التحويلات مش على الشريك) */
const cashSign = o => o.t === 'pay' ? (o.m === 'cash' ? 1 : 0) : -1;
const cashNow = () => liveOps().reduce((s, o) => s + cashSign(o) * o.amt, 0);
/* حصّلت / راح لمصطفى (تحويلات + كاش سلمته) / مصروف (مصروفات + دفعات موردين) / معايا */
function sums(ops) {
  let col = 0, toM = 0, sp = 0;
  ops.forEach(o => { if (o.t === 'pay') { col += o.amt; if (o.m !== 'cash') toM += o.amt; } else if (o.t === 'hand') toM += o.amt; else sp += o.amt; });
  return {col, toM, sp, left: col - toM - sp};
}
const opWhat = o => o.t === 'pay' ? o.cname : o.t === 'exp' ? o.cat + (o.note ? ' — ' + o.note : '') : o.t === 'spay' ? 'دفعت لـ ' + o.sname : 'سلمت لمصطفى';
const opHow = o => o.t === 'pay' ? M_TXT[o.m] : o.t === 'hand' ? 'كاش' : o.t === 'exp' ? 'مصروف' : 'دفعة مورد';
const pending = () => Object.values(S.ops).filter(o => o.sy !== o.upd);
const backs = () => liveOps().filter(o => opState(o) === 'back').sort((a, b) => b.ts - a.ts);

/* ====================== الاتصال بالشيت ====================== */
let online = null, syncing = false, again = false;
async function callSheet(body, ms = 25000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(S.u, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key: S.k}, body)), signal: ctl.signal});
    return JSON.parse(await r.text());
  } finally { clearTimeout(tm); }
}
function merge(r) {
  if (!r || !r.id || !r.data) return false;
  const box = r.kind === 'op' ? S.ops : r.kind === 'st' ? S.st : r.kind === 'cust' ? S.cust : null;
  if (!box) return false;
  const cur = box[r.id];
  if (cur && cur.upd > r.upd) return false;
  if (cur && cur.upd === r.upd) { if (r.kind === 'op') cur.sy = cur.upd; return false; }
  box[r.id] = Object.assign({}, r.data, {id: r.id, upd: r.upd, del: !!r.del}, r.kind === 'op' ? {sy: r.upd} : {});
  return true;
}
const view = o => [dayOf(o.ts) + ' ' + timeOf(o.ts), o.t === 'pay' ? o.cname + (o.newc ? ' (جديد)' : '') : o.t === 'spay' ? o.sname : o.t === 'exp' ? o.cat + (o.note ? ' — ' + o.note : '') : 'تسليم لمصطفى', o.amt / 100, o.t === 'pay' ? M_SAID[o.m] || o.m : {exp: 'مصروف', spay: 'دفعة مورد', hand: 'تسليم كاش'}[o.t], ''];
async function sync() {
  if (!S.u || S.bad) return;
  if (syncing) { again = true; return; }
  syncing = true; let changed = false;
  try {
    let p = pending();
    while (p.length) {
      const batch = p.slice(0, 40);
      const rows = batch.map(o => { const d = Object.assign({}, o); delete d.sy; return {id: o.id, kind: 'op', upd: o.upd, del: !!o.del, view: view(o), data: d}; });
      const j = await callSheet({action: 'push', who: 'm', rows});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true) throw new Error('push');
      const ack = new Set(j.ack || []);
      batch.forEach((o, i) => { if (ack.has(o.id) && o.upd === rows[i].upd) o.sy = o.upd; });
      if (batch.some(o => !ack.has(o.id))) throw new Error('ack');
      changed = true; save(); p = pending();
    }
    let more = true;
    while (more) {
      const j = await callSheet({action: 'pull', since: S.cursor});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true || !Array.isArray(j.rows)) throw new Error('pull');
      j.rows.forEach(r => { if (merge(r)) changed = true; });
      S.cursor = j.next || S.cursor; more = !!j.more;
    }
    online = true; S.lastOk = Date.now();
  } catch (e) { online = false; }
  finally {
    syncing = false; save(); drawTop();
    if (changed) refresh();
    if (again) { again = false; setTimeout(sync, 300); }
  }
}

/* ---------- الأرشيف: كل أسبوع وكل يوم فيه حصّلت وصرفت وسلمت لمصطفى كام ---------- */
const weekStart = iso => addDays(iso, -((dowOf(iso) + 1) % 7));   // الأسبوع بيبدأ سبت
const dayLabel = d => `${AR_DAYS[dowOf(d)]}<small>${+d.slice(8)}${RLM}/${RLM}${+d.slice(5, 7)}</small>`;
const nz = n => n ? fmt(n) : '<span class="z">—</span>';
let archWeeks = 4;
function drawArchive() {
  const t = today(), all = liveOps(), byDay = new Map();
  all.forEach(o => { const d = dayOf(o.ts); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(o); });
  const weeks = new Map();
  [...byDay.keys()].forEach(d => { const w = weekStart(d); if (!weeks.has(w)) weeks.set(w, []); weeks.get(w).push(d); });
  if (!weeks.has(weekStart(t))) weeks.set(weekStart(t), []);
  const ws = [...weeks.keys()].sort().reverse(), shown = ws.slice(0, archWeeks);
  $('#main').innerHTML = `<label class="pick">📅 اختار يوم تفتحه<input type="date" id="aDay" value="${t}" max="${t}"></label>
    ${shown.map(w => {
      const days = weeks.get(w).sort().reverse(), ops = days.flatMap(d => byDay.get(d)), s = sums(ops), cur = w === weekStart(t);
      return `<section class="wk"><div class="panel"><div class="t"><b>${cur ? 'الأسبوع ده' : 'أسبوع'}</b><span>من ${+w.slice(8)}/${+w.slice(5, 7)} إلى ${+addDays(w, 6).slice(8)}/${+addDays(w, 6).slice(5, 7)}</span></div>${pnHtml(s, 4)}</div>
        ${days.length ? `<table class="tbl"><thead><tr><th>اليوم</th><th>حصّلت</th><th>صرفت</th><th>سلّمت لمصطفى</th><th>معايا</th></tr></thead><tbody>
          ${days.map(d => { const x = sums(byDay.get(d)); return `<tr data-d="${d}"><td>${dayLabel(d)}</td><td>${nz(x.col)}</td><td>${nz(x.sp)}</td><td>${nz(x.toM)}</td><td class="${x.left < 0 ? 'neg' : ''}">${x.left < 0 ? '-' : ''}${nz(Math.abs(x.left))}</td></tr>`; }).join('')}</tbody></table>` : '<div class="list" style="border-radius:0 0 14px 14px"><div class="empty">لسه مفيش حركات الأسبوع ده</div></div>'}</section>`;
    }).join('')}
    ${ws.length > shown.length ? '<button class="more" id="aMore" type="button">اعرض أسابيع أقدم</button>' : ''}
    <p class="hint">"سلّمت لمصطفى" = التحويلات (إنستا/فودافون) + الكاش اللي سلمته.<br>"معايا" = اللي فضل معاك كاش من اليوم ده.</p>`;

  if ($('#aMore')) $('#aMore').onclick = () => { archWeeks += 4; drawArchive(); };
}
function drawDay() {
  const t = today(), d = scr.day, ops = liveOps().filter(o => dayOf(o.ts) === d).sort((a, b) => b.ts - a.ts), s = sums(ops);
  $('#main').innerHTML = `<div class="dnav"><button type="button" id="aPrev" title="اليوم اللي قبله">›</button><span>${AR_DAYS[dowOf(d)]} ${dispDate(d)}${d === t ? ' · النهارده' : ''}</span><button type="button" id="aNext" title="اليوم اللي بعده"${d >= t ? ' disabled' : ''}>‹</button></div>
    <label class="pick">📅 اختار يوم<input type="date" id="aDay" value="${d}" max="${t}"></label>
    <section class="panel">${pnHtml(s, 4, true)}</section>
    <div class="lbl"><span>حركات اليوم (${ops.length})</span><span>دوس على أي حركة تعدّلها</span></div>
    ${ops.length ? `<div class="list">${ops.map(o => opRow(o)).join('')}</div>` : '<div class="list"><div class="empty">مفيش حركات في اليوم ده</div></div>'}
    <button class="lnk" id="aBack" type="button">‹ كل الأسابيع</button>`;
  $('#aPrev').onclick = () => nav('a/' + addDays(d, -1), true);
  $('#aNext').onclick = () => { if (d < t) nav('a/' + addDays(d, 1), true); };
  $('#aDay').onchange = e => { if (isDay(e.target.value)) nav('a/' + e.target.value, true); };
  $('#aBack').onclick = () => nav('a', true);
  bindOps('#main');
}

/* ---------- الإعدادات: المظهر وحجم الخط وحالة الاتصال ---------- */
function drawSettings() {
  const u = uiGet(), n = pending().length;
  $('#main').innerHTML = `<div class="card"><h2>المظهر</h2>
      <label>اللون</label><div class="seg" id="uiTheme" style="--n:3">${[['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.theme === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label>حجم الخط</label><div class="seg" id="uiFs">${[['1', 'عادي'], ['1.12', 'كبير']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.fs === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <p class="hint" style="text-align:right">"تلقائي" بيمشي على إعداد الموبايل (ليلي بالليل). الإعداد ده على الموبايل ده بس.</p></div>
    <div class="card"><h2>الاتصال</h2>
      <div class="kv"><span>الحالة</span><b class="${S.bad ? 'bk' : online === false ? 'wt' : 'ok'}">${S.bad ? 'الربط اتغير — كلّم مصطفى' : online === false ? 'مفيش نت دلوقتي' : 'متصل بمصطفى'}</b></div>
      <div class="kv"><span>آخر تحديث</span><b>${S.lastOk ? dispDate(dayOf(S.lastOk)) + ' ' + timeOf(S.lastOk) : '—'}</b></div>
      <div class="kv"><span>حركات مستنية تتبعت</span><b class="${n ? 'wt' : ''}">${n}</b></div>
      <button class="big b-home" id="sSync" type="button">🔄 حدّث دلوقتي</button>
      <p class="hint" style="text-align:right">الحركات بتتبعت وبتتحدث لوحدها كل كام ثانية. ولو مفيش نت بتتحفظ على الموبايل وتتبعت أول ما يرجع.</p></div>
    <div class="card"><h2>عن التطبيق</h2><div class="kv"><span>التطبيق</span><b>حركة السوق — فلاش أون</b></div><p class="hint" style="text-align:right;margin-top:6px">مفيش كلمة سر ولا حاجة تتظبط. أي غلطة تقدر تعدّلها أو تمسحها من الرئيسية أو الأرشيف، طول ما مصطفى لسه منقلهاش لحساباته.</p></div>`;
  $$('#uiTheme button').forEach(b => b.onclick = () => { uiSet({theme: b.dataset.v}); drawSettings(); });
  $$('#uiFs button').forEach(b => b.onclick = () => { uiSet({fs: b.dataset.v}); drawSettings(); });
  $('#sSync').onclick = async () => {
    $('#sSync').disabled = true; $('#sSync').textContent = '⏳ بحدّث…';
    await sync(); await new Promise(r => setTimeout(r, 400));
    toast(online === false ? 'مفيش نت دلوقتي. هيتبعت لوحده.' : '✔ اتحدّث');
    if (scr.v === 's') drawSettings();
  };
}

route();
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
