<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17150f">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="حركة السوق">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>حركة السوق - فلاش أون</title>
<link rel="manifest" href="market.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>
/* المظهر (تلقائي / فاتح / داكن) وحجم الخط: إعداد على الجهاز بس (نفس مفتاح باقي البرنامج fo_ui)، بيتطبق قبل ما الصفحة تترسم */
function uiGet() { try { return Object.assign({theme: 'auto', fs: '1'}, JSON.parse(localStorage.getItem('fo_ui') || '{}')); } catch (e) { return {theme: 'auto', fs: '1'}; } }
function uiSet(o) { try { localStorage.setItem('fo_ui', JSON.stringify(Object.assign(uiGet(), o))); } catch (e) {} uiApply(); }
function uiApply() {
  const u = uiGet(), r = document.documentElement;
  const dark = u.theme === 'dark' || (u.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  r.style.setProperty('--z', u.fs); r.dataset.fs = u.fs === '1' ? '' : 'z';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0d0c0a' : '#17150f';
}
uiApply();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', uiApply); } catch (e) {}
</script>
<style>
/* الفاتح "only light" علشان أندرويد ميغمّقش الصفحة لوحده (Auto Dark) لما الموبايل نفسه على الوضع الليلي */
:root{color-scheme:only light;--gold:#D9AE57;--gold-d:#8F6B1B;--gold-l:#FAF4E4;--ink:#24211b;--bg:#F4F3EF;--line:#E7E3D8;--red:#BF3B30;--red-l:#FBEDEB;--green:#1E8A46;--green-l:#E8F5EC;--card:#fff;--sub:#7d7765;--row:#EFEBDF;--insta:#5B3FA8;--voda:#C0293D;--wait:#A9731A;--shadow:0 1px 2px #1b150a0d,0 1px 6px #1b150a08;--field:#D9D2BD;--exp:#B4672E;--exp-l:#FAEFE3;--sup:#3C7A8A;--sup-l:#E5F1F4}
/* لما الموبايل على الليلي واختار "فاتح": سامسونج بيغمّق الصفحة لوحده إلا لو الصفحة بتقول إنها بتدعم الليلي ("light dark")،
   فبنقوله كده والألوان كلها بتاعتنا (خلفية الصفحة والخانات متحددة)، فالشكل بيفضل فاتح */
@media (prefers-color-scheme:dark){html[data-theme=light]{color-scheme:light dark}}
html{background:var(--bg)}
html[data-theme=dark]{color-scheme:dark;--bg:#12110e;--line:#34312a;--gold-l:#2a2312;--gold-d:#DDB765;--ink:#ECE8DC;--red:#FF8279;--red-l:#3a1d1a;--green:#52C97A;--green-l:#15291b;--card:#1c1b16;--sub:#9a937f;--row:#2a2822;--wait:#E9C46A;--shadow:0 1px 2px #0009;--field:#4a463a;--exp:#E0975A;--exp-l:#33261a;--sup:#6DB4C4;--sup-l:#18292e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;touch-action:manipulation;min-height:100vh}
html[data-fs=z] main{zoom:var(--z)}
button,input,textarea{font-family:inherit;color:inherit}
.money{direction:ltr;unicode-bidi:isolate;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
/* الشريط فوق: رفيع */
.top{background:#17150f;color:#fff;padding:calc(7px + env(safe-area-inset-top)) 14px 7px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;border-bottom:2px solid var(--gold);min-height:50px}
html[data-theme=dark] .top{background:#0d0c0a}
.top img{width:30px;height:30px;border-radius:7px;background:#fff}
.top h1{font-size:17px;margin:0;font-weight:800;line-height:1.2}
.top h1 small{color:var(--gold);font-size:12px;font-weight:600;margin-inline-start:8px}
.top .back{background:none;border:0;color:#fff;font-size:16px;font-weight:800;padding:6px 0;cursor:pointer}
.dot{margin-inline-start:auto;font-size:12px;font-weight:700;color:#8fd19e;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot i{width:8px;height:8px;border-radius:50%;background:#3ccf6a;display:inline-block}
.dot.w{color:#F2D27A}.dot.w i{background:#E9B930}
.dot.off{color:#bbb}.dot.off i{background:#888}
main{padding:12px 12px 28px;max-width:560px;margin:0 auto}
main.tabbed{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
/* شريط التبويبات تحت */
#tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 0 6px;font-size:12px;font-weight:700;color:var(--sub);cursor:pointer;min-height:54px;position:relative}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--gold-d)}
#tabs button.on::before{content:'';position:absolute;top:-1px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}
/* أساسيات */
.lbl.dh{margin-top:16px;font-size:14px;color:var(--ink)}.lbl.dh .money{color:var(--green);font-size:16px;margin-inline-start:4px}
.lbl{font-size:12.5px;font-weight:700;color:var(--sub);margin:14px 4px 5px;display:flex;justify-content:space-between;align-items:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;box-shadow:var(--shadow)}
.p1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p1 span{font-size:13.5px;color:var(--sub);font-weight:700}
.p1 b{font-size:27px;color:var(--green)}.p1 b.neg{color:var(--red)}
.pn{display:grid;grid-template-columns:repeat(var(--c,3),1fr);margin-top:9px;border-top:1px solid var(--row);padding-top:8px}
.pn.first{margin-top:0;border-top:0;padding-top:0}
.invln{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:7px;border-top:1px dashed var(--row);font-size:13px;font-weight:700;color:var(--sub)}.invln b{font-size:14.5px;color:var(--ink)}
.cap{margin-top:9px;border-top:1px solid var(--row);padding-top:7px;font-size:12px;color:var(--sub);font-weight:700}
.pn div{text-align:center;border-inline-start:1px solid var(--row);padding:0 2px}.pn div:first-child{border-inline-start:0}
.pn span{display:block;font-size:13px;color:var(--sub);font-weight:700;line-height:1.3;min-height:30px;display:flex;align-items:flex-end;justify-content:center}
.pn b{display:block;font-size:17px;font-weight:800;letter-spacing:.2px}.pn b.neg{color:var(--red)}
.qa{display:grid;grid-template-columns:1.45fr .8fr 1.25fr;gap:8px;margin-top:10px}
.qb{height:44px;border:1px solid var(--line);background:var(--card);border-radius:11px;font-weight:700;font-size:14.5px;padding:0 4px;white-space:nowrap;cursor:pointer;box-shadow:var(--shadow)}
.qb.g{background:var(--green);border-color:var(--green);color:#fff}
html[data-theme=dark] .qb.g{color:#0b1a10}
html[data-theme=dark] .seg button.on{background:#3a352a;color:#ECE8DC}
.qb:active{transform:scale(.98)}
.qa2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.qa2 .qb{height:66px;font-size:16px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2;white-space:normal;padding:4px 6px}
.qa2 .qb i{font-style:normal;font-size:22px;line-height:1}
.qb.qs{border-color:var(--gold);background:var(--gold-l);color:var(--gold-d)}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 12px;min-height:48px;border-bottom:1px solid var(--row);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--gold-l)}
.row .m{min-width:0;flex:1}
.row .m b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small{display:block;color:var(--sub);font-size:12px;font-weight:600}
.row .a{text-align:left;flex:none}
.row .a .money{display:block;font-size:16px}
.ctb{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.ctb th{background:var(--row);color:var(--sub);font-size:13.5px;font-weight:800;padding:8px 10px;text-align:right}
.ctb th:last-child,.ctb td.bl{text-align:left}
.ctb td{padding:12px 10px;border-top:1px solid var(--row);font-size:18px;font-weight:700;line-height:1.35;cursor:pointer}
.ctb td.no{width:36px;text-align:center;color:var(--sub);font-size:14px;font-variant-numeric:tabular-nums;border-inline-end:1px solid var(--row)}
.ctb th:first-child{text-align:center;width:36px}
.ctb td.bl{white-space:nowrap;font-size:19px;font-weight:800;letter-spacing:.2px}.ctb td.bl.z{color:var(--sub);font-weight:600}
.ctb tr:active td{background:var(--gold-l)}
.ctb tr.l-y td{background:#FFF8DC}.ctb tr.l-r td{background:#FDECEA}
.ctb tr.l-y td.no,.ctb tr.l-y td{border-top-color:#E9C46A55}.ctb tr.l-r td{border-top-color:#F0B9B3}
.ctb tr.l-r td.nm{color:#B3261E}
html[data-theme=dark] .ctb tr.l-y td{background:#3a3216}html[data-theme=dark] .ctb tr.l-r td{background:#3a1d1a}
html[data-theme=dark] .ctb tr.l-r td.nm{color:var(--red)}
.row .bal{font-size:16px;white-space:nowrap;flex:none}
.row .bal.z{color:var(--sub);font-weight:600;font-size:14px}
.nw{font-size:11px;font-weight:800;background:#17150f;color:var(--gold);border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.st{display:block;font-size:11.5px;font-weight:700;white-space:nowrap}
.ok{color:var(--green)}.wt{color:var(--wait)}.bk{color:var(--red)}.ns{color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:22px 10px;font-weight:600;font-size:14.5px}
.alert{display:block;width:100%;text-align:right;background:var(--red-l);color:var(--red);border:1px solid var(--red);border-radius:12px;padding:9px 13px;font-weight:700;font-size:14.5px;margin-bottom:10px;cursor:pointer}
.lnk{display:block;width:100%;margin-top:12px;background:none;border:0;color:var(--gold-d);font-weight:800;font-size:14.5px;padding:8px;cursor:pointer}
.search{width:100%;height:46px;border:1px solid var(--field);border-radius:11px;background:var(--card);padding:0 14px;font-size:16px;outline:none}
.search:focus,.inp2:focus{border-color:var(--gold);box-shadow:0 0 0 3px #D9AE5740}
.sr{display:grid;grid-template-columns:1fr auto;gap:8px}
.sbtn{border:1px solid var(--ink);background:var(--card);border-radius:10px;height:46px;padding:0 14px;font-weight:700;font-size:14.5px;cursor:pointer}
.hint{text-align:center;font-size:12.5px;color:var(--sub);margin:8px 0 0;font-weight:600}
/* مبلغ وأزرار */
.cust{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:var(--shadow)}
.cust b{font-size:18px;font-weight:800;line-height:1.35}
.cust div{text-align:left;flex:none}
.cust div span{font-size:12px;color:var(--sub);font-weight:700;display:block}
.cust div .money{font-size:21px}
.cust div .z{font-size:14px;color:var(--sub);font-weight:700}
.note{background:var(--red-l);color:var(--red);border-radius:10px;padding:7px 12px;font-weight:700;margin-top:10px;font-size:14px}
.note.dn{background:var(--green-l);color:var(--green)}
.amt{margin-top:10px;background:var(--card);border:1.5px solid var(--gold);border-radius:13px;height:68px;display:flex;align-items:center;justify-content:center;gap:10px;cursor:text}
.amt input{width:62%;border:0;background:none;outline:none;text-align:center;font-size:36px;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;padding:0;caret-color:var(--gold)}
.amt input::placeholder{color:#c9c2ad}
.amt em{font-style:normal;font-size:16px;color:var(--sub);font-weight:700}
.amt.sm{height:56px}.amt.sm input{font-size:28px}
.big{width:100%;height:54px;border:0;border-radius:12px;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;cursor:pointer}
.big:active{transform:scale(.98)}
.b-cash{background:var(--green);color:#fff}
.b-insta{background:var(--insta);color:#fff}
.b-voda{background:var(--voda);color:#fff}
.b-tr{background:#2F6690;color:#fff}
/* مرتجع / شغل: برتقاني */
.b-rt{background:#C27A2C;color:#fff}
.inp2.rt{border:2px solid #C27A2C}
#pyT button.rt.on{color:#9A4B12}html[data-theme=dark] #pyT button.rt.on{color:#E9A55E}
#pyT button{white-space:nowrap}
.row.t-rt .a .money{color:#C27A2C}
html[data-theme=dark] .b-cash{color:#0b1a10}
.b-again{background:#24211b;color:#fff}
html[data-theme=dark] .b-again{background:#34312a}
.b-home{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.b-red{background:var(--red);color:#fff}
.b-redo{background:var(--card);color:var(--red);border:1px solid var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.row.t-exp{border-inline-start:4px solid var(--exp);background:linear-gradient(90deg,transparent,var(--exp-l))}
.row.t-spay{border-inline-start:4px solid var(--sup);background:linear-gradient(90deg,transparent,var(--sup-l))}
.gh{display:flex;justify-content:space-between;align-items:center;margin:12px 4px 5px;font-size:14px;font-weight:800;color:var(--sub)}.gh .money{font-size:16px;color:var(--ink)}
.gh.g-exp{color:var(--exp)}.gh.g-exp .money{color:var(--exp)}.gh.g-spay{color:var(--sup)}.gh.g-spay .money{color:var(--sup)}
.gh:first-child{margin-top:0}
.seg.sp button.on.exp{background:var(--exp);color:#fff}.seg.sp button.on.spay{background:var(--sup);color:#fff}
html[data-theme=dark] .seg.sp button.on.exp,html[data-theme=dark] .seg.sp button.on.spay{color:#111}
.b-exp{background:var(--exp);color:#fff}.b-sup{background:var(--sup);color:#fff}
html[data-theme=dark] .b-exp,html[data-theme=dark] .b-sup{color:#111}
.amt.exp{border-color:var(--exp)}.amt.spay{border-color:var(--sup)}
.inp2.exp{border:2px solid var(--exp);height:54px;font-size:18px}.inp2.spay{border:2px solid var(--sup)}
.wh{font-size:14px;font-weight:800;margin:14px 4px 0}
.cat{height:52px;border:1px solid var(--field);background:var(--card);border-radius:12px;font-weight:700;font-size:16.5px;cursor:pointer;box-shadow:var(--shadow)}
.cat:active,.cat.on{background:var(--gold-l);border-color:var(--gold)}
.inp2{width:100%;height:48px;border:1px solid var(--field);border-radius:11px;background:var(--card);padding:0 14px;font-size:16px;outline:none;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{border:1px solid var(--gold);background:var(--gold-l);border-radius:20px;padding:4px 13px;font-weight:700;font-size:14px;cursor:pointer}
.chip.on{background:var(--gold);color:#241b00}
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:4px;background:var(--row);border-radius:11px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;min-height:40px;font-weight:700;font-size:14.5px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
/* شاشة اتسجلت */
.done{padding:26px 10px 0;text-align:center}
.chk{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:48px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:800}
html[data-theme=dark] .chk{color:#0b1a10}
.done h2{font-size:23px;margin:0;color:var(--green);font-weight:800}
.sent{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:14px;font-size:18px;font-weight:700;line-height:1.7;box-shadow:var(--shadow)}
.sent .money{font-size:22px}
.sent small{display:block;font-size:13.5px;font-weight:700;margin-top:4px}
.oops{display:inline-block;margin:16px 8px 0;background:none;border:0;color:var(--red);font-weight:700;font-size:14.5px;cursor:pointer;text-decoration:underline}
.oops.n{color:var(--gold-d)}
/* الأرشيف */
.wk{margin-bottom:12px}
.wk>.panel{border-radius:14px 14px 0 0;border-bottom:0}
.wk>.panel .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.wk>.panel .t b{font-size:17px}.wk>.panel .t span{font-size:13.5px;color:var(--sub);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:16.5px;table-layout:fixed;background:var(--card);border:1px solid var(--line);border-radius:0 0 14px 14px;overflow:hidden;box-shadow:var(--shadow)}
.tbl th{font-size:13px;color:var(--sub);font-weight:800;padding:8px 3px;background:var(--gold-l);line-height:1.25;border-inline-start:1px solid var(--row)}.tbl th:first-child{border-inline-start:0;width:24%}
.tbl td{padding:10px 3px;border-top:1px solid var(--row);border-inline-start:1px solid var(--row);text-align:center;font-weight:800;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}.tbl td:first-child{border-inline-start:0}.tbl tfoot td{background:var(--gold-l);border-top:2px solid var(--gold);font-size:16.5px}
.tbl td:first-child{direction:rtl;text-align:right;padding-inline-start:10px;font-size:15.5px}
.tbl td small{display:block;color:var(--sub);font-size:12.5px;font-weight:600;margin-top:1px}
.tbl tr[data-d]{cursor:pointer}.tbl tr[data-d]:active td{background:var(--gold-l)}
.tbl .neg{color:var(--red)}.tbl .z{color:var(--sub);font-weight:500}
.tbl th:nth-child(2),.tbl td:nth-child(2){color:var(--green)}.tbl th:nth-child(3),.tbl td:nth-child(3){color:var(--red)}.tbl th:nth-child(4),.tbl td:nth-child(4){color:#2F6690}
html[data-theme=dark] .tbl th:nth-child(4),html[data-theme=dark] .tbl td:nth-child(4){color:#7DB4E0}
.tbl tbody td:nth-child(2){background:var(--green-l)}.tbl tbody td:nth-child(3){background:var(--red-l)}
.tbl tfoot td{font-size:17.5px;font-weight:900}.tbl tfoot td:nth-child(5){color:var(--ink)}.tbl tfoot td:nth-child(5).neg{color:var(--red)}
.tbl td:nth-child(5),.tbl th:nth-child(5){border-inline-start:2px solid var(--line)}
.wkh{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;padding:12px 14px;box-shadow:var(--shadow)}
.wkh b{font-size:18px;font-weight:800;display:block}.wkh span{font-size:13.5px;color:var(--sub);font-weight:700}.wkh .tc{text-align:left;flex:none;line-height:1.2}.wkh .tc span{display:block;font-size:12.5px}.wkh .tc .money{font-size:24px;color:var(--green)}
.wk .tbl{border-radius:0 0 14px 14px}.tbl tfoot td:first-child{font-weight:800;color:var(--gold-d)}
.tbl tr.inr td{direction:rtl;text-align:right;font-size:14px;font-weight:700;color:var(--sub);padding:8px 12px;border-inline-start:0;background:var(--card);border-top:1px dashed var(--row)}.tbl tr.inr b{color:var(--ink);margin-inline-start:6px}
.dnav{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px}
.dnav button{width:42px;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:22px;font-weight:800;line-height:1;cursor:pointer;color:var(--ink);padding:0}
.dnav button:disabled{opacity:.35}

<body>
<header class="top" id="top"></header>
<main id="main"></main>
<nav id="tabs"></nav>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/*
  حركة السوق — تطبيق الشريك (فلاش أون)
  -------------------------------------
  - الشريك بيسجل اللي حصّله من عملاء السوق. مفيش كلمة سر: الربط بييجي من "رابط الربط" اللي مصطفى بيبعته (#marketjoin=...).
  - كل حاجة متخزنة على الموبايل في fo_mkt_v1، وبتتبعت لشيت "حركة السوق" (منفصل عن شيت الحسابات) أول ما يبقى فيه نت.
  - مفيش اعتماد على "حالة النت" اللي المتصفح بيقولها: بنجرب الطلب ونتعامل مع الفشل، واللي متبعتش بيفضل مستني ويتبعت لوحده.
  - كل عملية ليها id ثابت، فمفيش تكرار أبداً حتى لو اتبعتت كذا مرة.
  - المبالغ بالقرش كأرقام صحيحة (زي برنامج الحسابات). العملية: {id, t:'pay', cid, cname, newc, amt, m: cash|insta|voda, ts, upd, del}
  - حالة العملية بيكتبها مصطفى في سجل لوحده (st_<id>): ok/ov = التحويل وصل، done = اتنقلت للحسابات، back/bv = رجّعها بملاحظة.
    ov و bv بيتقارنوا بـ upd بتاع العملية، فلو الشريك عدّلها بعد كده الحالة القديمة بتتلغي لوحدها.
  - أرصدة عملاء السوق (cust) بيبعتها برنامج الحسابات. الرصيد المعروض = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش.
  - الشاشات: تبويبات تحت (الرئيسية / العملاء / الأرشيف / الإعدادات). التعديل والمسح بنافذة من تحت (editSheet) على أي حركة لسه متنقلتش.
*/
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const normDigits = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => normDigits(s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };
const pad2 = n => String(n).padStart(2, '0');
const dayOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const today = () => dayOf(Date.now());
const timeOf = ms => { const d = new Date(ms), h = d.getHours(); return `${h % 12 || 12}:${pad2(d.getMinutes())} ${h < 12 ? 'ص' : 'م'}`; };
/* طريقتين بس للدفعة الجديدة: فلوس معايا أو تحويل لمصطفى (إنستا/فودافون القديمة بتفضل تتعرض زي ما هي) */
const M_BTN = {cash: '💵 فلوس معايا', tr: '📲 تحويل لمصطفى'};
const M_TXT = {cash: 'كاش معايا', tr: 'تحويل لمصطفى', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const M_SAID = {cash: 'كاش', tr: 'تحويل لمصطفى', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const AR_DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const RLM = '\u200F';
const dispDate = iso => { const [y, m, d] = (iso || '').split('-'); return y ? `${d}${RLM}/${RLM}${m}${RLM}/${RLM}${y}` : ''; };
const dowOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12).getDay(); };
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return dayOf(new Date(y, m - 1, d + n, 12).getTime()); };
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const shortD = iso => { const [, m, d] = iso.split('-'); return `${+d}${RLM}/${RLM}${+m}`; };      // يوم/شهر
const monLabel = ym => `${MONTHS[+ym.slice(5, 7) - 1]} ${ym.slice(0, 4)}`;
/* التاريخ المختار: نفس ساعة الحركة (أو دلوقتي) على اليوم ده */
const tsOnDay = (iso, base) => { if (iso === today() && !base) return Date.now(); const [y, m, d] = iso.split('-').map(Number), b = new Date(base || Date.now()); return new Date(y, m - 1, d, b.getHours(), b.getMinutes(), b.getSeconds()).getTime(); };
const datePick = (id, iso) => `<div class="dpk"><button type="button" data-st="-1" aria-label="اليوم اللي قبله">›</button><label class="pick dt" for="${id}">📅 <b id="${id}T"></b><input type="date" id="${id}" value="${iso}" max="${today()}"></label><button type="button" data-st="1" aria-label="اليوم اللي بعده">‹</button></div>`;
const bindDate = id => {
  const i = $('#' + id), box = i.closest('.dpk'), nx = box.querySelector('[data-st="1"]');
  const draw = () => { if (!isDay(i.value) || i.value > today()) i.value = today(); $('#' + id + 'T').textContent = dispDate(i.value) + (i.value === today() ? ' · النهارده' : ' · ' + AR_DAYS[dowOf(i.value)]); nx.disabled = i.value >= today(); };
  i.addEventListener('change', draw);
  box.querySelectorAll('button').forEach(b => b.onclick = () => { if (!b.disabled) { i.value = addDays(isDay(i.value) ? i.value : today(), +b.dataset.st); draw(); } });
  draw();
};
const dateOf = id => { const v = $('#' + id).value; return isDay(v) && v <= today() ? v : today(); };
const fmtN = p => (p < 0 ? '-' : '') + fmt(p);

/* ====================== التخزين على الموبايل ====================== */
const LS = 'fo_mkt_v1';
let S;
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  S = Object.assign({u: '', k: '', dev: '', cursor: 0, ops: {}, st: {}, cust: {}, newc: [], lastOk: 0}, d || {});
  if (!S.dev) S.dev = Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('');
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('الموبايل مش قادر يحفظ. كلّم مصطفى.', 6000); } }
load();
const newId = () => 'm_' + Date.now().toString(36) + S.dev + Math.random().toString(36).slice(2, 6);
const bump = o => { o.upd = Math.max(Date.now(), (o.upd || 0) + 1); };

/* رابط الربط: فيه لينك شيت السوق ومفتاحه بعد علامة # (مبيتبعتش لأي سيرفر) */
const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
(function join() {
  const m = location.hash.match(/marketjoin=([\w-]+)/);
  if (!m) return;
  let o = null; try { o = JSON.parse(unb64u(m[1])); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  if (!o || !o.u || !o.k) { setTimeout(() => toast('الرابط ناقص. اطلب من مصطفى يبعته تاني.', 8000), 300); return; }
  if (S.u !== o.u) { S.cursor = 0; S.st = {}; S.cust = {}; Object.values(S.ops).forEach(x => { delete x.sy; }); }
  S.u = o.u; S.k = o.k; S.bad = false; save();
  setTimeout(() => toast('✔ التطبيق اتربط. ممكن تحطه على الشاشة الرئيسية.', 5000), 300);
})();

/* ====================== الحسابات ====================== */
const stOf = o => S.st['st_' + o.id];
function opState(o) {               // done | back | wait (عند مصطفى) | unsent (لسه على الموبايل)
  if (o.t === 'exp') return 'exp';   // المصروف عند الشريك حركة عادية: مفيش حالة ولا انتظار ولا قفل، وبيتعدّل ويتمسح طول الوقت
  const s = stOf(o);
  if (s && s.done) return 'done';
  if (s && s.back && s.bv === o.upd) return 'back';
  if (s && s.rm && s.rm === o.upd) return 'rm';   // مصطفى نقلها وبعدين مسحها من الحسابات: مبتتحسبش في رصيد العميل، ولو الشريك عدّلها بترجع تتحسب
  return o.sy === o.upd ? 'wait' : 'unsent';
}
/* العميل الجديد بعد ما مصطفى يربطه بحساب: عملياته بتتعرض تحت الحساب ده */
function aliases() {
  const a = {};
  Object.values(S.st).forEach(s => { const o = S.ops[s.op]; if (s.pid && o && o.cid && o.cid !== s.pid) a[o.cid] = s.pid; });
  return a;
}
/* cnt = تقفيل اليوم (الشريك عدّ الفلوس اللي معاه). مش فلوس، فمش داخل في أي حسبة ولا قايمة حركات */
const liveOps = () => Object.values(S.ops).filter(o => !o.del && o.t !== 'cnt');
const cntOf = d => Object.values(S.ops).filter(o => o.t === 'cnt' && !o.del && o.day === d).sort((a, b) => b.upd - a.upd)[0] || null;
const payOps = () => liveOps().filter(o => o.t === 'pay');
/* حركات العميل: دفعات + فواتير (فاتورة = إجمالي بس، ومصطفى هو اللي بيكتب بنودها) */
/* حركات العملاء: دفعة / فاتورة / مرتجع أو شغل (rt: مبلغ + ملاحظة بيتخصم من حساب العميل، ملوش دعوة بالكاش) */
const isCustOp = o => o.t === 'pay' || o.t === 'inv' || o.t === 'rt';
const custAll = () => liveOps().filter(isCustOp);
function customers() {
  const al = aliases(), m = new Map();
  /* lp = تاريخ آخر دفعة في الحسابات، want = مصطفى عاوزه يحصّل منه {amt, at, note} (الاتنين بييجوا مع رصيد العميل) */
  Object.values(S.cust).forEach(c => { if (!c.del) m.set(c.id, {id: c.id, name: c.name, bal: c.bal || 0, lim: c.lim || '', lp: c.lp || '', want: c.want && c.want.amt > 0 ? c.want : null}); });
  S.newc.forEach(c => { if (!al[c.id] && !m.has(c.id)) m.set(c.id, {id: c.id, name: c.name, bal: 0, nw: true}); });
  custAll().forEach(o => { const id = al[o.cid] || o.cid; if (!m.has(id)) m.set(id, {id, name: o.cname, bal: 0, nw: id.startsWith('n_')}); });
  /* الصافي = رصيده في الحسابات + الفواتير اللي اتسجلت هنا − الدفعات والمرتجع/الشغل اللي اتسجلوا هنا، لسه متنقلتش (واللي مصطفى شالها من الحسابات مبتتحسبش) */
  custAll().forEach(o => { if (!['done', 'rm'].includes(opState(o))) { const c = m.get(al[o.cid] || o.cid); if (c) c.bal += o.t === 'inv' ? o.amt : -o.amt; } });

/* ---------- العملاء (تبويب لوحده) ---------- */
let custNo = new Map();
const limOf = c => c.bal > 0 ? (c.lim || '') : '';
const custTbl = list => `<table class="ctb"><thead><tr><th>#</th><th>العميل</th><th>الرصيد (عليه)</th></tr></thead><tbody>${list.map(c => `<tr class="${limOf(c) ? 'l-' + limOf(c) : ''}" data-c="${esc(c.id)}"><td class="no">${custNo.get(c.id) || ''}</td><td class="nm">${esc(c.name)}${c.nw ? '<span class="nw">جديد</span>' : ''}${c.want ? '<span class="wn">📌 مطلوب</span>' : ''}</td><td class="bl ${c.bal > 0 ? 'money' : 'z'}">${c.bal > 0 ? fmt(c.bal) : '—'}</td></tr>`).join('')}</tbody></table>`;
/* ترتيب العملاء (بيتحفظ على الموبايل): الأكتر عليه / مدفعش من زمان / بالحروف */
const C_SORT = [['owe', 'الأكتر عليه'], ['old', 'مدفعش من زمان'], ['abc', 'بالحروف']];
function sortCust(all, k) {
  const abc = (a, b) => a.name.localeCompare(b.name, 'ar');
  if (k === 'abc') return all.sort(abc);
  if (k === 'old') return all.sort((a, b) => ((b.bal > 0) - (a.bal > 0)) || (a.lp || '').localeCompare(b.lp || '') || b.bal - a.bal || abc(a, b));
  return all.sort((a, b) => b.bal - a.bal || abc(a, b));
}
/* أقسام العملاء (بطلب صاحب المشروع): الشريك بيقسّمهم براحته (منطقة كذا...)، وكل قسم تبويب فوق جنب "كل العملاء".
   متخزنة على الموبايل بس في S.groups = [{id, name, ids:[عميل]}] ومالهاش أي دعوة ببرنامج الحسابات */
const groups = () => (S.groups = S.groups || []);
function drawCustomers(q0) {
  const cs = customers();
  const owed = [...cs.values()].reduce((a, c) => a + (c.bal > 0 ? c.bal : 0), 0);
  if (S.cGrp && !groups().some(g => g.id === S.cGrp)) S.cGrp = '';
  const G = groups().find(g => g.id === S.cGrp);
  $('#main').innerHTML = `<section class="panel" style="margin-bottom:10px"><div class="p1"><span>إجمالي اللي على العملاء</span><b class="money" style="color:var(--red)">${fmt(owed)}</b></div></section>
    <div class="sr"><input class="search" id="q" type="search" placeholder="🔍 دوّر على عميل…" autocomplete="off" value="${esc(q0 || '')}"><button class="sbtn" id="bNew" type="button">＋ عميل جديد</button></div>
    <div class="gtabs" id="gTabs"><button type="button" data-g="" class="${G ? '' : 'on'}">كل العملاء</button>${groups().map(g => `<button type="button" data-g="${esc(g.id)}" class="${G === g ? 'on' : ''}">${esc(g.name)}</button>`).join('')}<button type="button" class="add" id="gAdd">＋ قسم</button></div>
    <div id="lists"></div>`;
  $$('#gTabs button[data-g]').forEach(b => b.onclick = () => { S.cGrp = b.dataset.g; save(); drawCustomers($('#q').value); });
  $('#gAdd').onclick = () => groupModal(null);
  const draw = () => {
    const q = norm($('#q').value), all = sortCust([...cs.values()], S.cSort || 'owe'), al = aliases(), inG = G ? all.filter(c => G.ids.some(x => x === c.id || al[x] === c.id)) : all;   // العميل الجديد بعد ما مصطفى يربطه بيفضل في قسمه
    custNo = new Map(all.map((c, i) => [c.id, i + 1]));
    const sortSel = `<label class="csort">↕ <select id="cSort">${C_SORT.map(([k, t]) => `<option value="${k}" ${(S.cSort || 'owe') === k ? 'selected' : ''}>${t}</option>`).join('')}</select></label>`;
    if (q) { const f = all.filter(c => norm(c.name).includes(q)); $('#lists').innerHTML = f.length ? `<div class="lbl"><span>نتيجة البحث</span>${sortSel}</div>${custTbl(f)}` : '<div class="empty">مفيش عميل بالاسم ده.<br>لو جديد دوس "＋ عميل جديد".</div>'; }
    else {
      custNo = new Map(inG.map((c, i) => [c.id, i + 1]));
      $('#lists').innerHTML = `<div class="lbl"><span>${G ? esc(G.name) : 'كل العملاء'} (${inG.length})${G ? ' <button class="gedit" id="gEdit" type="button">✏️ تعديل القسم</button>' : ''}</span>${sortSel}</div>`
        + (inG.length ? custTbl(inG) : G ? '<div class="empty">القسم ده فاضي.<br><button class="lnk" id="gFill" type="button" style="margin:0">＋ اختار عملاء القسم</button></div>' : '<div class="empty">لسه العملاء منزلوش. استنى ثواني والنت شغال.</div>');
    }
    $$('#lists tr[data-c]').forEach(r => r.onclick = () => { pyTab = 'pay'; nav('p/' + r.dataset.c); });
    $('#cSort') && ($('#cSort').onchange = e => { S.cSort = e.target.value; save(); draw(); });
    if ($('#gEdit')) $('#gEdit').onclick = () => groupModal(G);
    if ($('#gFill')) $('#gFill').onclick = () => groupModal(G);
  };
  draw();
  $('#q').oninput = draw;
  $('#bNew').onclick = newCustomer;
}
/* قسم جديد أو تعديل قسم: الاسم + اختيار العملاء (بحث وعلامة صح) */
function groupModal(G) {
  const cs = [...customers().values()].sort((a, b) => a.name.localeCompare(b.name, 'ar')), al = aliases(), sel = new Set(G ? G.ids.map(x => al[x] || x) : []);
  modal(`<h3>${G ? 'تعديل القسم' : 'قسم جديد'}</h3>
    <input class="inp" id="gN" autocomplete="off" placeholder="اسم القسم (مثلاً: منطقة السوق الكبير)" value="${esc(G ? G.name : '')}">
    <input class="inp" id="gQ" type="search" autocomplete="off" placeholder="🔍 دوّر على عميل" style="margin-top:8px">
    <div class="gpick" id="gL"></div>
    <p class="hint" id="gC"></p>
    <button class="big b-cash" id="gOk" type="button">حفظ القسم</button>
    ${G ? '<button class="big b-redo" id="gDel" type="button">🗑 امسح القسم (العملاء مش هيتمسحوا)</button>' : ''}
    <button class="lnk" id="gX" type="button">رجوع</button>`);
  const cnt = () => { $('#gC').textContent = `اخترت ${sel.size} ${sel.size === 1 ? 'عميل' : 'عملاء'}`; };
  const draw = () => {
    const q = norm($('#gQ').value), l = cs.filter(c => !q || norm(c.name).includes(q));
    $('#gL').innerHTML = l.length ? l.map(c => `<label class="gp ${sel.has(c.id) ? 'on' : ''}"><input type="checkbox" data-c="${esc(c.id)}" ${sel.has(c.id) ? 'checked' : ''}><span>${esc(c.name)}</span></label>`).join('') : '<div class="empty">مفيش عميل بالاسم ده</div>';
    $$('#gL input').forEach(x => x.onchange = () => { x.checked ? sel.add(x.dataset.c) : sel.delete(x.dataset.c); x.parentNode.classList.toggle('on', x.checked); cnt(); });
  };
  draw(); cnt(); $('#gQ').oninput = draw;
  if (!G) setTimeout(() => $('#gN') && $('#gN').focus(), 60);
  $('#gX').onclick = closeModal;
  $('#gOk').onclick = () => {
    const name = $('#gN').value.trim().replace(/\s+/g, ' ');
    if (!name) { toast('اكتب اسم القسم'); return $('#gN').focus(); }
    if (groups().some(g => g !== G && norm(g.name) === norm(name))) return toast('فيه قسم بنفس الاسم');
    if (G) Object.assign(G, {name, ids: [...sel]});
    else { G = {id: 'g' + Date.now().toString(36), name, ids: [...sel]}; groups().push(G); }
    S.cGrp = G.id; save(); closeModal(); drawCustomers(''); toast('✔ اتحفظ القسم');
  };
  if ($('#gDel')) $('#gDel').onclick = async () => {
    if (!(await ask(`تمسح قسم "${G.name}"؟ العملاء هيفضلوا في "كل العملاء".`, 'أيوه امسحه', 'لأ', true))) return;
    S.groups = groups().filter(g => g !== G); S.cGrp = ''; save(); drawCustomers(''); toast('اتمسح القسم');
  };
}

/* ---------- شاشة الدفعة (دوسة على الزرار بتحفظ على طول) ---------- */
function bindAmt(inp) {
  inp.addEventListener('input', () => {
    const s = normDigits(inp.value).replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    inp.value = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  });
}
const amtOf = el => Math.round(+normDigits(el.value).replace(/\D/g, '') * 100);
let lastSave = 0;
/* العميل ممكن ياخد فاتورة (إجمالي بس، مصطفى هو اللي بيكتب البنود) وممكن يدفع. تابين فوق، والمبلغ واحد */
let pyTab = 'pay';
function drawPay() {
  const cs = customers(), c = cs.get(scr.cid);

  $('#main').innerHTML = `<div class="cust" id="cBox"></div>
    <div class="seg" id="pyT" style="margin-top:10px;--n:3"><button type="button" data-v="pay" class="${pyTab === 'pay' ? 'on' : ''}">💵 دفعة</button><button type="button" data-v="inv" class="${pyTab === 'inv' ? 'on' : ''}">🧾 فاتورة</button><button type="button" data-v="rt" class="rt ${pyTab === 'rt' ? 'on' : ''}">↩️ مرتجع/شغل</button></div>

      : pyTab === 'rt' ? `<input class="inp2 rt" id="rtN" autocomplete="off" placeholder="ملاحظة: مرتجع إيه أو شغل إيه"><button class="big b-rt" id="rtOk" type="button">↩️ سجّل (بيتخصم من حسابه)</button><p class="hint">بيتخصم من حساب العميل بس. ملوش دعوة بالكاش اللي معاك.</p>`
      : `<button class="big b-again" id="invOk" type="button">🧾 سجّل الفاتورة</button><p class="hint">اكتب إجمالي الفاتورة بس (من غير بنود). بتتضاف على حساب العميل عندك، ومصطفى بيكتب البنود من عنده.</p>`;
    $$('#pyBtns .big[data-m]').forEach(b => {

/* الجزء اللي بيتحدث لوحده (الرصيد واللي اتسجل النهارده) من غير ما نلمس خانة المبلغ */

/* بعد الحفظ: مفيش شاشة كبيرة. إشعار صغير وبيفضل في نفس الصفحة (المبلغ بيتمسح، والرصيد والحركات بيتحدثوا) */
function savedHere(msg) {
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  const i = $('#amt'); if (i) { i.value = ''; i.blur(); }
  lastSave = Date.now(); refresh();
  toast(msg + (online === false ? ' (هتتبعت أول ما النت يرجع)' : ''), 3000, true);
}
async function savePay(c, m) {
  if (Date.now() - lastSave < 700) return;   // دوستين ورا بعض = دوسة واحدة
  const amt = amtOf($('#amt'));
  if (!(amt > 0)) { toast('اكتب المبلغ الأول'); $('#amt').focus(); return; }
  lastSave = Date.now();
  /* حماية من التكرار: نفس المبلغ لنفس العميل في خلال دقيقتين */
  const al = aliases(), dup = custOps(c.id, al).find(o => o.t === 'pay' && o.amt === amt && Date.now() - (o.cr || o.ts) < 120000);
  if (dup && !(await ask(`سجلت ${fmt(amt)} للعميل ده من شوية. دي دفعة تانية؟`, 'أيوه، دفعة تانية', 'لأ، دي نفسها'))) { lastSave = 0; return; }
  const now = Date.now();
  const o = {id: newId(), t: 'pay', cid: c.id, cname: c.name, newc: !!c.nw, amt, m, ts: tsOnDay(dateOf('pyD')), cr: now, upd: now, del: false};
  S.ops[o.id] = o;
  save(); sync();
  savedHere(`✔ اتسجلت دفعة ${fmt(amt)} — ${M_TXT[m]}`);
}

async function saveRt(c) {
  if (Date.now() - lastSave < 700) return;
  const amt = amtOf($('#amt')), note = $('#rtN').value.trim().replace(/\s+/g, ' ');
  if (!(amt > 0)) { toast('اكتب المبلغ الأول'); $('#amt').focus(); return; }
  if (!note) { toast('اكتب ملاحظة: مرتجع إيه أو شغل إيه'); $('#rtN').focus(); return; }

    ${o.t === 'exp' ? `<label class="wh" for="eNt">المصروف ده إيه؟</label><input class="inp2 exp" id="eNt" autocomplete="off" placeholder="اكتب المصروف" value="${esc(o.cat + (o.note ? ' — ' + o.note : ''))}" style="margin-top:6px">` : ''}
    <div class="row2" style="margin-top:12px"><button class="big b-cash" id="eOk" type="button" style="margin-top:0">حفظ</button><button class="big b-redo" id="eDel" type="button" style="margin-top:0">🗑 مسح</button></div>
    <button class="lnk" id="eX" type="button">إغلاق</button>`);

async function delOp(o) {
  if (!(await ask(`تمسح ${o.t === 'pay' ? 'دفعة' : o.t === 'inv' ? 'فاتورة' : o.t === 'rt' ? 'مرتجع/شغل' : o.t === 'hand' ? 'تسليم' : o.t === 'cs' ? 'بيع كاش' : 'مصروف'} ${fmt(o.amt)} (${opWhat(o)}${o.t === 'pay' ? ' — ' + M_SAID[o.m] : ''})؟`, 'أيوه امسحها', 'لأ', true))) return false;
  o.del = true; bump(o); save(); sync();
  toast('اتمسحت ✔');
  return true;
}

/* ---------- صرفت: مصروف أو دفعة لمورد (بتتخصم من اللي معايا) ---------- */

function spNames() {
  const seen = new Map();
  Object.values(S.ops).filter(o => o.t === 'spay').sort((a, b) => b.ts - a.ts).forEach(o => { const k = norm(o.sname); if (!seen.has(k)) seen.set(k, o.sname); });

}
function drawSpend() {

/* اللي اتسجل النهارده تحت خانة الكتابة (مؤقت للشاشة دي بس، وبيفضل برّه في الرئيسية والأرشيف). دوسة تعدّل */
function drawSpendList() {
  const el = $('#spList'); if (!el) return;
  const ops = liveOps().filter(o => o.t === spTab && dayOf(o.ts) === today()).sort((a, b) => b.ts - a.ts);
  el.innerHTML = ops.length ? `<div class="gh g-${spTab}" style="margin-top:18px"><span>${spTab === 'exp' ? 'مصروفات النهارده' : 'دفعات الموردين النهارده'} (${ops.length})</span><b class="money">${fmt(ops.reduce((a, o) => a + o.amt, 0))}</b></div><div class="list">${ops.map(o => opRow(o)).join('')}</div><p class="hint">دوس على أي سطر تعدّله أو تمسحه</p>` : '';
  bindOps('#spList');
}
async function saveSpend(t, x) {
  if (Date.now() - lastSave < 700) return;
  const amt = amtOf($('#amt'));
  if (!(amt > 0)) { toast('اكتب المبلغ الأول'); $('#amt').focus(); return; }
  if (t === 'exp' && !x.cat) { toast('اكتب المصروف ده إيه'); $('#nt').focus(); return; }
  if (t === 'spay' && !x.sname) { toast('اكتب اسم المورد'); $('#sn').focus(); return; }
  lastSave = Date.now();
  /* حماية من التكرار: نفس المبلغ لنفس النوع في خلال دقيقتين */
  const dup = liveOps().find(o => o.t === t && o.amt === amt && (t === 'exp' ? o.cat === x.cat : norm(o.sname) === norm(x.sname)) && Date.now() - o.ts < 120000);
  if (dup && !(await ask(`سجلت ${fmt(amt)} (${t === 'exp' ? x.cat : x.sname}) من شوية. دي مرة تانية؟`, 'أيوه، مرة تانية', 'لأ، دي نفسها'))) { lastSave = 0; return; }
  const now = Date.now();
  const o = Object.assign({id: newId(), t, amt, ts: now, upd: now, del: false}, x);
  S.ops[o.id] = o; save(); sync();
  try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
  drawSpend(); lastSave = Date.now();   // نفس الشاشة جاهزة للي بعده، واللي اتسجل بيظهر تحتها
  toast(`✔ اتسجل: ${t === 'exp' ? x.cat : x.sname} — ${fmt(amt)} جنيه`, 3000);
}

    <button class="big b-cash" id="kOk" type="button">قفّل</button><button class="big b-home" id="kX" type="button">رجوع</button>
    ${old ? `<p class="hint">قفلته قبل كده النهارده (${timeOf(old.ts)}). القفل الجديد هيتكتب مكانه.</p>` : ''}`);
  const inp = $('#kAmt'); bindAmt(inp);
  setTimeout(() => inp && inp.focus(), 80);
  let warned = false;
  const res = () => {
    const a = amtOf(inp), d = a - cn;   // فاضية = 0 (الخانة مبتقبلش صفر لوحده)
    $('#kRes').innerHTML = !inp.value.trim() && !warned ? '' : !d ? '<div class="kres ok">✓ مظبوط</div>' : `<div class="kres bad">${d < 0 ? 'ناقص' : 'زيادة'} <b class="money">${fmt(d)}</b> جنيه<small>راجع حركات النهارده، يمكن نسيت تسجل دفعة أو مصروف. لو قفلت كده الفرق هيوصل لمصطفى.</small></div>`;
    $('#kOk').textContent = d && warned ? 'قفّل برضه' : 'قفّل';
  };
  inp.addEventListener('input', () => { warned = false; res(); });
  $('#kX').onclick = closeModal;
  $('#kOk').onclick = () => {
    const a = amtOf(inp);
    if (a !== cn && !warned) { warned = true; res(); return; }
    const now = Date.now(), id = 'k_' + t + '_' + S.dev, o = S.ops[id] || {id, t: 'cnt', day: t, del: false};
    Object.assign(o, {amt: a, sys: cn, ts: now, del: false}); bump(o); S.ops[id] = o;
    save(); sync(); closeModal(); refresh();
    toast(a === cn ? '✔ قفلت يومك — مظبوط' : `✔ قفلت يومك — الفرق ${fmtN(a - cn)} وصل لمصطفى`, 3500, true);
  };
}

/* ---------- الأرشيف: أسابيع أو شهور، وكل يوم فيه حصّلت وصرفت وسلمت لمصطفى كام ---------- */
const weekStart = iso => addDays(iso, -((dowOf(iso) + 1) % 7));   // الأسبوع بيبدأ سبت
const dayLabel = d => `${AR_DAYS[dowOf(d)]}<small>${shortD(d)}</small>`;
const nz = n => n ? fmt(n) : '<span class="z">—</span>';
const lftCell = x => `<td class="${x.left < 0 ? 'neg' : ''}">${x.left < 0 ? '-' : ''}${nz(Math.abs(x.left))}</td>`;
const sumRow = x => `<td>${nz(x.col)}</td><td>${nz(x.sp)}</td><td>${nz(x.toM)}</td>${lftCell(x)}`;
const tblHtml = (th, rows, s, lbl) => `<table class="tbl"><thead><tr><th>${th}</th>${TH4}</tr></thead><tbody>${rows}</tbody><tfoot><tr><td>${lbl}</td>${sumRow(s)}</tr>${s.inv ? `<tr class="inr"><td colspan="5">🧾 فواتير (إجمالي بس)<b class="money">${fmt(s.inv)}</b></td></tr>` : ''}</tfoot></table>`;
const TH4 = '<th>حصّلت</th><th>صرفت</th><th>سلّمت</th><th>معايا</th>';
const sub4 = (first, s) => `<div class="pn ${first ? 'first' : ''}" style="--c:4"><div class="c-in"><span>حصّلت</span><b class="money">${fmt(s.col)}</b></div><div class="c-out"><span>صرفت</span><b class="money">${fmt(s.sp)}</b></div><div><span>سلّمت لمصطفى</span><b class="money">${fmt(s.toM)}</b></div><div><span>معايا</span><b class="money ${s.left < 0 ? 'neg' : ''}">${fmtN(s.left)}</b></div></div>${invLn(s)}`;
let archWeeks = 4, archMons = 6, archMode = 'w';
const archHead = t => `<div class="seg" id="aM" style="margin-bottom:10px"><button type="button" data-v="w" class="${archMode === 'w' ? 'on' : ''}">أسابيع</button><button type="button" data-v="m" class="${archMode === 'm' ? 'on' : ''}">شهور</button></div>
  <label class="pick">📅 اختار يوم تفتحه<input type="date" id="aDay" value="${t}" max="${t}"></label>`;
function bindArch() {
  $$('#aM button').forEach(b => b.onclick = () => { archMode = b.dataset.v; drawArchive(); });
  $$('#main tr[data-d]').forEach(r => r.onclick = () => nav('a/' + r.dataset.d));
  $$('#main tr[data-m]').forEach(r => r.onclick = () => nav('a/' + r.dataset.m));
  if ($('#aDay')) $('#aDay').onchange = e => { if (isDay(e.target.value)) nav('a/' + e.target.value); };
}
function drawArchive() {
  const t = today(), all = liveOps(), byDay = new Map();
  all.forEach(o => { const d = dayOf(o.ts); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(o); });
  if (archMode === 'm') {
    const mons = new Map();
    [...byDay.keys()].forEach(d => { const m = d.slice(0, 7); if (!mons.has(m)) mons.set(m, []); mons.get(m).push(...byDay.get(d)); });
    if (!mons.has(t.slice(0, 7))) mons.set(t.slice(0, 7), []);
    const ms = [...mons.keys()].sort().reverse(), shown = ms.slice(0, archMons);
    $('#main').innerHTML = `${archHead(t)}
      <table class="tbl" style="border-radius:14px"><thead><tr><th>الشهر</th>${TH4}</tr></thead><tbody>
      ${shown.map(m => `<tr data-m="${m}"><td>${MONTHS[+m.slice(5, 7) - 1]}<small>${m.slice(0, 4)}${m === t.slice(0, 7) ? ' · الحالي' : ''}</small></td>${sumRow(sums(mons.get(m)))}</tr>`).join('')}</tbody></table>
      ${ms.length > shown.length ? '<button class="more" id="aMore" type="button" style="margin-top:10px">اعرض شهور أقدم</button>' : ''}
      <p class="hint">دوس على أي شهر تشوف أيامه.<br>"سلّمت" = التحويلات (إنستا/فودافون) + الكاش اللي سلمته لمصطفى.</p>`;
    bindArch();
    if ($('#aMore')) $('#aMore').onclick = () => { archMons += 6; drawArchive(); };
    return;
  }
  const weeks = new Map();
  [...byDay.keys()].forEach(d => { const w = weekStart(d); if (!weeks.has(w)) weeks.set(w, []); weeks.get(w).push(d); });
  if (!weeks.has(weekStart(t))) weeks.set(weekStart(t), []);
  const ws = [...weeks.keys()].sort().reverse(), shown = ws.slice(0, archWeeks);
  $('#main').innerHTML = `${archHead(t)}
    ${shown.map(w => {
      const days = weeks.get(w).sort(), ops = days.flatMap(d => byDay.get(d)), s = sums(ops), cur = w === weekStart(t);
      return `<section class="wk"><div class="wkh"><div><b>${cur ? 'الأسبوع ده' : 'أسبوع'}</b><span>من ${shortD(w)} إلى ${shortD(addDays(w, 6))}</span></div><div class="tc"><span>حصّلت</span><b class="money">${fmt(s.col)}</b></div></div>
        ${days.length ? tblHtml('اليوم', days.map(d => `<tr data-d="${d}"><td>${dayLabel(d)}</td>${sumRow(sums(byDay.get(d)))}</tr>`).join(''), s, 'الإجمالي ←') : '<div class="list" style="border-radius:0 0 14px 14px"><div class="empty">لسه مفيش حركات الأسبوع ده</div></div>'}</section>`;
    }).join('')}
    ${ws.length > shown.length ? '<button class="more" id="aMore" type="button">اعرض أسابيع أقدم</button>' : ''}
    <p class="hint">"سلّمت" = التحويلات (إنستا/فودافون) + الكاش اللي سلمته لمصطفى.<br>"معايا" = اللي فضل معاك كاش من اليوم ده.</p>`;
  bindArch();
  if ($('#aMore')) $('#aMore').onclick = () => { archWeeks += 4; drawArchive(); };
}
function drawMonth() {
  const t = today(), ym = scr.mon, ops = liveOps().filter(o => dayOf(o.ts).slice(0, 7) === ym), byDay = new Map();
  ops.forEach(o => { const d = dayOf(o.ts); if (!byDay.has(d)) byDay.set(d, []); byDay.get(d).push(o); });
  const days = [...byDay.keys()].sort().reverse();
  $('#main').innerHTML = `<div class="dnav"><span>${monLabel(ym)}</span></div>
    ${days.length ? `<section class="wk"><div class="wkh"><div><b>${monLabel(ym)}</b><span>${days.length} يوم</span></div><div class="tc"><span>حصّلت</span><b class="money">${fmt(sums(ops).col)}</b></div></div>${tblHtml('اليوم', days.map(d => `<tr data-d="${d}"><td>${dayLabel(d)}</td>${sumRow(sums(byDay.get(d)))}</tr>`).join(''), sums(ops), 'الإجمالي')}</section><p class="hint">دوس على اليوم تفتحه</p>` : '<div class="list"><div class="empty">مفيش حركات في الشهر ده</div></div>'}
    <button class="lnk" id="aBack" type="button">‹ كل الشهور</button>`;
  $$('#main tr[data-d]').forEach(r => r.onclick = () => nav('a/' + r.dataset.d));
  $('#aBack').onclick = () => { archMode = 'm'; nav('a', true); };
}
function drawDay() {
  const t = today(), d = scr.day, ops = liveOps().filter(o => dayOf(o.ts) === d).sort((a, b) => b.ts - a.ts), s = sums(ops);
  $('#main').innerHTML = `<div class="dnav"><button type="button" id="aPrev" title="اليوم اللي قبله">›</button><span>${AR_DAYS[dowOf(d)]} ${dispDate(d)}${d === t ? ' · النهارده' : ''}</span><button type="button" id="aNext" title="اليوم اللي بعده"${d >= t ? ' disabled' : ''}>‹</button></div>
    <label class="pick">📅 اختار يوم<input type="date" id="aDay" value="${d}" max="${t}"></label>
    <section class="panel">${sub4(true, s)}${(k => k ? `<div class="kline ${k.amt === k.sys ? 'ok' : 'bad'}">🔒 قفلت اليوم ده ${timeOf(k.ts)}: عدّيت <span class="money">${fmt(k.amt)}</span>${k.amt === k.sys ? ' — مظبوط ✓' : ` — المفروض ${fmtN(k.sys)} (${k.amt < k.sys ? 'ناقص' : 'زيادة'} ${fmt(k.amt - k.sys)})`}</div>` : '')(cntOf(d))}</section>
    <div class="lbl"><span>حركات اليوم (${ops.length})</span><span>دوس على أي حركة تعدّلها</span></div>
    ${ops.length ? dayList(ops) : '<div class="list"><div class="empty">مفيش حركات في اليوم ده</div></div>'}
    <button class="lnk" id="aBack" type="button">‹ رجوع للأرشيف</button>`;
  $('#aPrev').onclick = () => nav('a/' + addDays(d, -1), true);
  $('#aNext').onclick = () => { if (d < t) nav('a/' + addDays(d, 1), true); };
  $('#aDay').onchange = e => { if (isDay(e.target.value)) nav('a/' + e.target.value, true); };
  $('#aBack').onclick = () => nav('a', true);
  bindOps('#main');
}

/* ---------- الإعدادات: المظهر وحجم الخط وحالة الاتصال ---------- */
function drawSettings() {
  const u = uiGet(), n = pending().length;
  $('#main').innerHTML = `<div class="card"><h2>المظهر</h2>
      <label>اللون</label><div class="seg" id="uiTheme" style="--n:3">${[['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.theme === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label>حجم الخط</label><div class="seg" id="uiFs">${[['1', 'عادي'], ['1.12', 'كبير']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.fs === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <p class="hint" style="text-align:right">"تلقائي" بيمشي على إعداد الموبايل (ليلي بالليل). الإعداد ده على الموبايل ده بس.${u.theme === 'light' && matchMedia('(prefers-color-scheme: dark)').matches ? '<br>لو اخترت "فاتح" والشاشة لسه غامقة: ده المتصفح نفسه بيغمّقها، اقفل "الوضع الداكن" من إعدادات المتصفح.' : ''}</p></div>
    <div class="card"><h2>الاتصال</h2>
      <div class="kv"><span>الحالة</span><b class="${S.bad ? 'bk' : online === false ? 'wt' : 'ok'}">${S.bad ? 'الربط اتغير — كلّم مصطفى' : online === false ? 'مفيش نت دلوقتي' : 'متصل بمصطفى'}</b></div>
      <div class="kv"><span>آخر تحديث</span><b>${S.lastOk ? dispDate(dayOf(S.lastOk)) + ' ' + timeOf(S.lastOk) : '—'}</b></div>
      <div class="kv"><span>حركات مستنية تتبعت</span><b class="${n ? 'wt' : ''}">${n}</b></div>
      <button class="big b-home" id="sSync" type="button">🔄 حدّث دلوقتي</button>
      <p class="hint" style="text-align:right">الحركات بتتبعت وبتتحدث لوحدها كل كام ثانية. ولو مفيش نت بتتحفظ على الموبايل وتتبعت أول ما يرجع.</p></div>
    <div class="card"><h2>معنى الألوان</h2><p class="hint" style="text-align:right;margin:0"><b class="ok">أخضر</b> = فلوس دخلت معاك · <b class="bk">أحمر</b> = فلوس طلعت منك · <b style="color:#2F6690">أزرق</b> = راحت لمصطفى · <b style="color:var(--gold-d)">دهبي</b> = فاتورة أو حاجة مستنية مصطفى</p></div>
    <div class="card"><h2>عن التطبيق</h2><div class="kv"><span>التطبيق</span><b>حركة السوق — فلاش أون</b></div><p class="hint" style="text-align:right;margin-top:6px">مفيش كلمة سر ولا حاجة تتظبط. أي غلطة تقدر تعدّلها أو تمسحها من الرئيسية أو الأرشيف، طول ما مصطفى لسه منقلهاش لحساباته.</p></div>`;
  $$('#uiTheme button').forEach(b => b.onclick = () => { uiSet({theme: b.dataset.v}); drawSettings(); });
  $$('#uiFs button').forEach(b => b.onclick = () => { uiSet({fs: b.dataset.v}); drawSettings(); });
  $('#sSync').onclick = async () => {
    $('#sSync').disabled = true; $('#sSync').textContent = '⏳ بحدّث…';
    await sync(); await new Promise(r => setTimeout(r, 400));
    toast(online === false ? 'مفيش نت دلوقتي. هيتبعت لوحده.' : '✔ اتحدّث');
    if (scr.v === 's') drawSettings();
  };
}

route();
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
