(function () {
  let t = 'auto'; try { t = (JSON.parse(localStorage.getItem('fo_ui') || '{}').theme) || 'auto'; } catch (e) {}
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);

<style>

.modal .big{height:58px;font-size:18px}

#toast{position:fixed;top:calc(78px + env(safe-area-inset-top));inset-inline:16px;margin:auto;max-width:420px;background:#111;color:#fff;border:2px solid var(--gold);padding:12px 14px;border-radius:12px;text-align:center;font-weight:700;z-index:60;display:none;pointer-events:none}

<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div id="foot"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/*
  حركة السوق — تطبيق الشريك (فلاش أون)
  -------------------------------------
  - الشريك بيسجل اللي حصّله من عملاء السوق. مفيش كلمة سر ولا إعدادات: الربط بييجي من "رابط الربط" اللي مصطفى بيبعته (#marketjoin=...).
  - كل حاجة متخزنة على الموبايل في fo_mkt_v1، وبتتبعت لشيت "حركة السوق" (منفصل عن شيت الحسابات) أول ما يبقى فيه نت.
  - مفيش اعتماد على "حالة النت" اللي المتصفح بيقولها: بنجرب الطلب ونتعامل مع الفشل، واللي متبعتش بيفضل مستني ويتبعت لوحده.
  - كل عملية ليها id ثابت، فمفيش تكرار أبداً حتى لو اتبعتت كذا مرة.
  - المبالغ بالقرش كأرقام صحيحة (زي برنامج الحسابات). العملية: {id, t:'pay', cid, cname, newc, amt, m: cash|insta|voda, ts, upd, del}
  - حالة العملية بيكتبها مصطفى في سجل لوحده (st_<id>): ok/ov = التحويل وصل، done = اتنقلت للحسابات، back/bv = رجّعها بملاحظة.
    ov و bv بيتقارنوا بـ upd بتاع العملية، فلو الشريك عدّلها بعد كده الحالة القديمة بتتلغي لوحدها.
  - أرصدة عملاء السوق (cust) بيبعتها برنامج الحسابات. الرصيد المعروض = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش.
*/
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const normDigits = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => normDigits(s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };
const pad2 = n => String(n).padStart(2, '0');
const dayOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const today = () => dayOf(Date.now());
const timeOf = ms => { const d = new Date(ms), h = d.getHours(); return `${h % 12 || 12}:${pad2(d.getMinutes())} ${h < 12 ? 'ص' : 'م'}`; };
const M_BTN = {cash: '💵 كاش معايا', insta: '📱 إنستا لمصطفى', voda: '📱 فودافون لمصطفى'};
const M_TXT = {cash: 'كاش معايا', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const M_SAID = {cash: 'كاش', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};

/* ====================== التخزين على الموبايل ====================== */
const LS = 'fo_mkt_v1';
let S;
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  S = Object.assign({u: '', k: '', dev: '', cursor: 0, ops: {}, st: {}, cust: {}, newc: [], lastOk: 0}, d || {});
  if (!S.dev) S.dev = Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('');
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('الموبايل مش قادر يحفظ. كلّم مصطفى.', 6000); } }
load();
const newId = () => 'm_' + Date.now().toString(36) + S.dev + Math.random().toString(36).slice(2, 6);
const bump = o => { o.upd = Math.max(Date.now(), (o.upd || 0) + 1); };

/* رابط الربط: فيه لينك شيت السوق ومفتاحه بعد علامة # (مبيتبعتش لأي سيرفر) */
const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
(function join() {
  const m = location.hash.match(/marketjoin=([\w-]+)/);
  if (!m) return;
  let o = null; try { o = JSON.parse(unb64u(m[1])); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  if (!o || !o.u || !o.k) { setTimeout(() => toast('الرابط ناقص. اطلب من مصطفى يبعته تاني.', 8000), 300); return; }
  if (S.u !== o.u) { S.cursor = 0; S.st = {}; S.cust = {}; Object.values(S.ops).forEach(x => { delete x.sy; }); }
  S.u = o.u; S.k = o.k; S.bad = false; save();
  setTimeout(() => toast('✔ التطبيق اتربط. ممكن تحطه على الشاشة الرئيسية.', 5000), 300);
})();

/* ====================== الحسابات ====================== */
const stOf = o => S.st['st_' + o.id];
function opState(o) {               // done | back | wait (عند مصطفى) | unsent (لسه على الموبايل)
  const s = stOf(o);
  if (s && s.done) return 'done';
  if (s && s.back && s.bv === o.upd) return 'back';
  return o.sy === o.upd ? 'wait' : 'unsent';
}
/* العميل الجديد بعد ما مصطفى يربطه بحساب: عملياته بتتعرض تحت الحساب ده */
function aliases() {
  const a = {};
  Object.values(S.st).forEach(s => { const o = S.ops[s.op]; if (s.pid && o && o.cid && o.cid !== s.pid) a[o.cid] = s.pid; });
  return a;
}
const liveOps = () => Object.values(S.ops).filter(o => !o.del);
function customers() {
  const al = aliases(), m = new Map();
  Object.values(S.cust).forEach(c => { if (!c.del) m.set(c.id, {id: c.id, name: c.name, bal: c.bal || 0}); });
  S.newc.forEach(c => { if (!al[c.id] && !m.has(c.id)) m.set(c.id, {id: c.id, name: c.name, bal: 0, nw: true}); });
  liveOps().forEach(o => { const id = al[o.cid] || o.cid; if (!m.has(id)) m.set(id, {id, name: o.cname, bal: 0, nw: id.startsWith('n_')}); });
  /* الصافي = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش */
  liveOps().forEach(o => { if (o.t === 'pay' && opState(o) !== 'done') { const c = m.get(al[o.cid] || o.cid); if (c) c.bal -= o.amt; } });
  return m;
}
const custOps = (cid, al) => liveOps().filter(o => (al[o.cid] || o.cid) === cid);
const todayCash = () => liveOps().filter(o => o.t === 'pay' && o.m === 'cash' && dayOf(o.ts) === today()).reduce((s, o) => s + o.amt, 0);
const pending = () => Object.values(S.ops).filter(o => o.sy !== o.upd);
const backs = () => liveOps().filter(o => opState(o) === 'back').sort((a, b) => b.ts - a.ts);

/* ====================== الاتصال بالشيت ====================== */
let online = null, syncing = false, again = false;
async function callSheet(body, ms = 25000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(S.u, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key: S.k}, body)), signal: ctl.signal});
    return JSON.parse(await r.text());
  } finally { clearTimeout(tm); }
}
function merge(r) {
  if (!r || !r.id || !r.data) return false;
  const box = r.kind === 'op' ? S.ops : r.kind === 'st' ? S.st : r.kind === 'cust' ? S.cust : null;
  if (!box) return false;
  const cur = box[r.id];
  if (cur && cur.upd > r.upd) return false;
  if (cur && cur.upd === r.upd) { if (r.kind === 'op') cur.sy = cur.upd; return false; }
  box[r.id] = Object.assign({}, r.data, {id: r.id, upd: r.upd, del: !!r.del}, r.kind === 'op' ? {sy: r.upd} : {});
  return true;
}
const view = o => [dayOf(o.ts) + ' ' + timeOf(o.ts), o.cname + (o.newc ? ' (جديد)' : ''), o.amt / 100, M_SAID[o.m] || o.m, ''];
async function sync() {
  if (!S.u || S.bad) return;
  if (syncing) { again = true; return; }
  syncing = true; let changed = false;
  try {
    let p = pending();
    while (p.length) {
      const batch = p.slice(0, 40);
      const rows = batch.map(o => { const d = Object.assign({}, o); delete d.sy; return {id: o.id, kind: 'op', upd: o.upd, del: !!o.del, view: view(o), data: d}; });
      const j = await callSheet({action: 'push', who: 'm', rows});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true) throw new Error('push');
      const ack = new Set(j.ack || []);
      batch.forEach((o, i) => { if (ack.has(o.id) && o.upd === rows[i].upd) o.sy = o.upd; });
      if (batch.some(o => !ack.has(o.id))) throw new Error('ack');
      changed = true; save(); p = pending();
    }
    let more = true;
    while (more) {
      const j = await callSheet({action: 'pull', since: S.cursor});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true || !Array.isArray(j.rows)) throw new Error('pull');
      j.rows.forEach(r => { if (merge(r)) changed = true; });
      S.cursor = j.next || S.cursor; more = !!j.more;
    }
    online = true; S.lastOk = Date.now();
  } catch (e) { online = false; }
  finally {
    syncing = false; save(); drawTop();
    if (changed) refresh();
    if (again) { again = false; setTimeout(sync, 300); }
  }
}
/* طول ما التطبيق مفتوح: بيسحب الجديد كل 5 ثواني، وأي حاجة مستنية بتتبعت لوحدها */
setInterval(() => { if (!document.hidden) sync(); }, 5000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
addEventListener('pageshow', () => sync());

/* ====================== الشاشات ====================== */
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', ms); }
function modal(html) { $('#modal').innerHTML = html; $('#mask').classList.add('on'); }
function closeModal() { $('#mask').classList.remove('on'); $('#modal').innerHTML = ''; }
$('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeModal(); });
function ask(msg, yes, no = 'لأ', danger = false) {
  return new Promise(res => {
    modal(`<p>${esc(msg)}</p><button class="big ${danger ? 'b-red' : 'b-cash'}" id="aY" type="button">${esc(yes)}</button><button class="big b-home" id="aN" type="button">${esc(no)}</button>`);
    $('#aY').onclick = () => { closeModal(); res(true); };
    $('#aN').onclick = () => { closeModal(); res(false); };
  });
}

const LOGO = '<img src="icons/logo.jpg" alt="">';
let scr = {v: 'list'};
function dotHtml() {
  if (!S.u) return '';
  const n = pending().length;
  if (S.bad) return '<span class="dot off"><i></i>الربط اتغير</span>';
  if (n) return `<span class="dot w" id="dot"><i></i>${n} ${n === 1 ? 'مستنية تتبعت' : 'مستنيين يتبعتوا'}</span>`;
  if (online === false) return '<span class="dot w" id="dot"><i></i>مفيش نت</span>';
  return '<span class="dot" id="dot"><i></i>متصل</span>';
}
function drawTop() {
  const t = $('#top');
  if (scr.v === 'pay') t.innerHTML = `<button class="back" id="bBack" type="button">→ رجوع</button>${dotHtml()}`;
  else t.innerHTML = `${LOGO}<div><h1>حركة السوق</h1><small>فلاش أون</small></div>${dotHtml()}`;
  if ($('#bBack')) $('#bBack').onclick = () => nav('');
}
/* التنقل بالـ # علشان زرار الرجوع بتاع الموبايل يشتغل */
function nav(h, replace) {
  const u = location.pathname + (h ? '#' + h : '');
  if (replace) history.replaceState(null, '', u); else history.pushState(null, '', u);
  route();
}
addEventListener('popstate', route);
function route() {
  closeModal();
  const h = decodeURIComponent(location.hash.slice(1)), [a, b, c] = h.split('/');
  scr = a === 'p' && b ? {v: 'pay', cid: b, op: c || ''} : a === 'ok' && b && S.ops[b] ? {v: 'ok', op: b} : {v: 'list'};
  render(); window.scrollTo(0, 0);
}
function render() {
  drawTop();
  if (!S.u) { $('#foot').innerHTML = ''; $('#main').innerHTML = `<div class="gate">${LOGO}<h2>حركة السوق</h2><p>التطبيق ده لسه متربطش.<br>اطلب من مصطفى يبعتلك الرابط على الواتساب وافتحه من هنا.</p></div>`; return; }
  if (scr.v === 'pay') return drawPay();
  if (scr.v === 'ok') return drawSaved();
  drawList();
}
/* لما يوصل جديد من الشيت: نرسم من غير ما نبوّظ اللي بيكتبه */
function refresh() {
  if ($('#mask').classList.contains('on')) return;
  if (scr.v === 'list') { const q = $('#q') ? $('#q').value : ''; drawList(q); }
  else if (scr.v === 'pay') { drawPayInfo(); }
  else if (scr.v === 'ok') drawSaved();
}

/* ---------- شاشة العملاء ---------- */
const balHtml = b => b > 0 ? `<span class="bal money">عليه ${fmt(b)}</span>` : '<span class="bal z">مفيش عليه</span>';
const rowHtml = c => `<div class="row" data-c="${esc(c.id)}"><b>${esc(c.name)}${c.nw ? '<span class="nw">عميل جديد</span>' : ''}</b>${balHtml(c.bal)}</div>`;
function drawList(q0) {
  const cs = customers(), al = aliases();
  const bk = backs();
  $('#main').innerHTML = `${bk.length ? `<button class="alert" id="bk" type="button">🔴 مصطفى رجّعلك ${bk.length === 1 ? 'عملية' : bk.length + ' عمليات'} تصلحها — دوس هنا</button>` : ''}
    <input class="search" id="q" type="search" placeholder="🔍 دوّر على عميل…" autocomplete="off" value="${esc(q0 || '')}">
    <div id="lists"></div>`;
  const draw = () => {
    const q = norm($('#q').value), all = [...cs.values()].sort((a, b) => a.name.localeCompare(b.name, 'ar'));
    if (q) { const f = all.filter(c => norm(c.name).includes(q)); $('#lists').innerHTML = f.length ? `<div class="lbl">نتيجة البحث</div><div class="list">${f.map(rowHtml).join('')}</div>` : '<div class="empty">مفيش عميل بالاسم ده.<br>لو جديد دوس "+ عميل جديد" تحت.</div>'; }
    else {
      /* آخر زيارات = آخر العملاء اللي اتسجلهم حاجة (آخر شهر) */
      const seen = [], since = Date.now() - 30 * 86400000;
      liveOps().filter(o => o.ts >= since).sort((a, b) => b.ts - a.ts).forEach(o => { const id = al[o.cid] || o.cid; if (!seen.includes(id) && cs.has(id) && seen.length < 5) seen.push(id); });
      const rest = all.filter(c => !seen.includes(c.id));
      $('#lists').innerHTML = (seen.length ? `<div class="lbl">آخر زيارات</div><div class="list">${seen.map(id => rowHtml(cs.get(id))).join('')}</div>` : '')
        + `<div class="lbl">كل العملاء</div>` + (rest.length ? `<div class="list">${rest.map(rowHtml).join('')}</div>` : `<div class="empty">${cs.size ? '' : 'لسه العملاء منزلوش. استنى ثواني والنت شغال.'}</div>`);
    }
    $$('#lists .row').forEach(r => r.onclick = () => nav('p/' + r.dataset.c));
  };
  draw();
  $('#q').oninput = draw;
  if ($('#bk')) $('#bk').onclick = () => { const o = bk[0]; nav('p/' + (al[o.cid] || o.cid) + '/' + o.id); };
  $('#foot').innerHTML = `<div class="bar"><div class="t"><span>معاك النهارده كاش</span><b class="money" id="cashT">${fmt(todayCash())}</b></div><button class="sbtn" id="bNew" type="button">+ عميل جديد</button></div>`;
  $('#bNew').onclick = newCustomer;
}
function newCustomer() {
  modal(`<h3>عميل جديد</h3><p style="font-size:15px;color:var(--sub)">اكتب اسمه بس، ومصطفى هيظبط الباقي.</p>
    <input class="inp" id="ncN" autocomplete="off" placeholder="اسم العميل">
    <button class="big b-cash" id="ncOk" type="button">كمّل</button><button class="big b-home" id="ncX" type="button">رجوع</button>`);
  setTimeout(() => $('#ncN') && $('#ncN').focus(), 60);
  $('#ncX').onclick = closeModal;
  $('#ncOk').onclick = () => {
    const name = $('#ncN').value.trim().replace(/\s+/g, ' ');
    if (!name) return toast('اكتب اسم العميل');
    const ex = [...customers().values()].find(c => norm(c.name) === norm(name));
    if (ex) { closeModal(); toast('العميل ده موجود في القايمة'); return nav('p/' + ex.id); }
    const c = {id: 'n_' + newId().slice(2), name, ts: Date.now()};
    S.newc.push(c); save(); closeModal(); nav('p/' + c.id);
  };
}

/* ---------- شاشة الدفعة ---------- */
function drawPay() {
  const cs = customers(), c = cs.get(scr.cid);
  if (!c) return nav('', true);
  const ed = scr.op && S.ops[scr.op] && !S.ops[scr.op].del ? S.ops[scr.op] : null;
  if (scr.op && (!ed || opState(ed) === 'done')) { toast(ed ? 'العملية دي اتنقلت خلاص، ومصطفى هو اللي يعدّلها' : 'العملية دي مش موجودة'); return nav('p/' + scr.cid, true); }
  const bs = ed && opState(ed) === 'back' ? stOf(ed) : null;
  $('#foot').innerHTML = '';
  $('#main').innerHTML = `<div class="cust" id="cBox"></div>
    ${ed ? `<div class="note" style="background:var(--gold-l);color:var(--gold-d)">✏️ بتعدّل دفعة ${fmt(ed.amt)} ${esc(M_SAID[ed.m])}</div>` : ''}
    ${bs ? `<div class="note">🔴 مصطفى رجّعها: ${esc(bs.back)}</div>` : ''}
    <label class="amt" for="amt"><input id="amt" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" value="${ed ? fmt(ed.amt) : ''}"><em>جنيه</em></label>
    ${['cash', 'insta', 'voda'].map(m => `<button class="big b-${m}" data-m="${m}" type="button">${M_BTN[m]}</button>`).join('')}
    <p class="hint">${ed ? 'دوس على الطريقة الصح وهتتحفظ' : 'دوسة على الزرار بتحفظ على طول'}</p>
    <div id="tdy"></div>`;
  lastSave = 0;
  const inp = $('#amt');
  inp.addEventListener('input', () => {
    let s = normDigits(inp.value).replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    inp.value = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  });
  /* لوحة الأرقام تفتح لوحدها */
  inp.focus(); setTimeout(() => { if (document.activeElement !== inp) inp.focus(); }, 120);
  $$('#main .big[data-m]').forEach(b => {
    b.addEventListener('mousedown', e => e.preventDefault());   // علشان الكيبورد ميقفلش ويتحرك الزرار قبل الدوسة
    b.onclick = () => savePay(c, b.dataset.m, ed);
  });
  drawPayInfo();
}
/* الجزء اللي بيتحدث لوحده (الرصيد واللي اتسجل النهارده) من غير ما نلمس خانة المبلغ */
function drawPayInfo() {
  const cs = customers(), c = cs.get(scr.cid);
  if (!c || !$('#cBox')) return;
  $('#cBox').innerHTML = `<b>${esc(c.name)}${c.nw ? '<span class="nw">عميل جديد</span>' : ''}</b><div>${c.bal > 0 ? `<span>عليه</span><b class="money">${fmt(c.bal)}</b>` : '<span class="z">مفيش عليه</span>'}</div>`;
  const ops = custOps(c.id, aliases()).filter(o => o.t === 'pay' && (dayOf(o.ts) === today() || opState(o) === 'back')).sort((a, b) => b.ts - a.ts);
  $('#tdy').innerHTML = ops.length ? `<div class="lbl" style="margin-top:18px">اتسجل للعميل ده النهارده</div><div class="list mini">${ops.map(o => `<div class="row" data-o="${esc(o.id)}"><b>${esc(M_TXT[o.m])}</b><span class="money">${fmt(o.amt)}</span>${stHtml(o)}</div>`).join('')}</div>` : '';
  $$('#tdy .row').forEach(r => r.onclick = () => opMenu(S.ops[r.dataset.o]));
}
function stHtml(o) {
  const s = opState(o);
  return s === 'done' ? '<span class="st ok">✓ اتنقلت</span>' : s === 'back' ? '<span class="st bk">🔴 راجعة</span>' : s === 'wait' ? '<span class="st wt">⏳ عند مصطفى</span>' : '<span class="st ns">⏳ لسه متبعتتش</span>';
}
function opMenu(o) {
  if (!o) return;
  const s = opState(o), c = customers().get(scr.cid);
  if (s === 'done') return toast('دي اتنقلت للحسابات. أي تصحيح من عند مصطفى.', 4000);
  modal(`<h3>${esc(c ? c.name : o.cname)} — ${fmt(o.amt)} ${esc(M_SAID[o.m])}</h3>
    <p style="font-size:14.5px;color:var(--sub)">اتسجلت ${timeOf(o.ts)}</p>
    ${s === 'back' ? `<div class="note" style="margin:0 0 6px">🔴 مصطفى رجّعها: ${esc((stOf(o) || {}).back)}</div>` : ''}
    <button class="big b-again" id="omE" type="button" style="margin-top:6px">✏️ عدّلها</button>
    <button class="big b-red" id="omD" type="button">🗑 غلطت، امسحها</button>
    <button class="big b-home" id="omX" type="button">رجوع</button>`);
  $('#omX').onclick = closeModal;
  $('#omE').onclick = () => { closeModal(); nav('p/' + scr.cid + '/' + o.id); };
  $('#omD').onclick = async () => { closeModal(); await delOp(o); };
}
async function delOp(o) {
  if (opState(o) === 'done') return toast('دي اتنقلت للحسابات. أي تصحيح من عند مصطفى.', 4000);
  if (!(await ask(`تمسح دفعة ${fmt(o.amt)} ${M_SAID[o.m]}؟`, 'أيوه امسحها', 'لأ', true))) return false;
  o.del = true; bump(o); save(); sync();
  toast('اتمسحت ✔');
  return true;
}
let lastSave = 0;
async function savePay(c, m, ed) {
  if (Date.now() - lastSave < 700) return;   // دوستين ورا بعض = دوسة واحدة
  const amt = Math.round(+normDigits($('#amt').value).replace(/\D/g, '') * 100);
  if (!(amt > 0)) { toast('اكتب المبلغ الأول'); $('#amt').focus(); return; }
  lastSave = Date.now();
  if (ed) {
    if (opState(ed) === 'done') return toast('دي اتنقلت خلاص');
    if (ed.amt === amt && ed.m === m) return nav('ok/' + ed.id, true);
    Object.assign(ed, {amt, m}); bump(ed); save(); sync();
    return nav('ok/' + ed.id, true);
  }
  /* حماية من التكرار: نفس المبلغ لنفس العميل في خلال دقيقتين */
  const al = aliases(), dup = custOps(c.id, al).find(o => o.t === 'pay' && o.amt === amt && Date.now() - o.ts < 120000);
  if (dup && !(await ask(`سجلت ${fmt(amt)} للعميل ده من شوية. دي دفعة تانية؟`, 'أيوه، دفعة تانية', 'لأ، دي نفسها'))) { lastSave = 0; return; }
  const now = Date.now();
  const o = {id: newId(), t: 'pay', cid: c.id, cname: c.name, newc: !!c.nw, amt, m, ts: now, upd: now, del: false};
  S.ops[o.id] = o;
  save(); sync();
  nav('ok/' + o.id, true);
}

/* ---------- شاشة اتسجلت ---------- */
function drawSaved() {
  const o = S.ops[scr.op]; if (!o) return nav('', true);
  const al = aliases(), cid = al[o.cid] || o.cid, c = customers().get(cid), s = opState(o);
  $('#foot').innerHTML = '';
  $('#main').innerHTML = o.del ? `<div class="done"><h2 style="color:var(--red)">اتمسحت</h2></div><button class="big b-home" id="sHome" type="button" style="margin-top:22px">رجوع للعملاء</button>` : `<div class="done">
      <div class="chk">✓</div><h2>${o.upd !== o.ts ? 'اتعدّلت' : 'اتسجلت'}</h2>
      <div class="sent">${esc(c ? c.name : o.cname)}<br>دفع <b class="money">${fmt(o.amt)}</b> جنيه ${esc(M_SAID[o.m])}
        <small class="${s === 'unsent' ? 'wt' : s === 'back' ? 'bk' : 'ok'}" id="sSt">${s === 'unsent' ? '⏳ هتتبعت أول ما النت يرجع' : s === 'done' ? '✓ اتنقلت للحسابات' : s === 'back' ? '🔴 مصطفى رجّعها' : '✓ وصلت لمصطفى'}</small></div></div>
    <button class="big b-again" id="sAgain" type="button">في فلوس تانية من نفس العميل</button>
    <button class="big b-home" id="sHome" type="button">رجوع للعملاء</button>
    ${s !== 'done' ? '<button class="oops" id="sDel" type="button">غلطت، امسحها</button>' : ''}`;
  $('#sHome').onclick = () => nav('', true);
  if ($('#sAgain')) $('#sAgain').onclick = () => nav('p/' + cid, true);
  if ($('#sDel')) $('#sDel').onclick = async () => { if (await delOp(o)) nav('p/' + cid, true); };
}

route();
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
