<script>
/* الوضع الليلي: نفس إعداد باقي البرنامج (fo_ui) — تلقائي حسب الموبايل */
(function () {
  let t = 'auto'; try { t = (JSON.parse(localStorage.getItem('fo_ui') || '{}').theme) || 'auto'; } catch (e) {}
  const dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
})();

<style>

.modal .inp{width:100%;height:54px;border:1.5px solid #D6CDB5;border-radius:11px;background:var(--card);padding:0 14px;font-size:19px;outline:none;margin-bottom:6px}

#toast{position:fixed;top:calc(78px + env(safe-area-inset-top));inset-inline:16px;margin:auto;max-width:420px;background:#111;color:#fff;border:2px solid var(--gold);padding:12px 14px;border-radius:12px;text-align:center;font-weight:700;z-index:60;display:none;pointer-events:none}

.bar .r1{display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer}

.inp2{width:100%;height:52px;border:1.5px solid #D6CDB5;border-radius:11px;background:var(--card);padding:0 14px;font-size:18px;outline:none;margin-top:10px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}

.row small{display:block;color:var(--sub);font-size:12px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}

.tbl tr.tot td{background:var(--gold-l);font-weight:800}

.dnav{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 10px}
.dnav button{width:44px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-size:24px;font-weight:800;line-height:1;cursor:pointer;color:var(--ink);padding:0}
.dnav button:disabled{opacity:.35}
.dnav span{flex:1;text-align:center;border:1px solid var(--gold);background:var(--gold-l);border-radius:10px;padding:7px 10px;font-weight:800;font-size:16px;color:var(--gold-d)}
.pick{position:relative;display:block;text-align:center;border:1.5px solid var(--ink);border-radius:10px;height:46px;line-height:43px;font-weight:800;font-size:15.5px;margin-bottom:10px;cursor:pointer;overflow:hidden}

.tot4{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 14px;margin-top:12px}

.tot4 div:last-child{border-bottom:0;font-size:18px}
.tot4 b{font-size:18px}.tot4 b.neg{color:var(--red)}
.top .ttl{font-size:18px;font-weight:800;margin-inline-start:8px}
</style>

<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div id="foot"></div>
<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script>
'use strict';
/*
  حركة السوق — تطبيق الشريك (فلاش أون)
  -------------------------------------
  - الشريك بيسجل اللي حصّله من عملاء السوق. مفيش كلمة سر ولا إعدادات: الربط بييجي من "رابط الربط" اللي مصطفى بيبعته (#marketjoin=...).
  - كل حاجة متخزنة على الموبايل في fo_mkt_v1، وبتتبعت لشيت "حركة السوق" (منفصل عن شيت الحسابات) أول ما يبقى فيه نت.
  - مفيش اعتماد على "حالة النت" اللي المتصفح بيقولها: بنجرب الطلب ونتعامل مع الفشل، واللي متبعتش بيفضل مستني ويتبعت لوحده.
  - كل عملية ليها id ثابت، فمفيش تكرار أبداً حتى لو اتبعتت كذا مرة.
  - المبالغ بالقرش كأرقام صحيحة (زي برنامج الحسابات). العملية: {id, t:'pay', cid, cname, newc, amt, m: cash|insta|voda, ts, upd, del}
  - حالة العملية بيكتبها مصطفى في سجل لوحده (st_<id>): ok/ov = التحويل وصل، done = اتنقلت للحسابات، back/bv = رجّعها بملاحظة.
    ov و bv بيتقارنوا بـ upd بتاع العملية، فلو الشريك عدّلها بعد كده الحالة القديمة بتتلغي لوحدها.
  - أرصدة عملاء السوق (cust) بيبعتها برنامج الحسابات. الرصيد المعروض = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش.
*/
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const normDigits = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => normDigits(s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };
const pad2 = n => String(n).padStart(2, '0');
const dayOf = ms => { const d = new Date(ms); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
const today = () => dayOf(Date.now());
const timeOf = ms => { const d = new Date(ms), h = d.getHours(); return `${h % 12 || 12}:${pad2(d.getMinutes())} ${h < 12 ? 'ص' : 'م'}`; };
const M_BTN = {cash: '💵 كاش معايا', insta: '📱 إنستا لمصطفى', voda: '📱 فودافون لمصطفى'};
const M_TXT = {cash: 'كاش معايا', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const M_SAID = {cash: 'كاش', insta: 'إنستا لمصطفى', voda: 'فودافون لمصطفى'};
const SP_CATS = [['بنزين', '⛽'], ['مواصلات', '🚌'], ['أكل', '🍽'], ['حاجة تانية', '🧾']];
const AR_DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const RLM = '\u200F';
const dispDate = iso => { const [y, m, d] = (iso || '').split('-'); return y ? `${d}${RLM}/${RLM}${m}${RLM}/${RLM}${y}` : ''; };
const dowOf = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d, 12).getDay(); };
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return dayOf(new Date(y, m - 1, d + n, 12).getTime()); };
const fmtN = p => (p < 0 ? '-' : '') + fmt(p);

/* ====================== التخزين على الموبايل ====================== */
const LS = 'fo_mkt_v1';
let S;
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  S = Object.assign({u: '', k: '', dev: '', cursor: 0, ops: {}, st: {}, cust: {}, newc: [], lastOk: 0}, d || {});
  if (!S.dev) S.dev = Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('');
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('الموبايل مش قادر يحفظ. كلّم مصطفى.', 6000); } }
load();
const newId = () => 'm_' + Date.now().toString(36) + S.dev + Math.random().toString(36).slice(2, 6);
const bump = o => { o.upd = Math.max(Date.now(), (o.upd || 0) + 1); };

/* رابط الربط: فيه لينك شيت السوق ومفتاحه بعد علامة # (مبيتبعتش لأي سيرفر) */
const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
(function join() {
  const m = location.hash.match(/marketjoin=([\w-]+)/);
  if (!m) return;
  let o = null; try { o = JSON.parse(unb64u(m[1])); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  if (!o || !o.u || !o.k) { setTimeout(() => toast('الرابط ناقص. اطلب من مصطفى يبعته تاني.', 8000), 300); return; }
  if (S.u !== o.u) { S.cursor = 0; S.st = {}; S.cust = {}; Object.values(S.ops).forEach(x => { delete x.sy; }); }
  S.u = o.u; S.k = o.k; S.bad = false; save();
  setTimeout(() => toast('✔ التطبيق اتربط. ممكن تحطه على الشاشة الرئيسية.', 5000), 300);
})();

/* ====================== الحسابات ====================== */
const stOf = o => S.st['st_' + o.id];
function opState(o) {               // done | back | wait (عند مصطفى) | unsent (لسه على الموبايل)
  const s = stOf(o);
  if (s && s.done) return 'done';
  if (s && s.back && s.bv === o.upd) return 'back';
  return o.sy === o.upd ? 'wait' : 'unsent';
}
/* العميل الجديد بعد ما مصطفى يربطه بحساب: عملياته بتتعرض تحت الحساب ده */
function aliases() {
  const a = {};
  Object.values(S.st).forEach(s => { const o = S.ops[s.op]; if (s.pid && o && o.cid && o.cid !== s.pid) a[o.cid] = s.pid; });
  return a;
}
const liveOps = () => Object.values(S.ops).filter(o => !o.del);
const payOps = () => liveOps().filter(o => o.t === 'pay');
function customers() {
  const al = aliases(), m = new Map();
  Object.values(S.cust).forEach(c => { if (!c.del) m.set(c.id, {id: c.id, name: c.name, bal: c.bal || 0}); });
  S.newc.forEach(c => { if (!al[c.id] && !m.has(c.id)) m.set(c.id, {id: c.id, name: c.name, bal: 0, nw: true}); });
  payOps().forEach(o => { const id = al[o.cid] || o.cid; if (!m.has(id)) m.set(id, {id, name: o.cname, bal: 0, nw: id.startsWith('n_')}); });
  /* الصافي = رصيده في الحسابات − الدفعات اللي اتسجلت هنا ولسه متنقلتش */
  payOps().forEach(o => { if (opState(o) !== 'done') { const c = m.get(al[o.cid] || o.cid); if (c) c.bal -= o.amt; } });
  return m;
}
const custOps = (cid, al) => payOps().filter(o => (al[o.cid] || o.cid) === cid);

let online = null, syncing = false, again = false;
async function callSheet(body, ms = 25000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(S.u, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key: S.k}, body)), signal: ctl.signal});
    return JSON.parse(await r.text());
  } finally { clearTimeout(tm); }
}
function merge(r) {
  if (!r || !r.id || !r.data) return false;
  const box = r.kind === 'op' ? S.ops : r.kind === 'st' ? S.st : r.kind === 'cust' ? S.cust : null;
  if (!box) return false;
  const cur = box[r.id];
  if (cur && cur.upd > r.upd) return false;
  if (cur && cur.upd === r.upd) { if (r.kind === 'op') cur.sy = cur.upd; return false; }
  box[r.id] = Object.assign({}, r.data, {id: r.id, upd: r.upd, del: !!r.del}, r.kind === 'op' ? {sy: r.upd} : {});
  return true;
}
const view = o => [dayOf(o.ts) + ' ' + timeOf(o.ts), o.t === 'pay' ? o.cname + (o.newc ? ' (جديد)' : '') : o.t === 'spay' ? o.sname : o.t === 'exp' ? o.cat + (o.note ? ' — ' + o.note : '') : 'تسليم لمصطفى', o.amt / 100, o.t === 'pay' ? M_SAID[o.m] || o.m : {exp: 'مصروف', spay: 'دفعة مورد', hand: 'تسليم كاش'}[o.t], ''];
async function sync() {
  if (!S.u || S.bad) return;
  if (syncing) { again = true; return; }
  syncing = true; let changed = false;
  try {
    let p = pending();
    while (p.length) {
      const batch = p.slice(0, 40);
      const rows = batch.map(o => { const d = Object.assign({}, o); delete d.sy; return {id: o.id, kind: 'op', upd: o.upd, del: !!o.del, view: view(o), data: d}; });
      const j = await callSheet({action: 'push', who: 'm', rows});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true) throw new Error('push');
      const ack = new Set(j.ack || []);
      batch.forEach((o, i) => { if (ack.has(o.id) && o.upd === rows[i].upd) o.sy = o.upd; });
      if (batch.some(o => !ack.has(o.id))) throw new Error('ack');
      changed = true; save(); p = pending();
    }
    let more = true;
    while (more) {
      const j = await callSheet({action: 'pull', since: S.cursor});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true || !Array.isArray(j.rows)) throw new Error('pull');
      j.rows.forEach(r => { if (merge(r)) changed = true; });
      S.cursor = j.next || S.cursor; more = !!j.more;
    }
    online = true; S.lastOk = Date.now();
  } catch (e) { online = false; }
  finally {
    syncing = false; save(); drawTop();
    if (changed) refresh();
    if (again) { again = false; setTimeout(sync, 300); }
  }
}

      <div class="chk">✓</div><h2>${o.upd !== o.ts ? 'اتعدّلت' : 'اتسجلت'}</h2>
      <div class="sent">${sentHtml(o, c)}
        <small class="${s === 'unsent' ? 'wt' : s === 'back' ? 'bk' : 'ok'}" id="sSt">${stTxt}</small></div></div>
    ${again ? `<button class="big b-again" id="sAgain" type="button">${again}</button>` : ''}
    <button class="big b-home" id="sHome" type="button"${again ? '' : ' style="margin-top:22px"'}>رجوع للعملاء</button>
    ${s !== 'done' ? '<button class="oops" id="sDel" type="button">غلطت، امسحها</button>' : ''}`;
  $('#sHome').onclick = () => nav('', true);
  if ($('#sAgain')) $('#sAgain').onclick = () => { if (o.t === 'pay') nav('p/' + cid, true); else { spTab = o.t; nav('x', true); } };
  if ($('#sDel')) $('#sDel').onclick = async () => { if (await delOp(o)) o.t === 'pay' ? nav('p/' + cid, true) : nav('', true); };
}

/* ---------- صرفت: مصروف أو دفعة لمورد (بتتخصم من اللي معايا) ---------- */
let spTab = 'exp';
function bindAmt(inp) {
  inp.addEventListener('input', () => {
    const s = normDigits(inp.value).replace(/\D/g, '').replace(/^0+/, '').slice(0, 9);
    inp.value = s.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  });
}
const amtOf = el => Math.round(+normDigits(el.value).replace(/\D/g, '') * 100);
/* أسامي الموردين اللي كتبها قبل كده (الأحدث الأول) علشان يختار منها بدل ما يكتب */
function spNames() {
  const seen = new Map();
  Object.values(S.ops).filter(o => o.t === 'spay').sort((a, b) => b.ts - a.ts).forEach(o => { const k = norm(o.sname); if (!seen.has(k)) seen.set(k, o.sname); });
  return [...seen.values()].slice(0, 12);
}
function drawSpend() {
  const ed = scr.op && S.ops[scr.op] && !S.ops[scr.op].del && (S.ops[scr.op].t === 'exp' || S.ops[scr.op].t === 'spay') ? S.ops[scr.op] : null;
  if (scr.op && (!ed || opState(ed) === 'done')) { toast(ed ? 'العملية دي اتنقلت خلاص، ومصطفى هو اللي يعدّلها' : 'العملية دي مش موجودة'); return nav('x', true); }
  if (ed) spTab = ed.t;
  const bs = ed && opState(ed) === 'back' ? stOf(ed) : null;
  lastSave = 0;
  $('#foot').innerHTML = '';
  $('#main').innerHTML = `${ed ? `<div class="note" style="background:var(--gold-l);color:var(--gold-d);margin:0 0 8px">✏️ بتعدّل ${esc(opWhat(ed))} — ${fmt(ed.amt)}</div>` : ''}
    ${bs ? `<div class="note" style="margin:0 0 8px">🔴 مصطفى رجّعها: ${esc(bs.back)}</div>` : ''}
    ${ed ? '' : `<div class="seg" id="spT"><button type="button" data-v="exp" class="${spTab === 'exp' ? 'on' : ''}">مصروف</button><button type="button" data-v="spay" class="${spTab === 'spay' ? 'on' : ''}">دفعت لمورد</button></div>`}
    <div id="spBody"></div>
    <p class="hint">بتتخصم من اللي معاك كاش (${fmtN(cashNow())})</p>`;
  $$('#spT button').forEach(b => b.onclick = () => { spTab = b.dataset.v; $$('#spT button').forEach(x => x.classList.toggle('on', x === b)); body(); });
  const body = () => {
    const amtBox = `<label class="amt" for="amt" style="margin-top:10px"><input id="amt" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" value="${ed ? fmt(ed.amt) : ''}"><em>جنيه</em></label>`;
    if (spTab === 'exp') {
      $('#spBody').innerHTML = `${amtBox}<input class="inp2" id="nt" autocomplete="off" placeholder="ملاحظة (اختياري) — مثلاً: مصروفات اليوم" value="${esc(ed ? ed.note || '' : '')}">
        ${SP_CATS.map(([c, ic]) => `<button class="big b-cat" data-c="${esc(c)}" type="button">${ic} ${esc(c)}</button>`).join('')}
        <p class="hint" style="margin-top:10px">اكتب الرقم وبعدين دوس على نوع المصروف وهيتحفظ. ${ed ? '' : 'تقدر تسجلهم واحد واحد أو تجمعهم في إجمالي آخر اليوم.'}</p>`;
      bindAmt($('#amt'));
      $$('#spBody .big[data-c]').forEach(b => { b.addEventListener('mousedown', e => e.preventDefault()); b.onclick = () => saveSpend('exp', {cat: b.dataset.c, note: $('#nt').value.trim()}, ed); });
      if (ed) { const sel = $$('#spBody .big[data-c]').find(b => b.dataset.c === ed.cat); if (sel) sel.style.outline = '3px solid var(--gold)'; }
      $('#amt').focus(); setTimeout(() => { const i = $('#amt'); if (i && document.activeElement !== i) i.focus(); }, 120);
    } else {
      const names = spNames();
      $('#spBody').innerHTML = `<input class="inp2" id="sn" autocomplete="off" placeholder="اسم المورد (اكتبه)" value="${esc(ed ? ed.sname : '')}" style="margin-top:0">
        ${names.length ? `<div class="chips">${names.map(n => `<button class="chip" type="button" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>` : ''}
        ${amtBox}
        <button class="big b-cash" id="spOk" type="button">${ed ? 'حفظ التعديل' : 'حفظ'}</button>`;
      bindAmt($('#amt'));
      $$('#spBody .chip').forEach(c => c.onclick = () => { $('#sn').value = c.dataset.n; $('#amt').focus(); });
      $('#spOk').onclick = () => saveSpend('spay', {sname: $('#sn').value.trim().replace(/\s+/g, ' ')}, ed);
      if (!ed) setTimeout(() => $('#sn') && $('#sn').focus(), 100);
    }
  };
  body();
}
async function saveSpend(t, x, ed) {
  if (Date.now() - lastSave < 700) return;
  const amt = amtOf($('#amt'));
  if (!(amt > 0)) { toast('اكتب المبلغ الأول'); $('#amt').focus(); return; }
  if (t === 'spay' && !x.sname) { toast('اكتب اسم المورد'); $('#sn').focus(); return; }
  lastSave = Date.now();
  if (ed) {
    if (opState(ed) === 'done') return toast('دي اتنقلت خلاص');
    if (ed.amt === amt && (t === 'exp' ? ed.cat === x.cat && (ed.note || '') === x.note : ed.sname === x.sname)) return nav('ok/' + ed.id, true);
    Object.assign(ed, {amt}, x); bump(ed); save(); sync();
    return nav('ok/' + ed.id, true);
  }
  /* حماية من التكرار: نفس المبلغ لنفس النوع في خلال دقيقتين */
  const dup = liveOps().find(o => o.t === t && o.amt === amt && (t === 'exp' ? o.cat === x.cat : norm(o.sname) === norm(x.sname)) && Date.now() - o.ts < 120000);
  if (dup && !(await ask(`سجلت ${fmt(amt)} (${t === 'exp' ? x.cat : x.sname}) من شوية. دي مرة تانية؟`, 'أيوه، مرة تانية', 'لأ، دي نفسها'))) { lastSave = 0; return; }
  const now = Date.now();
  const o = Object.assign({id: newId(), t, amt, ts: now, upd: now, del: false}, x);
  S.ops[o.id] = o; save(); sync();
  nav('ok/' + o.id, true);
}

/* ---------- سلمت لمصطفى (كاش) ---------- */
function handModal(ed) {
  if (ed && opState(ed) === 'done') return toast('دي اتنقلت خلاص، ومصطفى هو اللي يعدّلها');
  const cn = cashNow();
  modal(`<h3>${ed ? 'تعديل التسليم' : 'سلمت لمصطفى كاش'}</h3>
    <p style="font-size:15px;color:var(--sub)">اكتب الفلوس اللي سلمتها له. مصطفى هيأكد "استلمت" من عنده.</p>
    <label class="amt" for="hAmt" style="margin-top:0"><input id="hAmt" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="0" value="${ed ? fmt(ed.amt) : ''}"><em>جنيه</em></label>
    ${cn > 0 ? `<button class="sbtn" id="hAll" type="button" style="width:100%;margin-top:10px">كل اللي معايا (${fmt(cn)})</button>` : ''}
    <button class="big b-cash" id="hOk" type="button">${ed ? 'حفظ' : 'سلمت'}</button><button class="big b-home" id="hX" type="button">رجوع</button>`);
  bindAmt($('#hAmt'));
  setTimeout(() => $('#hAmt') && $('#hAmt').focus(), 80);
  $('#hX').onclick = closeModal;
  if ($('#hAll')) $('#hAll').onclick = () => { $('#hAmt').value = fmt(cn).replace(/[^\d,]/g, ''); };
  $('#hOk').onclick = async () => {
    const amt = amtOf($('#hAmt'));
    if (!(amt > 0)) return toast('اكتب المبلغ');
    if (ed) {
      if (ed.amt !== amt) { ed.amt = amt; bump(ed); save(); sync(); }
      closeModal(); return nav('ok/' + ed.id, true);
    }
    const dup = liveOps().find(o => o.t === 'hand' && o.amt === amt && Date.now() - o.ts < 120000);
    if (dup && !(await ask(`سجلت تسليم ${fmt(amt)} من شوية. دي مرة تانية؟`, 'أيوه، مرة تانية', 'لأ، دي نفسها'))) return;
    const now = Date.now(), o = {id: newId(), t: 'hand', amt, ts: now, upd: now, del: false};
    S.ops[o.id] = o; save(); sync(); closeModal();
    nav('ok/' + o.id, true);
  };
}

/* ---------- حسابي: كل يوم سطر + إجمالي الأسبوع ---------- */
const weekStart = iso => addDays(iso, -((dowOf(iso) + 1) % 7));   // الأسبوع بيبدأ سبت
const dayLabel = d => `${AR_DAYS[dowOf(d)]}<small>${+d.slice(8)}${RLM}/${RLM}${+d.slice(5, 7)}</small>`;
const nz = n => n ? fmt(n) : '—';
function drawSummary() {
  $('#foot').innerHTML = '';
  const t = today(), w0 = weekStart(t), all = liveOps(), cn = cashNow();
  const days = []; for (let d = t; d >= w0; d = addDays(d, -1)) days.push(d);
  const rows = days.map(d => ({d, s: sums(all.filter(o => dayOf(o.ts) === d))})).filter(r => r.d === t || r.s.col || r.s.toM || r.s.sp);
  const tot = sums(all.filter(o => dayOf(o.ts) >= w0));
  const cell = (n, neg) => `<td class="${neg && n < 0 ? 'neg' : ''}">${neg ? (n < 0 ? '-' : '') + (n ? fmt(n) : '—') : nz(n)}</td>`;
  $('#main').innerHTML = `<div class="cust"><b>معاك كاش دلوقتي</b><div><b class="money ${cn < 0 ? 'neg' : ''}" style="font-size:26px">${fmtN(cn)}</b></div></div>
    <div class="lbl">الأسبوع ده</div>
    <div class="list"><table class="tbl"><thead><tr><th>اليوم</th><th>حصّلت</th><th>راح لمصطفى</th><th>مصروف</th><th>معايا</th></tr></thead><tbody>
      ${rows.map(r => `<tr data-d="${r.d}"><td>${dayLabel(r.d)}</td>${cell(r.s.col)}${cell(r.s.toM)}${cell(r.s.sp)}${cell(r.s.left, true)}</tr>`).join('')}
      <tr class="tot"><td>إجمالي الأسبوع</td>${cell(tot.col)}${cell(tot.toM)}${cell(tot.sp)}${cell(tot.left, true)}</tr></tbody></table></div>
    <p class="hint" style="margin-top:10px">"راح لمصطفى" = التحويلات + الكاش اللي سلمته. "مصروف" = المصروفات + دفعات الموردين.</p>
    <button class="big b-again" id="sArch" type="button" style="margin-top:16px">الأرشيف (أيام أقدم)</button>`;
  $$('#main tr[data-d]').forEach(r => r.onclick = () => nav('a/' + r.dataset.d));
  $('#sArch').onclick = () => nav('a');
}

/* ---------- الأرشيف: يوم يوم، لسنين ---------- */
function drawArchive() {
  $('#foot').innerHTML = '';
  const t = today(), d = scr.day || t, ops = liveOps().filter(o => dayOf(o.ts) === d).sort((a, b) => b.ts - a.ts), s = sums(ops);
  $('#main').innerHTML = `<div class="dnav"><button type="button" id="aPrev" title="اليوم اللي قبله">›</button><span>${AR_DAYS[dowOf(d)]} ${dispDate(d)}${d === t ? ' · النهارده' : ''}</span><button type="button" id="aNext" title="اليوم اللي بعده"${d >= t ? ' disabled' : ''}>‹</button></div>
    <label class="pick">📅 اختار يوم<input type="date" id="aDay" value="${d}" max="${t}"></label>
    ${ops.length ? `<div class="list mini">${ops.map(o => `<div class="row" data-o="${esc(o.id)}"><b>${esc(opWhat(o))}<small>${timeOf(o.ts)} — ${esc(opHow(o))}</small></b><span class="money">${fmt(o.amt)}</span>${stHtml(o)}</div>`).join('')}</div>` : '<div class="empty">مفيش حركات في اليوم ده</div>'}
    <div class="tot4"><div><span>حصّلت</span><b class="money">${fmt(s.col)}</b></div><div><span>راح لمصطفى</span><b class="money">${fmt(s.toM)}</b></div><div><span>مصروف</span><b class="money">${fmt(s.sp)}</b></div><div><span>معايا</span><b class="money ${s.left < 0 ? 'neg' : ''}">${fmtN(s.left)}</b></div></div>`;
  $('#aPrev').onclick = () => nav('a/' + addDays(d, -1), true);
  $('#aNext').onclick = () => { if (d < t) nav('a/' + addDays(d, 1), true); };
  $('#aDay').onchange = e => { if (/^\d{4}-\d{2}-\d{2}$/.test(e.target.value)) nav('a/' + e.target.value, true); };
  $$('#main .row[data-o]').forEach(r => r.onclick = () => opMenu(S.ops[r.dataset.o]));
}

route();
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
