<script>
/* المظهر (تلقائي / فاتح / داكن) وحجم الخط: نفس مفتاح باقي البرنامج fo_ui، بيتطبق قبل ما الصفحة تترسم */
function uiGet() { try { return Object.assign({theme: 'auto', fs: '1'}, JSON.parse(localStorage.getItem('fo_ui') || '{}')); } catch (e) { return {theme: 'auto', fs: '1'}; } }
function uiSet(o) { try { localStorage.setItem('fo_ui', JSON.stringify(Object.assign(uiGet(), o))); } catch (e) {} uiApply(); }
function uiApply() {
  const u = uiGet(), r = document.documentElement;
  const dark = u.theme === 'dark' || (u.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  r.style.setProperty('--z', u.fs); r.dataset.fs = u.fs === '1' ? '' : 'z';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0d0c0a' : '#17150f';
}
uiApply();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', uiApply); } catch (e) {}

<style>

<script id="engine">
'use strict';
/* ====================== قواعد الحساب (دوال صافية من غير شاشة — الاختبارات بتشغلها لوحدها) ======================
   كل الفلوس بالقرش أرقام صحيحة. التواريخ نص YYYY-MM-DD بتوقيت القاهرة. */
const pad2 = n => String(n).padStart(2, '0');
const ymd = iso => iso.split('-').map(Number);
const addDays = (iso, n) => { const [y, m, d] = ymd(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const weekday = iso => { const [y, m, d] = ymd(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };   // 0=الأحد … 5=الجمعة 6=السبت
/* خميس القبض اللي اليوم ده تبعه: الجمعة تبع الخميس اللي قبلها */
function ownerThursday(iso) { const wd = weekday(iso); return wd === 5 ? addDays(iso, -1) : addDays(iso, (4 - wd + 7) % 7); }
/* أيام الأسبوع: السبت..الخميس شغل، وبعدهم الجمعة */
const weekDates = thu => [5, 4, 3, 2, 1, 0].map(b => addDays(thu, -b)).concat([addDays(thu, 1)]);
const UNITS = [0, 0.5, 1, 1.5];
const U_BTN = {0: 'غاب', 0.5: 'نص', 1: 'يوم', 1.5: 'يوم ونص'};
function unitsText(n) {
  n = Math.round(n * 2) / 2;
  if (n === 0) return 'من غير أيام';
  if (n === 0.5) return 'نص يوم';
  if (n === 1) return 'يوم';
  if (n === 1.5) return 'يوم ونص';
  if (n === 2) return 'يومين';
  if (n === 2.5) return 'يومين ونص';
  return n % 1 ? `${Math.floor(n)} أيام ونص` : `${n} أيام`;
}
/* المرتب والصافي لعامل في أسبوع (بالقرش) */
function settle({daysPay = 0, fridayPay = 0, bonus = 0, advances = 0, oldDeduct = 0, prevFridayDelta = 0, carryIn = 0}) {
  const wages = daysPay + fridayPay + bonus;
  const after = wages - advances - prevFridayDelta - carryIn;
  if (after <= 0) return {wages, oldApplied: 0, net: 0, carryOut: -after};
  const oldApplied = Math.min(Math.max(oldDeduct, 0), after);
  return {wages, oldApplied, net: after - oldApplied, carryOut: 0};
}
/* فهرس الحركات (الحية بس). أنواع السجلات (k):
   sup مشرف، wk عامل، day يوم (d_<عامل>_<تاريخ>)، adv سلفة، bon حافز، wst حالة أسبوع (ws_<خميس>: الجمعة شغل/إجازة)،
   lk قفل أسبوع (lk_<خميس> فيه اللقطة snap)، pd قبض (pd_<خميس>_<عامل>)، log سطر سجل.
   المرحلة التانية: old سلفة قديمة (eff = أول خميس بتتخصم منه)، rule قاعدة خصم لعامل (ru_<عامل>: mode none|auto|fixed و amt و eff)،
   wded خصم الأسبوع ده بس (wd_<خميس>_<عامل>: mode skip|amt)، fdf فرق جمعة (fd_<خميس>_<عامل>: done 0|1 = جه ولا لأ في جمعة الأسبوع اللي فات). */
function buildIdx(list) {
  const I = {W: new Map(), day: new Map(), dayBy: new Map(), adv: [], bon: [], ws: new Map(), lk: new Map(), pd: new Map(), sup: [], log: [], old: [], rule: new Map(), wded: new Map(), fdf: new Map(), first: null, memo: new Map()};
  list.forEach(r => {
    if (!r || r.del) return;
    if (r.k === 'wk') I.W.set(r.id, r);
    else if (r.k === 'day') { I.day.set(r.w + '|' + r.date, r); if (!I.dayBy.has(r.date)) I.dayBy.set(r.date, []); I.dayBy.get(r.date).push(r); }
    else if (r.k === 'adv') I.adv.push(r);
    else if (r.k === 'bon') I.bon.push(r);
    else if (r.k === 'wst') I.ws.set(r.thu, r);
    else if (r.k === 'lk') I.lk.set(r.thu, r);
    else if (r.k === 'pd') I.pd.set(r.thu + '|' + r.w, r);
    else if (r.k === 'sup') I.sup.push(r);
    else if (r.k === 'log') I.log.push(r);
    else if (r.k === 'old') I.old.push(r);
    else if (r.k === 'rule') I.rule.set(r.w, r);
    else if (r.k === 'wded') I.wded.set(r.thu + '|' + r.w, r);
    else if (r.k === 'fdf') I.fdf.set(r.thu + '|' + r.w, r);
  });
  const ths = [];
  I.W.forEach(w => { if (w.from) ths.push(ownerThursday(w.from)); });
  I.day.forEach(d => ths.push(ownerThursday(d.date)));
  I.adv.forEach(a => ths.push(ownerThursday(a.date)));
  I.bon.forEach(b => ths.push(b.thu));
  I.first = ths.sort()[0] || null;
  return I;
}
/* حساب أسبوع: لو مقفول بنرجّع اللقطة المثبتة، وإلا بنحسب من الحركات (fresh = احسب حتى لو مقفول، وقت القفل أو إعادة الحساب).
   oldPaid = اللي اتخصم من السلف القديمة لكل عامل لحد الأسبوع ده (تراكمي). */
function calcWeek(I, thu, fresh) {
  const lk = I.lk.get(thu);
  if (!fresh && lk && lk.snap) return {thu, closed: true, lk, fri: lk.snap.fri, rows: lk.snap.rows, total: lk.snap.total, oldPaid: lk.snap.oldPaid || {}};
  const key = thu + (fresh ? '!' : '');
  if (I.memo.has(key)) return I.memo.get(key);
  const ds = weekDates(thu), work = ds.slice(0, 6);
  const ws = I.ws.get(thu), fri = ws && ws.fri === 'work' ? 'work' : 'off';
  const prev = addDays(thu, -7), pw = I.first && prev >= I.first ? calcWeek(I, prev) : null;
  const pf = pw && pw.fri === 'work' ? pw : null;         // الجمعة اللي فاتت كانت شغل: فرق الجمعة
  const prevPaid = pw && pw.oldPaid ? pw.oldPaid : {};
  const fdDelta = id => { const pay = pf && pf.rows[id] ? pf.rows[id].fridayPay || 0 : 0, f = I.fdf.get(thu + '|' + id); return pay ? Math.round((1 - (f ? f.done : 1)) * pay) : 0; };
  const ids = new Set();
  I.W.forEach(w => { if (w.st === 'on' && (!w.from || w.from <= thu)) ids.add(w.id); });
  work.forEach(d => (I.dayBy.get(d) || []).forEach(r => ids.add(r.w)));
  const advs = I.adv.filter(a => ownerThursday(a.date) === thu), bons = I.bon.filter(b => b.thu === thu);
  advs.forEach(a => ids.add(a.w)); bons.forEach(b => ids.add(b.w));
  if (pw) Object.keys(pw.rows).forEach(id => { if (pw.rows[id].carryOut || fdDelta(id)) ids.add(id); });
  const rows = {}, oldPaid = Object.assign({}, prevPaid);
  let total = 0;
  ids.forEach(id => {
    const w = I.W.get(id); if (!w) return;
    const days = {};
    let daysPay = 0, units = 0;
    work.forEach(d => { const r = I.day.get(id + '|' + d); if (r) { days[d] = r.u; units += r.u; daysPay += Math.round(r.u * r.rate); } });
    const fridayPay = fri === 'work' && w.st === 'on' ? (w.fri || 0) : 0;
    const bonus = bons.filter(b => b.w === id).reduce((s, b) => s + b.amt, 0);
    const advances = advs.filter(a => a.w === id).reduce((s, a) => s + a.amt, 0);
    const carryIn = pw && pw.rows[id] ? pw.rows[id].carryOut || 0 : 0;
    const prevFridayDelta = fdDelta(id);
    /* السلف القديمة: الباقي = مجموعها − اللي اتخصم قبل كده. الطلب: خصم الأسبوع ده (wded) وإلا قاعدة العامل (rule) */
    const oldTotal = I.old.filter(o => o.w === id && o.eff <= thu).reduce((s, o) => s + o.amt, 0);
    const oldBefore = Math.max(oldTotal - (prevPaid[id] || 0), 0);
    const wd = I.wded.get(thu + '|' + id), ru = I.rule.get(id);
    /* لو الأسبوع مقفول واتعاد حسابه بعد تعديل: بنحتفظ بطلب الخصم اللي اتثبت وقت القفل (تغيير القاعدة بعد كده مبيغيرش الأسابيع القديمة) */
    const sr = fresh && lk && lk.snap && lk.snap.rows[id], keep = !wd && sr && sr.oldReq !== undefined;
    let req = 0, auto = false;
    if (wd) req = wd.mode === 'skip' ? 0 : wd.amt || 0;
    else if (keep) { auto = !!sr.oldAuto; req = auto ? oldBefore : sr.oldReq; }
    else if (ru && ru.eff <= thu) { auto = ru.mode === 'auto'; req = auto ? oldBefore : ru.mode === 'fixed' ? ru.amt || 0 : 0; }
    const oldDeduct = Math.min(Math.max(req, 0), oldBefore);
    const s = settle({daysPay, fridayPay, bonus, advances, oldDeduct, prevFridayDelta, carryIn});
    if (oldTotal || prevPaid[id]) oldPaid[id] = (prevPaid[id] || 0) + s.oldApplied;
    rows[id] = Object.assign({w: id, name: w.name, days, units, daysPay, fridayPay, bonus, advances, carryIn, prevFridayDelta, oldBefore, oldReq: req, oldAuto: auto, oldLeft: oldBefore - s.oldApplied, oldSkip: !!(wd && wd.mode === 'skip')}, s);
    total += s.net;
  });
  const res = {thu, closed: false, fri, rows, total, oldPaid};
  I.memo.set(key, res);
  return res;
}
/* الأيام الناقصة للعمال الشغالين (ممنوع القفل اليدوي لو فيه حاجة ناقصة) */
function missingDays(I, thu) {
  const out = [];
  [...I.W.values()].filter(w => w.st === 'on').sort((a, b) => (a.ord || 0) - (b.ord || 0)).forEach(w => {
    weekDates(thu).slice(0, 6).forEach(d => { if ((!w.from || d >= w.from) && !I.day.has(w.id + '|' + d)) out.push({w: w.id, name: w.name, date: d}); });
  });
  return out;
}

<script>
'use strict';
/*
  المرتبات (قبض العمال) — فلاش أون
  ---------------------------------
  - تطبيق منفصل تماماً عن الحسابات والخزنة. شيت جوجل لوحده (كوده payScript تحت)، وتخزين على الموبايل في fo_pay_v1 بس.

  - كل حركة سجل بـ id ثابت و upd و by (اسم المشرف) و at (الوقت). الأحدث upd يكسب. سطر السجل (log) مبيتعدلش أبداً.
  - الصافي والمرحّل بيتحسبوا على الموبايل من الحركات (calcWeek)، ومش بيتخزنوا. بعد القفل اللقطة بتتحفظ في lk_<خميس>.

const $ = s => document.querySelector(s);

const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };

const AR_DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const RLM = '‏';
const TZ = 'Africa/Cairo';

/* ====================== التخزين على الموبايل ====================== */
const LS = 'fo_pay_v1';
let S;
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  S = Object.assign({u: '', k: '', dev: '', cursor: 0, me: '', recs: {}, lastOk: 0, lastPull: 0, bad: false}, d || {});
  if (!S.dev) S.dev = Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('');
}

load();

let IDX = null;

const me = () => { const r = S.recs[S.me]; return r && !r.del && r.k === 'sup' ? r : null; };

const wName = id => (S.recs[id] || {}).name || '؟';

/* حفظ حركة: نفس الـ id = نفس الحركة (الأحدث يكسب). by و at = مين عمل آخر تغيير وإمتى */
function put(k, data) {

  const r = Object.assign({}, cur || {}, data, {k, by: myName(), at: now, upd: Math.max(now, (cur ? cur.upd : 0) + 1), del: !!data.del});

}
function log(txt, extra) { return put('log', Object.assign({id: newId('l'), txt}, extra || {})); }

/* رابط الربط (فيه لينك الشيت ومفتاحه بعد # — مبيتبعتش لأي سيرفر) */
const b64u = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

  const m = location.hash.match(/payjoin=([\w-]+)/);
  if (!m) return;
  let o = null; try { o = JSON.parse(unb64u(m[1])); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  if (!o || !o.u || !o.k) { setTimeout(() => toast('الرابط ناقص. اطلب من شريكك يبعته تاني.', 8000), 300); return; }
  if (S.u !== o.u) { S.cursor = 0; S.lastPull = 0; Object.values(S.recs).forEach(r => { delete r.sy; }); }

/* الرقم السري: hash (SHA-256) مع id المشرف، فمحدش يقدر يقراه من الشيت */
async function pinHash(sid, pin) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fo-pay|' + sid + '|' + pin));

/* ====================== كود شيت جوجل (Apps Script) — كامل لكل أنواع الحركات في المرحلتين ====================== */
const payScript = () => `// المرتبات (قبض العمال) — فلاش أون. شيت منفصل لوحده، مقفول بمفتاح سري بيتحفظ أول مرة.
// أنواع الحركات: sup مشرف، wk عامل، day يوم، adv سلفة، bon حافز، wst حالة أسبوع (الجمعة)، lk قفل أسبوع (فيه الأرقام المثبتة)،
// pd قبض، old سلفة قديمة، rule قاعدة خصم، wded خصم أسبوع، fdf فرق جمعة، log سطر في السجل (مبيتعدلش أبداً).
const SHEET = 'الحركات';
const HEAD = ['id','الكود','آخر تعديل','رقم المزامنة','ملغي','النوع','العامل','التاريخ','المبلغ','مين','إمتى','البيانات (لا تعدّلها)'];
const W = HEAD.length;
function sh_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let s = ss.getSheetByName(SHEET);
  if (!s) { s = ss.insertSheet(SHEET); s.appendRow(HEAD); s.setFrozenRows(1); }
  return s;
}
function doGet() { return out_({ok: false, error: 'locked'}); }
function key_(k) {
  if (typeof k !== 'string' || k.length < 8) return false;

  if (!s) {
    const l = LockService.getScriptLock(); l.waitLock(10000);
    try { s = p.getProperty('KEY'); if (!s) { p.setProperty('KEY', k); s = k; } } finally { l.releaseLock(); }

function resetKey() { PropertiesService.getScriptProperties().deleteProperty('KEY'); }
function doPost(e) {

  if (!req || !key_(req.key)) return out_({ok: false, error: 'key'});
  const p = PropertiesService.getScriptProperties();
  if (req.action === 'ping') return out_({ok: true, app: 'fo-pay', v: 1, n: Math.max(sh_().getLastRow() - 1, 0), seq: Number(p.getProperty('SEQ')) || 0});

}
function push_(rows) {
  const lock = LockService.getScriptLock(); lock.waitLock(30000);
  try {
    const s = sh_(), last = s.getLastRow();
    const cur = last > 1 ? s.getRange(2, 1, last - 1, 3).getValues() : [];
    const pos = {}; cur.forEach((r, i) => pos[String(r[0])] = i);
    const props = PropertiesService.getScriptProperties();
    let seq = Number(props.getProperty('SEQ')) || 0;

    rows.forEach(r => {
      if (!r || !r.id) return;
      const i = pos[r.id];

      if (i !== undefined && Number(cur[i][2]) >= Number(r.upd)) return;
      if (addAt[r.id] !== undefined && Number(add[addAt[r.id]][2]) >= Number(r.upd)) return;

      const v = (r.view || []).concat(['', '', '', '', '', '']).slice(0, 6);
      const line = [r.id, r.kind, r.upd, seq, r.del ? 'نعم' : ''].concat(v, [JSON.stringify(r.data)]);

  const s = sh_(), last = s.getLastRow();
  if (last < 2) return {ok: true, rows: [], next: since, more: false};
  const v = s.getRange(2, 1, last - 1, W).getValues().filter(r => Number(r[3]) > since);
  v.sort((a, b) => Number(a[3]) - Number(b[3]));

  const rows = page.map(r => { try { return {id: String(r[0]), kind: String(r[1]), upd: Number(r[2]), del: r[4] === 'نعم', data: JSON.parse(r[W - 1])}; } catch (e) { return null; } }).filter(Boolean);

/* ====================== الاتصال بالشيت ====================== */
let online = null, syncing = false, again = false;
async function callSheet(body, url = S.u, key = S.k, ms = 25000) {
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify(Object.assign({key}, body)), signal: ctl.signal});

  } finally { clearTimeout(tm); }
}
function merge(r) {
  if (!r || !r.id || !r.data) return false;
  const cur = S.recs[r.id];
  if (cur && cur.upd > r.upd) return false;
  if (cur && cur.upd === r.upd) { cur.sy = cur.upd; return false; }

const cell = s => { s = String(s ?? ''); return /^[=+\-@]/.test(s) ? "'" + s : s; };   // علشان الشيت ميفهمش الكلام كمعادلة
const KIND_AR = {sup: 'مشرف', wk: 'عامل', day: 'يوم', adv: 'سلفة', bon: 'حافز', wst: 'الجمعة', lk: 'قفل أسبوع', pd: 'قبض', old: 'سلفة قديمة', rule: 'قاعدة خصم', wded: 'خصم أسبوع', fdf: 'فرق جمعة', log: 'سجل'};

function view(r) {
  const when = r.at ? dayOf(r.at) + ' ' + timeOf(r.at) : '';
  const t = KIND_AR[r.k] || r.k;
  if (r.k === 'log') return [t, cell(r.txt), r.thu || '', '', cell(r.by), when];
  if (r.k === 'sup') return [t, cell(r.name), '', '', cell(r.by), when];
  if (r.k === 'wk') return [t, cell(r.name), r.from || '', (r.rate || 0) / 100, cell(r.by), when];
  if (r.k === 'day') return [t + ': ' + unitsText(r.u), cell(wName(r.w)), r.date, Math.round(r.u * r.rate) / 100, cell(r.by), when];
  if (r.k === 'adv') return [t, cell(wName(r.w)), r.date, r.amt / 100, cell(r.by), when];
  if (r.k === 'bon' || r.k === 'pd') return [t, cell(wName(r.w)), r.thu, r.amt / 100, cell(r.by), when];
  if (r.k === 'wst') return [r.fri === 'work' ? 'الجمعة شغل' : 'الجمعة إجازة', '', r.thu, '', cell(r.by), when];
  if (r.k === 'lk') return [t + (r.auto ? ' (تلقائي)' : ''), '', r.thu, r.snap ? r.snap.total / 100 : '', cell(r.by), when];
  return [t, cell(wName(r.w)), r.thu || r.date || '', r.amt ? r.amt / 100 : '', cell(r.by), when];
}
const pending = () => Object.values(S.recs).filter(r => r.sy !== r.upd);
async function sync() {
  if (!S.u || S.bad) return;
  if (syncing) { again = true; return; }
  syncing = true; let changed = false;
  try {
    let p = pending();
    while (p.length) {
      const batch = p.slice(0, 50);
      const rows = batch.map(r => { const d = Object.assign({}, r); delete d.sy; return {id: r.id, kind: r.k, upd: r.upd, del: !!r.del, view: view(r), data: d}; });
      const j = await callSheet({action: 'push', rows});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true) throw new Error('push');
      const ack = new Set(j.ack || []);
      batch.forEach((r, i) => { if (ack.has(r.id) && r.upd === rows[i].upd) r.sy = r.upd; });
      if (batch.some(r => !ack.has(r.id))) throw new Error('ack');
      save(); p = pending();
    }
    let more = true;
    while (more) {
      const j = await callSheet({action: 'pull', since: S.cursor});
      if (j && j.error === 'key') { S.bad = true; throw new Error('key'); }
      if (!j || j.ok !== true || !Array.isArray(j.rows)) throw new Error('pull');
      j.rows.forEach(r => { if (merge(r)) changed = true; });

  finally {

    drawTop();

/* ====================== قفل الأسبوع ====================== */
/* القفل: الأرقام بتتثبت في lk_<خميس>. التلقائي: الأيام اللي متسجلتش = غياب باسم "تلقائي" (upd صغير، فأي تسجيل حقيقي بيكسبه) */

/* بعد ما الجمعة تعدي: أي أسبوع لسه مفتوح بيتقفل لوحده (بالترتيب). لو فيه شيت، لازم نكون سحبنا الجديد من شوية */

  const on = all.filter(w => w.st === 'on'), stop = all.filter(w => w.st === 'stop'), gone = all.filter(w => w.st === 'gone');
  const row = w => `<div class="row" data-w="${esc(w.id)}"><div class="m"><b>${esc(w.name)}${w.st === 'stop' ? '<span class="tag stop">واقف</span>' : w.st === 'gone' ? '<span class="tag gone">مشى</span>' : ''}</b><small>يومية ${fmt(w.rate)} · جمعة ${fmt(w.fri)}</small></div><div class="a"><b class="money">${fmt(w.rate)}</b></div></div>`;

    <div class="lbl"><span>الشغالين (${on.length})</span><span>اليومية</span></div>
    <div class="list">${on.length ? on.map(row).join('') : '<div class="empty">لسه مفيش عمال</div>'}</div>
    ${stop.length ? `<div class="lbl"><span>واقفين (${stop.length})</span></div><div class="list">${stop.map(row).join('')}</div>` : ''}

/* أول خميس لسه مقفولش: السلف القديمة والقاعدة بتبدأ منه (الأسابيع اللي اتقفلت قبله مبتتغيرش) */
function firstOpenThu() {
  const I = idx(), nowThu = ownerThursday(today());
  let t = I.first && I.first < nowThu ? I.first : nowThu;
  while (I.lk.has(t)) t = addDays(t, 7);
  return t;
}
/* الباقي من السلف القديمة بعد الأسبوع الحالي */
function oldLeftNow(wid) {
  const I = idx(), tot = I.old.filter(o => o.w === wid).reduce((s, o) => s + o.amt, 0);
  if (!tot) return 0;
  const c = calcWeek(I, firstOpenThu());
  return Math.max(tot - ((c.oldPaid || {})[wid] || 0), 0);
}

/* ---------- الأرشيف: الأسابيع المقفولة، متجمعة كل 4 أسابيع في "الشهر الأول/التاني/…" بإجماليه ---------- */
const ORD = ['', 'الأول', 'التاني', 'التالت', 'الرابع', 'الخامس', 'السادس', 'السابع', 'التامن', 'التاسع', 'العاشر', 'الحداشر', 'الاتناشر'];
const monthName = n => 'الشهر ' + (ORD[n] || n);
/* بيرجّع المجموعات: الأقدم أول، كل 4 أسابيع مقفولة بالترتيب مجموعة */
function archiveGroups(ls) {
  const asc = ls.slice().sort((a, b) => a.thu.localeCompare(b.thu)), g = [];
  asc.forEach((l, i) => { if (i % 4 === 0) g.push({n: g.length + 1, weeks: [], total: 0}); const x = g[g.length - 1]; x.weeks.push(l); x.total += l.snap.total; });
  return g;
}
function drawArchive() {
  const I = idx(), ls = [...I.lk.values()].filter(l => l.snap);
  const weekRow = l => {
    const rs = Object.values(l.snap.rows).filter(r => r.net > 0), paid = rs.filter(r => I.pd.has(l.thu + '|' + r.w)).length, ds = weekDates(l.thu);
    return `<div class="row" data-thu="${l.thu}"><div class="m"><b>أسبوع الخميس ${dm(l.thu)}</b><small>${dm(ds[0])} → ${dm(ds[5])} · ${l.auto ? 'تلقائي' : esc(l.closer || l.by)}${l.snap.fri === 'work' ? ' · الجمعة شغل' : ''}</small></div><div class="a"><b class="money">${fmt(l.snap.total)}</b><small class="sm ${paid < rs.length ? 'wt' : 'ok'}">قبض ${paid} من ${rs.length}</small></div></div>`;
  };
  const gs = archiveGroups(ls).reverse();
  $('#main').innerHTML = gs.length ? gs.map(g => `<div class="lbl"><span><b>${monthName(g.n)}</b> · ${g.weeks.length === 4 ? '4 أسابيع' : g.weeks.length + (g.weeks.length === 1 ? ' أسبوع' : ' أسابيع') + ' (لسه)'}</span><span class="money" style="color:var(--ink)">${fmt(g.total)}</span></div>
      <div class="list">${g.weeks.slice().reverse().map(weekRow).join('')}</div>`).join('') + '<p class="hint">دوس على أي أسبوع تفتحه، تعلّم مين قبض، أو تعدّل فيه (الأرقام بتتحسب تاني).</p>'
    : '<div class="list"><div class="empty">لسه مفيش أسابيع مقفولة.<br>الأسبوع بيتقفل يوم الخميس (أو لوحده بعد الجمعة).</div></div>';
  $$('#main .row[data-thu]').forEach(r => r.onclick = () => nav('w/' + r.dataset.thu));
}

/* ---------- السجل: كل تغيير بالترتيب، ومفيش حاجة بتتمسح منه ---------- */
let logN = 150;
function drawLog() {
  const ls = idx().log.slice().sort((a, b) => b.at - a.at), shown = ls.slice(0, logN);
  let last = '', html = '';
  shown.forEach(l => {
    const d = dayOf(l.at);
    if (d !== last) { if (last) html += '</div>'; html += `<div class="lbl"><span>${dayFull(d)}${d === today() ? ' · النهارده' : ''}</span></div><div class="log">`; last = d; }
    html += `<div class="lg">${esc(l.txt)}<small>${timeOf(l.at)}</small></div>`;
  });
  if (last) html += '</div>';
  $('#main').innerHTML = (html || '<div class="list"><div class="empty">لسه مفيش حاجة في السجل</div></div>') + (ls.length > shown.length ? '<button class="lnk" id="lgMore" type="button">اعرض أقدم</button>' : '');
  if ($('#lgMore')) $('#lgMore').onclick = () => { logN += 150; drawLog(); };
}

/* ---------- الإعدادات ---------- */
function normSheetUrl(t) {
  t = String(t || '').replace(/\s+/g, '');
  const m = t.match(/https:\/\/script\.google(?:usercontent)?\.com\/(?:a\/[^/]+\/)?macros\/s\/[\w-]+\/exec/);
  if (m) return m[0];
  const id = t.match(/AKfy[\w-]{20,}/);
  return id ? `https://script.google.com/macros/s/${id[0]}/exec` : t;
}
function makeKey() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(12));
  return [...r].map(x => A[x % A.length]).join('').replace(/(.{4})(?!$)/g, '$1-');
}
async function connectSheet(u) {
  u = normSheetUrl(u);
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u)) return 'اللينك لازم يبدأ بـ https://script.google.com ويخلص بـ /exec';
  const k = S.k || makeKey();
  let j; try { j = await callSheet({action: 'ping'}, u, k, 30000); } catch (e) { return e.code === 'page' ? 'الشيت رد بصفحة مش مفهومة. غالباً الوصول مش "أي شخص (Anyone)".' : 'معرفتش أوصل للشيت. اتأكد من النت ومن اللينك.'; }
  if (j && j.error === 'key') return 'الشيت ده مقفول على مفتاح تاني. في Apps Script اختار الدالة resetKey واضغط تشغيل (Run) مرة، وجرّب تاني.';
  if (j && j.ok && j.app !== 'fo-pay') return 'الشيت ده عليه كود تاني (مش المرتبات). اعمل الخطوات وانسخ كود المرتبات من هنا في جدول جديد.';
  if (!j || !j.ok) return 'الشيت رد بخطأ: ' + (j && j.error || 'غير معروف');
  S.u = u; S.k = k; S.bad = false; S.cursor = 0; S.lastPull = 0; save();
  await sync();
  return '';
}

    <div class="card"><h2>المشرفين (${sups.length} من 3)</h2>
      ${sups.map(s => `<div class="kv"><span>${esc(s.name)}${s.id === S.me ? ' (أنا)' : ''}</span><b class="sm">من ${dm(dayOf(s.at))}</b></div>`).join('')}
      ${S.u ? `<button class="big b-ok" id="sShare" type="button">📲 ابعت لينك التطبيق لشريكك</button><button class="lnk" id="sCopy" type="button">انسخ اللينك بس</button>`
        : '<p class="sm" style="margin-top:8px">علشان تبعت اللينك لشريكك، اربط الشيت الأول (تحت).</p>'}</div>
    ${S.u ? '' : `<div class="card" id="sheetCard"><h2>ربط شيت جوجل (مرة واحدة من الكمبيوتر)</h2>
      <p class="sm" style="font-size:13.5px;line-height:1.8">لحد ما الشيت يتربط، كل حاجة محفوظة على الموبايل ده بس. بعد الربط هتتبعت كلها لوحدها وتقدر تبعت اللينك لشركائك.</p>
      <button class="big b-dark" id="sHelp" type="button">📋 الخطوات + انسخ الكود</button>
      <label for="sUrl">لينك الشيت (Web app URL)</label><input class="inp" id="sUrl" autocomplete="off" dir="ltr" placeholder="https://script.google.com/.../exec" style="font-size:14px">
      <button class="big b-ok" id="sLink" type="button">اربط</button><div id="sErr"></div></div>`}
    <div class="card"><h2>الاتصال</h2>
      <div class="kv"><span>الحالة</span><b class="${!S.u ? 'wt' : S.bad ? 'bk' : online === false ? 'wt' : 'ok'}">${!S.u ? 'الشيت لسه متربطش' : S.bad ? 'الربط اتغير — اطلب لينك جديد' : online === false ? 'مفيش نت دلوقتي' : 'متصل'}</b></div>
      <div class="kv"><span>آخر تحديث</span><b>${S.lastOk ? dm(dayOf(S.lastOk)) + ' ' + timeOf(S.lastOk) : '—'}</b></div>
      <div class="kv"><span>حاجات مستنية تتبعت</span><b class="${n && S.u ? 'wt' : ''}">${n}</b></div>
      ${S.u ? '<button class="big b-home" id="sSync" type="button">🔄 حدّث دلوقتي</button>' : ''}</div>
    <div class="card"><h2>المظهر</h2>
      <label>اللون</label><div class="seg" id="uiTheme" style="--n:3">${[['auto', 'تلقائي'], ['light', 'فاتح'], ['dark', 'داكن']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.theme === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label>حجم الخط</label><div class="seg" id="uiFs">${[['1', 'عادي'], ['1.12', 'كبير']].map(([k, t]) => `<button type="button" data-v="${k}" class="${u.fs === k ? 'on' : ''}">${t}</button>`).join('')}</div></div>`;
  $('#sOut').onclick = async () => { if (await ask('تخرج؟ هتحتاج اسمك ورقمك السري علشان تدخل تاني.', 'أيوه اخرج')) { S.me = ''; save(); nav('', true); } };
  if ($('#sShare')) $('#sShare').onclick = shareLink;
  if ($('#sCopy')) $('#sCopy').onclick = async () => { try { await navigator.clipboard.writeText(joinLink()); toast('اتنسخ اللينك ✔ ابعته لشريكك على واتساب', 5000); } catch (e) { modal(`<h3>لينك التطبيق</h3><pre class="code">${esc(joinLink())}</pre><button class="big b-home" id="jlX" type="button">تمام</button>`); $('#jlX').onclick = closeModal; } };
  if ($('#sHelp')) $('#sHelp').onclick = sheetHelp;
  if ($('#sLink')) $('#sLink').onclick = async () => {
    const b = $('#sLink'); b.disabled = true; b.textContent = '⏳ بيربط…'; $('#sErr').innerHTML = '';
    const err = await connectSheet($('#sUrl').value);
    if (err) { b.disabled = false; b.textContent = 'اربط'; $('#sErr').innerHTML = `<div class="note">${esc(err)}</div>`; return; }
    toast('✔ الشيت اتربط', 5000); drawSettings();
  };
  if ($('#sSync')) $('#sSync').onclick = async () => {
    $('#sSync').disabled = true; $('#sSync').textContent = '⏳ بحدّث…';
    await sync(); await new Promise(r => setTimeout(r, 300));
    toast(online === false ? 'مفيش نت دلوقتي. هيتبعت لوحده.' : '✔ اتحدّث');
    if (scr.v === 's') drawSettings();
  };
  $$('#uiTheme button').forEach(b => b.onclick = () => { uiSet({theme: b.dataset.v}); drawSettings(); });
  $$('#uiFs button').forEach(b => b.onclick = () => { uiSet({fs: b.dataset.v}); drawSettings(); });
}

route();
if (!S.u && autoClose()) { save(); refresh(); }
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
