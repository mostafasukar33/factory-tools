<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1419">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المرتبات">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>المرتبات - فلاش أون</title>
<link rel="manifest" href="payroll.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="fonts/fonts.css">
<script>
/* المظهر (تلقائي / فاتح / داكن) وحجم الخط: نفس مفتاح باقي البرنامج fo_ui، بيتطبق قبل ما الصفحة تترسم */
function uiGet() { try { return Object.assign({theme: 'auto', fs: '1'}, JSON.parse(localStorage.getItem('fo_ui') || '{}')); } catch (e) { return {theme: 'auto', fs: '1'}; } }
function uiSet(o) { try { localStorage.setItem('fo_ui', JSON.stringify(Object.assign(uiGet(), o))); } catch (e) {} uiApply(); }
function uiApply() {
  const u = uiGet(), r = document.documentElement;
  const dark = u.theme === 'dark' || (u.theme === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
  r.dataset.theme = dark ? 'dark' : 'light';
  r.style.setProperty('--z', u.fs); r.dataset.fs = u.fs === '1' ? '' : 'z';
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#07090C' : '#0F1419';
}
uiApply();
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', uiApply); } catch (e) {}
</script>
<style>
/* ===== الألوان (فاتح) — هادية ومحترفة: رمادي بارد + أخضر للفلوس + دهبي البراند ===== */
:root{--bg:#F2F4F7;--card:#fff;--line:#E3E7ED;--row:#EEF1F5;--ink:#101828;--sub:#667085;--field:#D0D5DD;
--top:#0F1419;--gold:#C9A24A;--gold-d:#8A6A1F;--gold-l:#FBF6E8;
--green:#067647;--green-l:#E7F6EE;--red:#D92D20;--red-l:#FDEDEB;--amber:#C4690A;--amber-l:#FEF3E2;--blue:#3E4FD8;--blue-l:#EEF0FD;
--wait:#B54708;--wait-l:#FFF4E5;--pri:#101828;--pri-t:#fff;
--shadow:0 1px 2px #1018280a,0 1px 3px #10182812;--r:14px}
html[data-theme=dark]{color-scheme:dark;--bg:#0B0E13;--card:#151922;--line:#262C38;--row:#1B202A;--ink:#E9ECF1;--sub:#959DAB;--field:#3A4150;
--top:#07090C;--gold-d:#E2C171;--gold-l:#2A2415;
--green:#3DD68C;--green-l:#10291D;--red:#FF7A70;--red-l:#331715;--amber:#F5B544;--amber-l:#2E2310;--blue:#A9B4FF;--blue-l:#1C2142;
--wait:#F5B544;--wait-l:#2E2310;--pri:#E9ECF1;--pri-t:#0B0E13;--shadow:0 1px 2px #0008}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;touch-action:manipulation;min-height:100vh}
html[data-fs=z] main{zoom:var(--z)}
button,input,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
.money{direction:ltr;unicode-bidi:isolate;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums lining-nums}
bdi,.iso{unicode-bidi:isolate}
/* الشريط اللي فوق */
.top{background:var(--top);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;min-height:54px;box-shadow:0 1px 0 #ffffff14,0 2px 10px #0000001f}
.top img{width:32px;height:32px;border-radius:8px;background:#fff}
.top h1{font-size:17.5px;margin:0;font-weight:800;line-height:1.2}
.top h1 small{color:var(--gold);font-size:12px;font-weight:700;margin-inline-start:8px}
.top .gear{background:#ffffff14;border:0;color:#fff;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;padding:0}
.top .gear svg{width:21px;height:21px}
.dot{margin-inline-start:auto;font-size:12px;font-weight:700;color:#A7F3C9;display:flex;align-items:center;gap:6px;white-space:nowrap;background:#ffffff12;border-radius:20px;padding:3px 10px 3px 9px}
.dot i{width:8px;height:8px;border-radius:50%;background:#32D583;display:inline-block;box-shadow:0 0 0 3px #32d58333}
.dot.w{color:#FEDF89}.dot.w i{background:#FDB022;box-shadow:0 0 0 3px #fdb02233}
.dot.off{color:#FDA29B}.dot.off i{background:#F97066;box-shadow:0 0 0 3px #f9706633}
main{padding:12px 12px 28px;max-width:560px;margin:0 auto}
main.tabbed{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
/* التبويبات اللي تحت */
#tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:4px 6px env(safe-area-inset-bottom);box-shadow:0 -2px 12px #1018280d}
#tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;font-size:12px;font-weight:700;color:var(--sub);min-height:56px;border-radius:12px}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--ink);background:var(--row)}
#tabs button.on svg{color:var(--gold-d)}
.lbl{font-size:12.5px;font-weight:700;color:var(--sub);margin:16px 4px 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.lbl b{color:var(--ink);font-weight:800}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
.p1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.p1 span{font-size:13.5px;color:var(--sub);font-weight:700}
.p1 b{font-size:28px;color:var(--green);letter-spacing:-.3px}
.cap{margin-top:4px;font-size:12.5px;color:var(--sub);font-weight:700;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:10px;border-top:1px solid var(--row);padding-top:8px}
.stats div{text-align:center;font-size:11.5px;font-weight:700;color:var(--sub);line-height:1.35}
.stats div+div{border-inline-start:1px solid var(--row)}
.stats b{display:block;font-size:16px;color:var(--ink)}
.stats b.bk{color:var(--red)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px;min-height:54px;border-bottom:1px solid var(--row);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--row)}
.row .m{min-width:0;flex:1}
.row .m b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m small,.sm{display:block;color:var(--sub);font-size:12px;font-weight:600}
.row .a{text-align:left;flex:none}
.row .a .money{display:block;font-size:16.5px}
.empty{text-align:center;color:var(--sub);padding:24px 10px;font-weight:600;font-size:14.5px}
.note{background:var(--red-l);color:var(--red);border-radius:12px;padding:8px 12px;font-weight:700;margin:10px 0 0;font-size:14px;line-height:1.7}
.info{background:var(--gold-l);color:var(--gold-d);border-radius:12px;padding:8px 12px;font-weight:700;margin:10px 0 0;font-size:13.5px;line-height:1.7}
.lnk{display:block;width:100%;margin-top:10px;background:none;border:0;color:var(--gold-d);font-weight:800;font-size:14.5px;padding:8px}
.hint{text-align:center;font-size:12.5px;color:var(--sub);margin:10px 0 0;font-weight:600}
.ok{color:var(--green)}.wt{color:var(--wait)}.bk{color:var(--red)}
/* تنبيه (أيام ناقصة / الشيت مش متربط) */
.alert{display:flex;align-items:flex-start;gap:10px;background:var(--wait-l);color:var(--wait);border:1px solid color-mix(in srgb,var(--wait) 25%,transparent);border-radius:12px;padding:9px 12px;margin:0 0 10px;font-weight:700;font-size:13.5px;line-height:1.65;width:100%;text-align:right}
.alert.red{background:var(--red-l);color:var(--red);border-color:color-mix(in srgb,var(--red) 25%,transparent)}
.alert .ic{font-size:17px;line-height:1.4}
.alert .tx{flex:1}
.alert .chips{margin:6px 0 0}
.alert .chip{border-color:currentColor;background:var(--card);color:inherit;font-size:13px;padding:2px 11px}
/* النهارده */
.dnav{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 10px}
.dnav button{width:44px;height:44px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:22px;font-weight:800;line-height:1;color:var(--ink);padding:0;box-shadow:var(--shadow)}
.dnav button:disabled{opacity:.3;box-shadow:none}
.dnav span{flex:1;text-align:center;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 10px;font-weight:800;font-size:15.5px;color:var(--ink);box-shadow:var(--shadow)}
.dnav span em{font-style:normal;color:var(--gold-d)}
.qa{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:8px;margin-bottom:4px}
.qa.two{grid-template-columns:1.4fr 1fr}
.qb{height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:800;font-size:14px;padding:0 4px;white-space:nowrap;box-shadow:var(--shadow);color:var(--ink)}
.qb.g{background:var(--green);border-color:var(--green);color:#fff}
html[data-theme=dark] .qb.g{color:#06140d}
.qb:disabled{opacity:.4}
.qb:active:not(:disabled){transform:scale(.98)}
.prog{height:4px;border-radius:4px;background:var(--row);overflow:hidden;margin:2px 4px 0}
.prog i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .25s}
.wr{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--row);min-height:58px}
.wr:last-child{border-bottom:0}
.wr.todo{background:linear-gradient(90deg,transparent,transparent),var(--card);box-shadow:inset -3px 0 0 var(--amber)}
.wr .nm{flex:1;min-width:0}
.wr .nm b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wr .nm small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* أزرار الحالة: شريط واحد مقسوم (أهدى من 4 أزرار منفصلة) */
.ub{display:grid;grid-template-columns:repeat(4,auto);gap:2px;flex:none;background:var(--row);border-radius:11px;padding:3px}
.ub button{min-width:44px;height:38px;border:0;background:none;border-radius:8px;font-weight:700;font-size:13px;padding:0 6px;white-space:nowrap;color:var(--sub)}
.ub button:disabled{opacity:.5}
.ub button.on{color:#fff;box-shadow:0 1px 2px #0002}
.ub button.on[data-u="0"]{background:var(--red)}
.ub button.on[data-u="0.5"]{background:var(--amber)}
.ub button.on[data-u="1"]{background:var(--green)}
.ub button.on[data-u="1.5"]{background:var(--blue)}
html[data-theme=dark] .ub button.on{color:#0B0E13}
/* الأسبوع */
.seg{display:grid;grid-template-columns:repeat(var(--n,2),1fr);gap:3px;background:var(--row);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:700;font-size:14.5px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #1018281f}
.seg button:disabled{opacity:.6}
html[data-theme=dark] .seg button.on{background:#2A303C}
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th{background:var(--row);color:var(--sub);font-size:12px;font-weight:800;padding:7px 6px;text-align:center}
.tbl th:first-child{text-align:right;padding-inline-start:12px}
.tbl td{padding:8px 4px;border-top:1px solid var(--row);text-align:center;font-weight:700;font-size:14.5px;cursor:pointer;direction:ltr;font-variant-numeric:tabular-nums}
.tbl td:first-child{direction:rtl;text-align:right;padding-inline-start:12px}
.tbl td small{display:block;color:var(--sub);font-size:11px;font-weight:600}
.tbl td small.bk{color:var(--red)}
.tbl td small.ok{color:var(--green)}
.tbl td.net{font-size:18px;font-weight:800;color:var(--green)}
.tbl td.net.z{color:var(--sub);font-size:14px}
.tbl tbody tr:active td{background:var(--row)}
.tbl .z{color:var(--sub);font-weight:500}
.tbl tfoot td{background:var(--row);border-top:1px solid var(--line);cursor:default;font-weight:800;font-size:14px}
.tbl tfoot td.net{font-size:16px}
.pay{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:9px;height:32px;padding:0 10px;font-weight:800;font-size:13px}
html[data-theme=dark] .pay{color:#06140d}
.paid{color:var(--green);font-size:11.5px;font-weight:800;line-height:1.3;direction:rtl;display:block}
.big{width:100%;height:52px;border:0;border-radius:13px;font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.big:active{transform:scale(.98)}
.big:disabled{opacity:.6}
.b-ok{background:var(--green);color:#fff}
html[data-theme=dark] .b-ok{color:#06140d}
.b-dark{background:var(--pri);color:var(--pri-t)}
.b-home{background:var(--card);color:var(--ink);border:1px solid var(--field)}
.b-red{background:var(--red);color:#fff}
.b-redo{background:var(--card);color:var(--red);border:1px solid var(--red)}
/* تفاصيل عامل: كل يوم سطر وجنبه حالته (بتتغير من هنا) */
.days{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.dr,.ar{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--row);min-height:56px}
.dr:last-child,.ar:last-child{border-bottom:0}
.dr.todo{box-shadow:inset -3px 0 0 var(--amber)}
.dr .nm,.ar .nm{flex:1;min-width:0}
.dr .nm b,.ar .nm b{display:block;font-size:15px;font-weight:800;line-height:1.35}
.dr .nm small,.ar .nm small{display:block;font-size:11.5px;font-weight:600;color:var(--sub);line-height:1.4}
.ar{cursor:pointer}.ar:active{background:var(--row)}
.ar .money{font-size:16.5px}
.sn{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green-l);border-radius:13px;padding:9px 14px;margin:0 0 6px}
.sn span{font-size:13px;font-weight:700;color:var(--sub);line-height:1.5}
.sn b{font-size:28px;color:var(--green);line-height:1.2}
.hd2{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:14px 2px 6px;font-size:13px;font-weight:800;color:var(--sub)}
.hd2 b{color:var(--ink)}
.mini-b{border:1px solid var(--field);background:var(--card);border-radius:10px;height:34px;padding:0 13px;font-weight:800;font-size:13.5px;color:var(--ink)}
.mini-b:active{background:var(--row)}
.none{padding:12px;text-align:center;color:var(--sub);font-weight:600;font-size:13.5px}
.dots{display:flex;gap:4px;margin:4px 0 2px}
.dots i{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--field);display:block}
.dots i.u0{background:var(--red);border-color:var(--red)}.dots i.u05{background:var(--amber);border-color:var(--amber)}.dots i.u1{background:var(--green);border-color:var(--green)}.dots i.u15{background:var(--blue);border-color:var(--blue)}.dots i.f{opacity:.3}
.tiny{border:1px solid var(--line);background:var(--row);border-radius:20px;padding:0 11px;height:26px;font-size:12px;font-weight:700;color:var(--sub)}
.tiny.on{background:var(--green-l);border-color:transparent;color:var(--green)}
/* شريط أيام الأسبوع في النهارده */
.wk{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:0 0 10px}
.wk button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:5px 0 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11.5px;font-weight:700;color:var(--sub);box-shadow:var(--shadow);min-height:62px}
.wk button b{font-size:18px;color:var(--ink);line-height:1.25}
.wk button i{width:18px;height:4px;border-radius:3px;background:var(--row);margin-top:2px}
.wk .s-ok i{background:var(--green)}.wk .s-p i{background:var(--amber)}.wk .s-e i{background:var(--red)}
.wk button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-t)}.wk button.on b{color:var(--pri-t)}
.wk button:disabled{opacity:.35;box-shadow:none}
.wr .nm{cursor:pointer}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--row);font-size:14.5px;font-weight:600}
.kv:last-child{border-bottom:0}
.kv b{font-weight:800}
.kv.tot{font-size:16px}.kv.tot b{font-size:25px;color:var(--green)}
.kv.sub{padding:3px 0;padding-inline-start:12px;font-size:13px;color:var(--sub);cursor:pointer}
.neg{color:var(--red)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* العمال */
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.tag.stop{background:var(--wait-l);color:var(--wait)}.tag.gone{background:var(--row);color:var(--sub)}.tag.debt{background:var(--red-l);color:var(--red)}
.mo{margin-top:12px}.mo:first-child{margin-top:0}
.mh{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--shadow)}
.mh:active{background:var(--row)}
.mh .car{font-style:normal;color:var(--sub);font-size:13px;transition:transform .15s}
.mo.shut .car{transform:rotate(90deg)}
.mh .m{flex:1;min-width:0}.mh .m b{display:block;font-size:16.5px;font-weight:800}.mh .m small{display:block;color:var(--sub);font-size:12px;font-weight:600}
.mh .money{font-size:19px;color:var(--green)}
.mo .list{margin-top:6px}.mo.shut .list{display:none}
details.more{margin-top:12px}
details.more summary{font-weight:800;color:var(--gold-d);font-size:14px;padding:6px 4px;cursor:pointer}
/* السجل */
.log{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.lg{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid var(--row);font-size:14px;font-weight:600;line-height:1.65}
.lg:last-child{border-bottom:0}
.lg .tx{flex:1;min-width:0;unicode-bidi:isolate}
.lg .tm{flex:none;color:var(--sub);font-size:12px;font-weight:700;white-space:nowrap;direction:rtl;unicode-bidi:isolate;padding-top:2px}
.lg .who{display:inline-block;font-weight:800;font-size:12px;border-radius:6px;padding:0 7px;margin-inline-end:6px;background:var(--row);color:var(--ink)}
.lg .who.c0{background:var(--blue-l);color:var(--blue)}.lg .who.c1{background:var(--green-l);color:var(--green)}.lg .who.c2{background:var(--gold-l);color:var(--gold-d)}.lg .who.auto{background:var(--row);color:var(--sub)}
.lg.chg{box-shadow:inset -3px 0 0 var(--amber)}
.lg.del{box-shadow:inset -3px 0 0 var(--red)}
.lg .more[hidden]{display:none}
.lg .more{display:block;color:var(--sub);font-size:12.5px;margin-top:2px}
.lg button.nm{border:0;background:none;padding:0;color:var(--gold-d);font-weight:800;font-size:12.5px}
.fchips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;margin:0 0 4px;scrollbar-width:none}
.fchips::-webkit-scrollbar{display:none}
.fchips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:4px 13px;font-weight:700;font-size:13px;color:var(--sub)}
.fchips button.on{background:var(--pri);border-color:var(--pri);color:var(--pri-t)}
/* إعدادات */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card h2{font-size:14px;margin:0 0 9px;font-weight:800;color:var(--ink)}
.card label{display:block;font-size:12.5px;font-weight:700;color:var(--sub);margin:10px 0 5px}.card h2+label{margin-top:0}

<script id="engine">
'use strict';
/* ====================== قواعد الحساب (دوال صافية من غير شاشة — الاختبارات بتشغلها لوحدها) ======================
   كل الفلوس بالقرش أرقام صحيحة. التواريخ نص YYYY-MM-DD بتوقيت القاهرة. */
const pad2 = n => String(n).padStart(2, '0');
const ymd = iso => iso.split('-').map(Number);
const addDays = (iso, n) => { const [y, m, d] = ymd(iso); return new Date(Date.UTC(y, m - 1, d + n)).toISOString().slice(0, 10); };
const weekday = iso => { const [y, m, d] = ymd(iso); return new Date(Date.UTC(y, m - 1, d)).getUTCDay(); };   // 0=الأحد … 5=الجمعة 6=السبت
/* خميس القبض اللي اليوم ده تبعه: الجمعة تبع الخميس اللي قبلها */
function ownerThursday(iso) { const wd = weekday(iso); return wd === 5 ? addDays(iso, -1) : addDays(iso, (4 - wd + 7) % 7); }
/* أيام الأسبوع: السبت..الخميس شغل، وبعدهم الجمعة */
const weekDates = thu => [5, 4, 3, 2, 1, 0].map(b => addDays(thu, -b)).concat([addDays(thu, 1)]);
const UNITS = [0, 0.5, 1, 1.5];
const U_BTN = {0: 'غاب', 0.5: 'نص', 1: 'يوم', 1.5: 'يوم ونص'};
function unitsText(n) {
  n = Math.round(n * 2) / 2;
  if (n === 0) return 'من غير أيام';
  if (n === 0.5) return 'نص يوم';
  if (n === 1) return 'يوم';
  if (n === 1.5) return 'يوم ونص';
  if (n === 2) return 'يومين';
  if (n === 2.5) return 'يومين ونص';
  return n % 1 ? `${Math.floor(n)} أيام ونص` : `${n} أيام`;
}
/* المرتب والصافي لعامل في أسبوع (بالقرش) */
function settle({daysPay = 0, fridayPay = 0, bonus = 0, advances = 0, oldDeduct = 0, prevFridayDelta = 0, carryIn = 0}) {
  const wages = daysPay + fridayPay + bonus;
  const after = wages - advances - prevFridayDelta - carryIn;
  if (after <= 0) return {wages, oldApplied: 0, net: 0, carryOut: -after};
  const oldApplied = Math.min(Math.max(oldDeduct, 0), after);
  return {wages, oldApplied, net: after - oldApplied, carryOut: 0};
}
/* فهرس الحركات (الحية بس). أنواع السجلات (k):
   sup مشرف، wk عامل، day يوم (d_<عامل>_<تاريخ>)، adv سلفة، bon حافز، wst حالة أسبوع (ws_<خميس>: الجمعة شغل/إجازة)،
   lk قفل أسبوع (lk_<خميس> فيه اللقطة snap)، pd قبض (pd_<خميس>_<عامل>)، log سطر سجل.
   المرحلة التانية: old سلفة قديمة (eff = أول خميس بتتخصم منه)، rule قاعدة خصم لعامل (ru_<عامل>: mode none|auto|fixed و amt و eff)،
   wded خصم الأسبوع ده بس (wd_<خميس>_<عامل>: mode skip|amt)، fdf فرق جمعة (fd_<خميس>_<عامل>: done 0|1 = جه ولا لأ في جمعة الأسبوع اللي فات). */
function buildIdx(list) {
  const I = {W: new Map(), day: new Map(), dayBy: new Map(), adv: [], bon: [], ws: new Map(), lk: new Map(), pd: new Map(), sup: [], log: [], old: [], rule: new Map(), wded: new Map(), fdf: new Map(), cus: [], exp: [], lgclr: null, first: null, memo: new Map()};
  list.forEach(r => {
    if (!r || r.del) return;
    if (r.k === 'wk') I.W.set(r.id, r);
    else if (r.k === 'day') { I.day.set(r.w + '|' + r.date, r); if (!I.dayBy.has(r.date)) I.dayBy.set(r.date, []); I.dayBy.get(r.date).push(r); }
    else if (r.k === 'adv') I.adv.push(r);
    else if (r.k === 'bon') I.bon.push(r);
    else if (r.k === 'wst') I.ws.set(r.thu, r);
    else if (r.k === 'lk') I.lk.set(r.thu, r);
    else if (r.k === 'pd') I.pd.set(r.thu + '|' + r.w, r);
    else if (r.k === 'sup') I.sup.push(r);
    else if (r.k === 'log') I.log.push(r);
    else if (r.k === 'lgclr') I.lgclr = r;
    else if (r.k === 'cus') I.cus.push(r);
    else if (r.k === 'exp') I.exp.push(r);
    else if (r.k === 'old') I.old.push(r);
    else if (r.k === 'rule') I.rule.set(r.w, r);
    else if (r.k === 'wded') I.wded.set(r.thu + '|' + r.w, r);
    else if (r.k === 'fdf') I.fdf.set(r.thu + '|' + r.w, r);
  });
  const ths = [];
  I.W.forEach(w => { if (w.from) ths.push(ownerThursday(w.from)); });
  I.day.forEach(d => ths.push(ownerThursday(d.date)));
  I.adv.forEach(a => ths.push(ownerThursday(a.date)));
  I.bon.forEach(b => ths.push(b.thu));
  I.first = ths.sort()[0] || null;
  return I;
}
/* حساب أسبوع: لو مقفول بنرجّع اللقطة المثبتة، وإلا بنحسب من الحركات (fresh = احسب حتى لو مقفول، وقت القفل أو إعادة الحساب).
   oldPaid = اللي اتخصم من السلف القديمة لكل عامل لحد الأسبوع ده (تراكمي). */
function calcWeek(I, thu, fresh) {
  const lk = I.lk.get(thu);
  if (!fresh && lk && lk.snap) return {thu, closed: true, lk, fri: lk.snap.fri, rows: lk.snap.rows, total: lk.snap.total, oldPaid: lk.snap.oldPaid || {}};
  const key = thu + (fresh ? '!' : '');
  if (I.memo.has(key)) return I.memo.get(key);
  const ds = weekDates(thu), work = ds.slice(0, 6);
  const ws = I.ws.get(thu), fri = ws && ws.fri === 'work' ? 'work' : 'off';
  const prev = addDays(thu, -7), pw = I.first && prev >= I.first ? calcWeek(I, prev) : null;
  const pf = pw && pw.fri === 'work' ? pw : null;         // الجمعة اللي فاتت كانت شغل: فرق الجمعة
  const prevPaid = pw && pw.oldPaid ? pw.oldPaid : {};
  const fdDelta = id => { const pay = pf && pf.rows[id] ? pf.rows[id].fridayPay || 0 : 0, f = I.fdf.get(thu + '|' + id); return pay ? Math.round((1 - (f ? f.done : 1)) * pay) : 0; };
  const ids = new Set();
  I.W.forEach(w => { if (w.st === 'on' && (!w.from || w.from <= thu)) ids.add(w.id); });
  work.forEach(d => (I.dayBy.get(d) || []).forEach(r => ids.add(r.w)));
  const advs = I.adv.filter(a => ownerThursday(a.date) === thu), bons = I.bon.filter(b => b.thu === thu);
  advs.forEach(a => ids.add(a.w)); bons.forEach(b => ids.add(b.w));
  if (pw) Object.keys(pw.rows).forEach(id => { if (pw.rows[id].carryOut || fdDelta(id)) ids.add(id); });
  const rows = {}, oldPaid = Object.assign({}, prevPaid);
  let total = 0;
  ids.forEach(id => {
    const w = I.W.get(id); if (!w) return;
    const days = {};
    let daysPay = 0, units = 0;
    work.forEach(d => { const r = I.day.get(id + '|' + d); if (r) { days[d] = r.u; units += r.u; daysPay += Math.round(r.u * r.rate); } });
    const fridayPay = fri === 'work' && w.st === 'on' ? (w.fri || 0) : 0;
    const bonus = bons.filter(b => b.w === id).reduce((s, b) => s + b.amt, 0);
    const advances = advs.filter(a => a.w === id).reduce((s, a) => s + a.amt, 0);
    const carryIn = pw && pw.rows[id] ? pw.rows[id].carryOut || 0 : 0;
    const prevFridayDelta = fdDelta(id);
    /* السلف القديمة: الباقي = مجموعها − اللي اتخصم قبل كده. الطلب: خصم الأسبوع ده (wded) وإلا قاعدة العامل (rule) */
    const oldTotal = I.old.filter(o => o.w === id && o.eff <= thu).reduce((s, o) => s + o.amt, 0);
    const oldBefore = Math.max(oldTotal - (prevPaid[id] || 0), 0);
    const wd = I.wded.get(thu + '|' + id), ru = I.rule.get(id);
    /* لو الأسبوع مقفول واتعاد حسابه بعد تعديل: بنحتفظ بطلب الخصم اللي اتثبت وقت القفل (تغيير القاعدة بعد كده مبيغيرش الأسابيع القديمة) */
    const sr = fresh && lk && lk.snap && lk.snap.rows[id], keep = !wd && sr && sr.oldReq !== undefined;
    let req = 0, auto = false;
    if (wd) req = wd.mode === 'skip' ? 0 : wd.amt || 0;
    else if (keep) { auto = !!sr.oldAuto; req = auto ? oldBefore : sr.oldReq; }
    else if (ru && ru.eff <= thu) { auto = ru.mode === 'auto'; req = auto ? oldBefore : ru.mode === 'fixed' ? ru.amt || 0 : 0; }
    const oldDeduct = Math.min(Math.max(req, 0), oldBefore);
    const s = settle({daysPay, fridayPay, bonus, advances, oldDeduct, prevFridayDelta, carryIn});
    if (oldTotal || prevPaid[id]) oldPaid[id] = (prevPaid[id] || 0) + s.oldApplied;
    rows[id] = Object.assign({w: id, name: w.name, days, units, daysPay, fridayPay, bonus, advances, carryIn, prevFridayDelta, oldBefore, oldReq: req, oldAuto: auto, oldLeft: oldBefore - s.oldApplied, oldSkip: !!(wd && wd.mode === 'skip')}, s);
    total += s.net;
  });
  const res = {thu, closed: false, fri, rows, total, oldPaid};
  I.memo.set(key, res);
  return res;
}
/* الأسبوع فيه أي تسجيل؟ (أيام، سلف، حافز، الجمعة). الأسبوع الفاضي خالص مبيتقفلش تلقائي (زي عامل اتضاف بتاريخ قديم) */
function weekHasData(I, thu) {
  if (weekDates(thu).slice(0, 6).some(d => (I.dayBy.get(d) || []).some(r => r.by !== 'تلقائي'))) return true;
  return I.adv.some(a => ownerThursday(a.date) === thu) || I.bon.some(b => b.thu === thu) || I.ws.has(thu);
}
/* الأيام الناقصة للعمال الشغالين (ممنوع القفل اليدوي لو فيه حاجة ناقصة) */
function missingDays(I, thu) {
  const out = [];
  [...I.W.values()].filter(w => w.st === 'on').sort((a, b) => (a.ord || 0) - (b.ord || 0)).forEach(w => {
    weekDates(thu).slice(0, 6).forEach(d => { if ((!w.from || d >= w.from) && !I.day.has(w.id + '|' + d)) out.push({w: w.id, name: w.name, date: d}); });
  });
  return out;
}
</script>

<script>
'use strict';
/*
  المرتبات (قبض العمال) — فلاش أون
  ---------------------------------
  - تطبيق منفصل تماماً عن الحسابات والخزنة. شيت جوجل لوحده (كوده payScript تحت)، وتخزين على الموبايل في fo_pay_v1 بس.
  - 3 مشرفين بالكتير. كل واحد بيدخل باسمه ورقم سري 4 أرقام (بيتحفظ في الشيت hash مش نص). على نفس الموبايل مبيتطلبش تاني.
  - كل حركة سجل بـ id ثابت و upd و by (اسم المشرف) و at (الوقت). الأحدث upd يكسب. سطر السجل (log) مبيتعدلش أبداً.
  - الصافي والمرحّل بيتحسبوا على الموبايل من الحركات (calcWeek)، ومش بيتخزنوا. بعد القفل اللقطة بتتحفظ في lk_<خميس>.
  - المزامنة زي "حركة السوق": push/pull بـ seq، كل 5 ثواني، ومن غير navigator.onLine.
  - رابط الربط للشريك: payroll.html#payjoin=<{u,k}>.
*/
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const normDigits = s => String(s ?? '').replace(/[٠-٩]/g, d => d.charCodeAt(0) - 1632).replace(/[۰-۹]/g, d => d.charCodeAt(0) - 1776);
const norm = s => normDigits(s).toLowerCase().replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/\s+/g, ' ').trim();
const fmt = p => { const a = Math.round(Math.abs(+p || 0)); return (a / 100).toLocaleString('en-US', {maximumFractionDigits: 2}); };
const fmtN = p => (p < 0 ? '-' : '') + fmt(p);
const AR_DAYS = ['الأحد', 'الاتنين', 'التلات', 'الأربع', 'الخميس', 'الجمعة', 'السبت'];
const RLM = '‏';
const TZ = 'Africa/Cairo';
const DF = new Intl.DateTimeFormat('en-CA', {timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit'});
const TF = new Intl.DateTimeFormat('en-GB', {timeZone: TZ, hour: '2-digit', minute: '2-digit', hourCycle: 'h23'});
const dayOf = ms => DF.format(new Date(ms));
const today = () => dayOf(Date.now());
const timeOf = ms => { const [h, m] = TF.format(new Date(ms)).split(':').map(Number); return `${h % 12 || 12}:${pad2(m)} ${h < 12 ? 'ص' : 'م'}`; };
const dm = iso => `${+iso.slice(8)}${RLM}/${RLM}${+iso.slice(5, 7)}`;
const dayName = iso => AR_DAYS[weekday(iso)];
const dayFull = iso => `${dayName(iso)} ${dm(iso)}`;
const whenTxt = ms => (dayOf(ms) === today() ? '' : dm(dayOf(ms)) + ' ') + timeOf(ms);

/* ====================== التخزين على الموبايل ====================== */
const LS = 'fo_pay_v1';
let S;
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(LS)); } catch (e) {}
  S = Object.assign({u: '', k: '', dev: '', cursor: 0, me: '', recs: {}, lastOk: 0, lastPull: 0, bad: false}, d || {});
  if (!S.dev) S.dev = Array.from(crypto.getRandomValues(new Uint8Array(3)), x => x.toString(36).padStart(2, '0')).join('');
}
function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) { toast('الموبايل مش قادر يحفظ.', 6000); } }
load();
const newId = p => p + '_' + Date.now().toString(36) + S.dev + Math.random().toString(36).slice(2, 6);
let IDX = null;
const idx = () => IDX || (IDX = buildIdx(Object.values(S.recs)));
const dirty = () => { IDX = null; };
const me = () => { const r = S.recs[S.me]; return r && !r.del && r.k === 'sup' ? r : null; };
const myName = () => (me() || {}).name || '؟';
const wName = id => (S.recs[id] || {}).name || '؟';

/* حفظ حركة: نفس الـ id = نفس الحركة (الأحدث يكسب). by و at = مين عمل آخر تغيير وإمتى */
function put(k, data) {
  const now = Date.now(), cur = S.recs[data.id];
  const r = Object.assign({}, cur || {}, data, {k, by: myName(), at: now, upd: Math.max(now, (cur ? cur.upd : 0) + 1), del: !!data.del});
  delete r.sy;
  S.recs[r.id] = r; dirty();
  return r;
}
function log(txt, extra) { return put('log', Object.assign({id: newId('l'), txt}, extra || {})); }
function commit() { save(); dirty(); sync(); }

/* رابط الربط (فيه لينك الشيت ومفتاحه بعد # — مبيتبعتش لأي سيرفر) */
const b64u = str => btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = str => decodeURIComponent(escape(atob(str.replace(/-/g, '+').replace(/_/g, '/'))));
(function join() {
  const m = location.hash.match(/payjoin=([\w-]+)/);
  if (!m) return;
  let o = null; try { o = JSON.parse(unb64u(m[1])); } catch (e) {}
  history.replaceState(null, '', location.pathname);
  if (!o || !o.u || !o.k) { setTimeout(() => toast('الرابط ناقص. اطلب من شريكك يبعته تاني.', 8000), 300); return; }
  if (S.u !== o.u) { S.cursor = 0; S.lastPull = 0; Object.values(S.recs).forEach(r => { delete r.sy; }); }

async function pinHash(sid, pin) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('fo-pay|' + sid + '|' + pin));

      if (i !== undefined && Number(cur[i][2]) >= Number(r.upd)) return;

/* ---------- حاجات مشتركة ---------- */
/* العمال اللي بيظهروا في يوم: الشغالين اللي بدأوا قبله + أي حد متسجله اليوم ده */
function workersOn(I, d) {

  I.W.forEach(w => { if (w.st === 'on' && (!w.from || w.from <= d)) ids.add(w.id); });
  (I.dayBy.get(d) || []).forEach(r => ids.add(r.w));

}
const byTxt = r => r ? `${esc(r.by)} ${whenTxt(r.at)}` : '';

/* ---------- النهارده: سطر لكل عامل وجنبه غاب/نص/يوم/يوم ونص ---------- */
function defDay() { const t = today(); return weekday(t) === 5 ? addDays(t, -1) : t; }
/* الأيام اللي فاتت في الأسبوع (لحد النهارده) وفيها عمال لسه متسجلوش */
function missingSoFar(I, thu, upto) {

  missingDays(I, thu).forEach(m => { if (m.date < upto) (per[m.date] = per[m.date] || []).push(m.name); });
  return Object.keys(per).sort().map(d => ({d, n: per[d].length}));

/* فرق الجمعة: لو الجمعة اللي فاتت كانت شغل واتقفلت، العمال اللي اتدفعلهم بيظهروا هنا في الأسبوع الحالي. الكل محسوب "جه" لحد ما تعلّم اللي مجاش، وأجره بيتخصم من الخميس ده */

  if (!ids.length) return '';

    const f = I.fdf.get(thu + '|' + id), done = f ? f.done : 1, pay = pw.rows[id].fridayPay;
    return `<div class="wr"><div class="nm"><b>${esc(pw.rows[id].name)}</b><small class="sm ${done ? '' : 'bk'}">${done ? 'جه (اتدفعله ' + fmt(pay) + ')' : 'مجاش — هيتخصم ' + fmt(pay)}${f ? ' · ' + byTxt(f) : ''}</small></div><div class="ub" style="grid-template-columns:repeat(2,auto)"><button type="button" data-fd="${esc(id)}" data-u="1" class="${done ? 'on' : ''}">جه</button><button type="button" data-fd="${esc(id)}" data-u="0" class="${done ? '' : 'on'}">مجاش</button></div></div>`;

function setFriCame(wid, thu, v) {

}
/* مسح بيانات أسبوع مفتوح (أيام، سلف، حوافز، الجمعة، خصم الأسبوع، فرق الجمعة). العمال والسلف القديمة وقواعد الخصم بتفضل. السجل بيفضل وبيتسجل فيه المسح */
async function wipeWeek(thu) {
  const I = idx();
  if (I.lk.has(thu)) return toast('الأسبوع ده مقفول');
  const ds = weekDates(thu).slice(0, 6), ws = I.ws.get(thu);
  const hit = [...I.dayBy.entries()].filter(([d]) => ds.includes(d)).flatMap(([, l]) => l)
    .concat(I.adv.filter(a => ownerThursday(a.date) === thu), I.bon.filter(b => b.thu === thu), ws ? [ws] : [],
      [...I.wded.values()].filter(x => x.thu === thu), [...I.fdf.values()].filter(x => x.thu === thu));
  if (!hit.length) return toast('مفيش حاجة متسجلة في الأسبوع ده');
  const n = k => hit.filter(r => r.k === k).length;
  if (!(await ask(`تمسح كل اللي اتسجل في أسبوع الخميس ${dm(thu)}؟ (${n('day')} يوم، ${n('adv')} سلفة، ${n('bon')} حافز). العمال بيفضلوا، والمسح مبيتراجعش.`, '🗑 أيوه امسح', 'لأ', true))) return;
  hit.forEach(r => put(r.k, {id: r.id, del: true}));
  log(`${myName()} مسح كل حركات أسبوع الخميس ${dm(thu)} (${n('day')} يوم، ${n('adv')} سلفة، ${n('bon')} حافز)`, {thu});
  commit(); drawWeek(); toast('اتمسح ✔');
}
async function payOut(wid, thu) {
  const I = idx(), c = calcWeek(I, thu), r = c.rows[wid];
  if (!c.closed || !r) return;
  const p = I.pd.get(thu + '|' + wid);

    if (!(await ask(`${r.name} اتعلّم إنه قبض ${fmt(p.amt)} (${p.by} ${whenTxt(p.at)}). تلغي ده؟`, 'أيوه، لسه مقبضش', 'لأ', true))) return;
    put('pd', {id: p.id, del: true});
    log(`${myName()} لغى قبض ${r.name} (أسبوع الخميس ${dm(thu)})`, {w: wid, thu});
  } else {
    put('pd', {id: 'pd_' + thu + '_' + wid, w: wid, thu, amt: r.net});
    log(`${myName()} سلّم ${r.name} مرتبه ${fmt(r.net)} (أسبوع الخميس ${dm(thu)})`, {w: wid, thu});
  }
  commit(); closeModal(); render();
}

/* أول خميس لسه مقفولش: السلف القديمة والقاعدة بتبدأ منه (الأسابيع اللي اتقفلت قبله مبتتغيرش) */
function firstOpenThu() {
  const I = idx(), nowThu = ownerThursday(today());

}
/* الباقي من السلف القديمة بعد الأسبوع الحالي */

}

/* ---------- الأرشيف: كل الأسابيع متجمعة في شهور (الأسبوع بيتحسب على شهر خميس القبض)، قدام كل أسبوع وكل شهر إجمالي المرتبات ---------- */
const MONTHS = ['يناير', 'فبراير', 'مارس', 'أبريل', 'مايو', 'يونيو', 'يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'];
const monthTitle = ym => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
let archOpen = {};   // الشهور اللي المستخدم فتحها/قفلها (الباقي: آخر شهر مفتوح بس)
/* بيرجّع الشهور (الأقدم أول)، كل شهر فيه أسابيعه (مقفولة بلقطتها، أو الحالي/اللي لسه متقفلش محسوبة حية) وإجماليها */
function archiveMonths(I) {
  const nowThu = ownerThursday(today()), set = new Set(I.lk.keys()), map = new Map();
  for (let t = I.first; t && t <= nowThu; t = addDays(t, 7)) set.add(t);
  [...set].sort().forEach(thu => {
    const lk = I.lk.get(thu), closed = !!(lk && lk.snap);
    if (!closed && (thu > nowThu || (thu !== nowThu && !weekHasData(I, thu)))) return;
    const c = calcWeek(I, thu), rs = Object.values(c.rows || {});
    if (!closed && !rs.length) return;
    const ym = thu.slice(0, 7);
    if (!map.has(ym)) map.set(ym, {ym, weeks: [], total: 0, wages: 0, adv: 0, open: false});
    const m = map.get(ym);
    m.weeks.push({thu, c, closed, lk});
    m.total += c.total || 0; m.wages += rs.reduce((s, r) => s + (r.wages || 0), 0); m.adv += rs.reduce((s, r) => s + (r.advances || 0), 0);
    if (!closed) m.open = true;
  });
  return [...map.values()];
}
/* كل عامل خد كام في الشهر ده (بما فيهم اللي مشى: اسمه بيفضل من لقطات الأسابيع) */

    a.wages += r.wages || 0; a.adv += r.advances || 0; a.net += r.net || 0;

  const list = Object.values(acc).sort((a, b) => ((I.W.get(a.w) || {}).ord || 0) - ((I.W.get(b.w) || {}).ord || 0));

    ${list.map(a => { const w = I.W.get(a.w); return `<tr><td><b>${esc((w || a).name)}${w && w.st === 'gone' ? '<span class="tag gone">مشى</span>' : ''}</b></td><td>${fmt(a.wages)}</td><td class="${a.adv ? 'bk' : ''}">${nz(a.adv)}</td><td class="net">${fmt(a.net)}</td></tr>`; }).join('')}</tbody>
    <tfoot><tr><td>الإجمالي</td><td>${fmt(m.wages)}</td><td class="${m.adv ? 'bk' : ''}">${nz(m.adv)}</td><td class="net">${fmt(m.total)}</td></tr></tfoot></table>

/* ---------- مصاريف: عهدة (فلوس بتتسلّم) ومصروفات بتتصرف منها، والصافي بينهم. منفصلة عن حساب المرتبات ---------- */

function drawExp() {

/* ---------- السجل: كل تغيير بالترتيب، ومفيش حاجة بتتمسح منه ---------- */
let logN = 150, logWho = '', logChg = false;
const logKind = t => /مسح|لغى/.test(t) ? 'del' : /غيّر|بعد القفل/.test(t) ? 'chg' : '';
/* بيلم قايمة الأسامي الطويلة (زي "علّم الكل يوم") في "(8 عمال)" ودوسة بتفتحها */
function logBody(l, i) {
  let t = esc(l.txt), who = l.by || '';
  const m = t.match(/ \(([^()]*)\)/);
  if (m && m[1].split('،').length >= 3) {
    const n = m[1].split('،').length;
    t = t.replace(m[0], ` (<button class="nm" type="button" data-x="${i}">${n} عمال ▾</button>)`) + `<span class="more" id="lx${i}" hidden>${m[1]}</span>`;
  }
  if (who && t.startsWith(esc(who) + ' ')) t = t.slice(esc(who).length);
  return {who, t};
}
function drawLog() {
  const I = idx(), sups = I.sup.slice().sort((a, b) => a.at - b.at).map(x => x.name);
  const cut = (I.lgclr || {}).cut || 0, all = I.log.filter(l => l.at > cut).sort((a, b) => b.at - a.at);
  const ls = all.filter(l => (!logWho || l.by === logWho) && (!logChg || logKind(l.txt))), shown = ls.slice(0, logN);
  const whos = sups.concat(all.some(l => l.by === 'تلقائي') ? ['تلقائي'] : []);
  let last = '', html = '';
  shown.forEach((l, i) => {
    const d = dayOf(l.at), b = logBody(l, i), ci = sups.indexOf(b.who);
    if (d !== last) { if (last) html += '</div>'; html += `<div class="lbl"><span>${dayFull(d)}${d === today() ? ' · النهارده' : ''}</span></div><div class="log">`; last = d; }
    html += `<div class="lg ${logKind(l.txt)}"><div class="tx">${b.who ? `<span class="who ${b.who === 'تلقائي' ? 'auto' : 'c' + (ci < 0 ? 0 : ci % 3)}">${esc(b.who)}</span>` : ''}${b.t}</div><span class="tm">${timeOf(l.at)}</span></div>`;
  });
  if (last) html += '</div>';
  $('#main').innerHTML = `<div class="fchips" id="lgF"><button type="button" data-w="" class="${!logWho && !logChg ? 'on' : ''}">الكل</button>${whos.map(w => `<button type="button" data-w="${esc(w)}" class="${logWho === w ? 'on' : ''}">${esc(w)}</button>`).join('')}<button type="button" data-c="1" class="${logChg ? 'on' : ''}">✏️ التعديلات والمسح بس</button></div>`
    + (html || '<div class="list"><div class="empty">مفيش حاجة هنا</div></div>') + (ls.length > shown.length ? '<button class="lnk" id="lgMore" type="button">اعرض أقدم</button>' : '') + (all.length ? '<button class="big b-redo" id="lgClr" type="button">🗑 امسح السجل</button>' : '');
  if ($('#lgClr')) $('#lgClr').onclick = async () => {
    if (!(await ask('تمسح السجل كله؟ هيتمسح من عندك ومن عند شركائك، ومبيتراجعش.', '🗑 أيوه امسحه', 'لأ', true))) return;
    const cut = Date.now();
    put('lgclr', {id: 'lgclr', cut});
    log(`${myName()} مسح السجل`).at = cut + 1;
    commit(); logN = 150; logWho = ''; logChg = false; drawLog(); toast('السجل اتمسح ✔');
  };
  $$('#lgF button').forEach(b => b.onclick = () => { if (b.dataset.c) logChg = !logChg; else { logWho = b.dataset.w; if (!logWho) logChg = false; } logN = 150; drawLog(); });
  $$('#main button[data-x]').forEach(b => b.onclick = () => { const e = $('#lx' + b.dataset.x); e.hidden = !e.hidden; });
  if ($('#lgMore')) $('#lgMore').onclick = () => { logN += 150; drawLog(); };
}

/* ---------- الإعدادات ---------- */
function normSheetUrl(t) {
  t = String(t || '').replace(/\s+/g, '');
  const m = t.match(/https:\/\/script\.google(?:usercontent)?\.com\/(?:a\/[^/]+\/)?macros\/s\/[\w-]+\/exec/);
  if (m) return m[0];
  const id = t.match(/AKfy[\w-]{20,}/);
  return id ? `https://script.google.com/macros/s/${id[0]}/exec` : t;
}
function makeKey() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', r = crypto.getRandomValues(new Uint8Array(12));
  return [...r].map(x => A[x % A.length]).join('').replace(/(.{4})(?!$)/g, '$1-');
}
async function connectSheet(u) {
  u = normSheetUrl(u);
  if (!/^https:\/\/script\.google(usercontent)?\.com\/.+\/exec$/.test(u)) return 'اللينك لازم يبدأ بـ https://script.google.com ويخلص بـ /exec';
  const k = S.k || makeKey();
  let j; try { j = await callSheet({action: 'ping'}, u, k, 30000); } catch (e) { return e.code === 'page' ? 'الشيت رد بصفحة مش مفهومة. غالباً الوصول مش "أي شخص (Anyone)".' : 'معرفتش أوصل للشيت. اتأكد من النت ومن اللينك.'; }
  if (j && j.error === 'key') return 'الشيت ده مقفول على مفتاح تاني. في Apps Script اختار الدالة resetKey واضغط تشغيل (Run) مرة، وجرّب تاني.';
  if (j && j.ok && j.app !== 'fo-pay') return 'الشيت ده عليه كود تاني (مش المرتبات). اعمل الخطوات وانسخ كود المرتبات من هنا في جدول جديد.';
  if (!j || !j.ok) return 'الشيت رد بخطأ: ' + (j && j.error || 'غير معروف');
  S.u = u; S.k = k; S.bad = false; S.cursor = 0; S.lastPull = 0; save();
  await sync();
  return '';
}

  if ($('#sHelp')) $('#sHelp').onclick = sheetHelp;
  if ($('#sLink')) $('#sLink').onclick = async () => {
    const b = $('#sLink'); b.disabled = true; b.textContent = '⏳ بيربط…'; $('#sErr').innerHTML = '';
    const err = await connectSheet($('#sUrl').value);
    if (err) { b.disabled = false; b.textContent = 'اربط'; $('#sErr').innerHTML = `<div class="note">${esc(err)}</div>`; return; }
    toast('✔ الشيت اتربط', 5000); drawSettings();
  };
  if ($('#sPing')) $('#sPing').onclick = async () => {
    const b = $('#sPing'); b.disabled = true; b.textContent = '⏳ بختبر…';
    let msg, ok = false;
    try {
      await sync();
      const j = await callSheet({action: 'ping'});
      if (j && j.error === 'key') msg = 'الشيت مقفول على مفتاح تاني. اطلب لينك التطبيق من جديد.';
      else if (!j || !j.ok) msg = 'الشيت رد بخطأ: ' + (j && j.error || 'غير معروف');
      else if (j.app !== 'fo-pay') msg = 'اللينك ده لشيت تاني مش شيت المرتبات.';
      else { const left = pending().length; ok = !left; msg = left ? `الشيت رد ✓ بس لسه ${left} حاجة مستنية تتبعت.` : `✓ الشيت شغال ورد دلوقتي. فيه ${j.n.toLocaleString('en-US')} سطر، وكل اللي على الموبايل ده واصل.`; }
    } catch (e) { msg = e.code === 'page' ? 'الشيت رد بصفحة مش مفهومة. غالباً الوصول مش "أي شخص (Anyone)".' : 'معرفتش أوصل للشيت. اتأكد من النت.'; }
    b.disabled = false; b.textContent = '🔍 اختبر الربط';
    $('#sTest').innerHTML = `<div class="${ok ? 'info' : 'note'}" style="margin:0 0 4px;${ok ? 'background:var(--green-l);color:var(--green)' : ''}">${esc(msg)}</div>`;
  };
  if ($('#sSync')) $('#sSync').onclick = async () => {
    $('#sSync').disabled = true; $('#sSync').textContent = '⏳ بحدّث…';
    await sync(); await new Promise(r => setTimeout(r, 300));
    toast(online === false ? 'مفيش نت دلوقتي. هيتبعت لوحده.' : '✔ اتحدّث');
    if (scr.v === 's') drawSettings();
  };
  $$('#uiTheme button').forEach(b => b.onclick = () => { uiSet({theme: b.dataset.v}); drawSettings(); });
  $$('#uiFs button').forEach(b => b.onclick = () => { uiSet({fs: b.dataset.v}); drawSettings(); });
}

route();
if (!S.u && autoClose()) { save(); refresh(); }
setTimeout(sync, 200);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', {updateViaCache: 'none'}).catch(() => {});
</script>
</body>
</html>
